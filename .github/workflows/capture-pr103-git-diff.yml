name: capture-pr103-git-diff

on:
  pull_request:
    paths:
      - ".github/workflows/capture-pr103-git-diff.yml"

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Extract actual git diff output
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: "29459017107"
          JOB_ID: "87498398250"
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="$GITHUB_HEAD_REF"
          gh run view "$RUN_ID" --repo "$repo" --job "$JOB_ID" --log > /tmp/job.log
          python3 - <<'PY'
          from pathlib import Path
          import re

          raw = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace')
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          lines = []
          for original in raw.splitlines():
              line = ansi.sub('', original)
              parts = line.split('\t', 2)
              lines.append(parts[2] if len(parts) == 3 else line)

          output = []
          capturing = False
          for line in lines:
              if line.startswith('diff --git '):
                  capturing = True
              if capturing:
                  if line.startswith('##[endgroup]'):
                      break
                  output.append(line)
          if not output:
              output = [line for line in lines if (
                  'GUI artifact fixture block' in line or
                  'seedExhaustedDirectoryLock block' in line or
                  line.startswith('warning:') or
                  line.startswith('error:')
              )]
          Path('/tmp/diff.txt').write_text('\n'.join(output) or 'No actual git diff output found.', encoding='utf-8')
          PY
          {
            echo "## PR #103 actual git diff output"
            echo
            echo '```diff'
            cat /tmp/diff.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "$repo" --body-file /tmp/comment.md
          gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
