name: p1-3-bob-control-apply

on:
  pull_request:
    paths:
      - ".github/workflows/p1-3-bob-control-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply Bob control provenance wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          provenance_path = Path("extensions/workflow-register/src/core/runProvenance.ts")
          provenance = provenance_path.read_text(encoding="utf-8")
          anchor = 'function parseArtifactReuse(value: unknown): ArtifactReuseRecordLike | undefined {\n'
          formatter = '''export function workflowRunProvenanceControlLines(
            provenance: WorkflowRunProvenanceProjection,
            maxItems = 20
          ): string[] {
            const limit = Math.max(1, Math.min(50, Math.floor(maxItems)))
            const verifiedArtifacts = unique(provenance.steps
              .filter((step) => step.artifactVerified)
              .flatMap((step) => step.artifactIds))
            const lines = [
              provenance.sourceRunId ? `Reused from run: ${safeControlToken(provenance.sourceRunId)}` : undefined,
              provenance.startStepId ? `Reuse start step: ${safeControlToken(provenance.startStepId)}` : undefined,
              boundedControlList("Reused steps", provenance.reusedStepIds, limit),
              boundedControlList("Verified artifacts", verifiedArtifacts, limit),
              boundedControlList("Hydrated state keys", provenance.hydratedStateKeys, limit),
              provenance.taskSnapshotImportCount > 0
                ? `Imported from task snapshot: ${provenance.taskSnapshotImportCount} artifact(s)`
                : undefined,
              provenance.definitionMismatchAllowed ? "Definition mismatch allowed: yes" : undefined
            ]
            return lines.filter((value): value is string => Boolean(value))
          }

          function boundedControlList(label: string, values: readonly string[], limit: number): string | undefined {
            const safeValues = unique(values.map(safeControlToken).filter(isNonEmptyString))
            if (safeValues.length === 0) return undefined
            const shown = safeValues.slice(0, limit)
            const remaining = safeValues.length - shown.length
            return `${label}: ${shown.join(", ")}${remaining > 0 ? ` (+${remaining} more)` : ""}`
          }

          function safeControlToken(value: string): string {
            return value.replace(/[\\u0000-\\u001f\\u007f]/g, " ").replace(/\\s+/g, " ").trim().slice(0, 160)
          }

          '''
          if "export function workflowRunProvenanceControlLines" not in provenance:
              if anchor not in provenance:
                  raise SystemExit("runProvenance formatter anchor missing")
              provenance = provenance.replace(anchor, formatter + anchor, 1)
          provenance_path.write_text(provenance, encoding="utf-8")

          messages_path = Path("extensions/workflow-register/src/bobWorkflowMessages.ts")
          messages = messages_path.read_text(encoding="utf-8")
          interface_anchor = '  includeResume?: boolean\n'
          if '  provenanceLines?: readonly string[]\n' not in messages:
              if interface_anchor not in messages:
                  raise SystemExit("WorkflowControlBlockInput anchor missing")
              messages = messages.replace(interface_anchor, interface_anchor + '  provenanceLines?: readonly string[]\n', 1)

          resume_anchor = '  if (input.includeResume) lines.push("- 一時停止中の run は Run Monitor の「再開」から続行してください。")\n'
          provenance_block = '''  const provenanceLines = (input.provenanceLines ?? [])
            .map((line) => line.replace(/[\\u0000-\\u001f\\u007f]/g, " ").replace(/\\s+/g, " ").trim())
            .filter((line) => line.length > 0)
            .slice(0, 12)
            if (provenanceLines.length > 0) lines.push("", "Workflow provenance:", ...provenanceLines.map((line) => `- ${line}`))
          '''
          if "const provenanceLines = (input.provenanceLines ?? [])" not in messages:
              if resume_anchor not in messages:
                  raise SystemExit("control block resume anchor missing")
              messages = messages.replace(resume_anchor, resume_anchor + provenance_block, 1)
          messages_path.write_text(messages, encoding="utf-8")

          runner_path = Path("extensions/workflow-register/src/bobWorkflowRunner.ts")
          runner = runner_path.read_text(encoding="utf-8")
          runner_import_anchor = 'import type { ResultSinkRegistry } from "./core/resultSinkRegistry"\n'
          runner_import = 'import { projectWorkflowRunProvenance, workflowRunProvenanceControlLines } from "./core/runProvenance"\n'
          if runner_import not in runner:
              if runner_import_anchor not in runner:
                  raise SystemExit("bobWorkflowRunner import anchor missing")
              runner = runner.replace(runner_import_anchor, runner_import_anchor + runner_import, 1)

          control_anchor = '        includeResume\n'
          control_field = '        includeResume,\n        provenanceLines: workflowRunProvenanceControlLines(projectWorkflowRunProvenance(run))\n'
          if 'provenanceLines: workflowRunProvenanceControlLines(projectWorkflowRunProvenance(run))' not in runner:
              if control_anchor not in runner:
                  raise SystemExit("sendControlBlock anchor missing")
              runner = runner.replace(control_anchor, control_field, 1)
          runner_path.write_text(runner, encoding="utf-8")
          PY

      - name: Verify focused contracts
        working-directory: extensions/workflow-register
        run: |
          npm ci
          npm run compile
          node --test \
            test/workflowRunProvenance.test.js \
            test/bobWorkflowMessages.test.js \
            test/bobWorkflowReuseProvenance.test.js \
            test/bobTaskSync.test.js \
            test/operationHubStepProvenance.test.js \
            test/runControlViewReuseProvenance.test.js \
            test/workflowRunProvenanceDiagnostics.test.js

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/p1-3-bob-control-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: include reuse provenance in Bob controls"
          git push origin HEAD:${{ github.head_ref }}
