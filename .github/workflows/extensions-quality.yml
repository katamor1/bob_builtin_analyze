name: extensions-quality

on:
  pull_request:
    paths:
      - "extensions/workflow-register/**"
      - ".github/workflows/extensions-quality.yml"

permissions:
  contents: write

concurrency:
  group: extensions-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p1-4-final-contracts:
    name: P1-4 final mutation and evidence contracts
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: extensions/workflow-register
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - name: Apply final contracts and regressions
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import base64
          from pathlib import Path

          replacements = [
            (
              "extensions/workflow-register/src/gui/operationHubProvider.ts",
              "Y29uc3QgTVVUQVRJTkdfUlVOX0FDVElPTlM6IHJlYWRvbmx5IE9wZXJhdGlvbkh1YkFjdGlvbklkW10gPSBbCiAgInN0YXJ0RnJvbUFydGlmYWN0cyIsCiAgInJlc3VtZVJ1biIsCg==",
              "Y29uc3QgTVVUQVRJTkdfUlVOX0FDVElPTlM6IHJlYWRvbmx5IE9wZXJhdGlvbkh1YkFjdGlvbklkW10gPSBbCiAgInN0YXJ0RnJvbUFydGlmYWN0cyIsCiAgInJlY292ZXJEZXRhY2hlZEhlbGRSdW4iLAogICJyZXN1bWVSdW4iLAo="
            ),
            (
              "extensions/workflow-register/src/workflowRunCommands.ts",
              "ICAgICAgdGFza1NuYXBzaG90QXZhaWxhYmxlOiBzbmFwc2hvdHMuc29tZSgoc25hcHNob3QpID0+IHNuYXBzaG90LnN0ZXBJZCA9PT0gcnVuLmN1cnJlbnRTdGVwKQo=",
              ""
            ),
            (
              "extensions/workflow-register/test/operationHubHeldRecovery.test.js",
              "ICBhc3NlcnQubWF0Y2gocHJvdmlkZXIsIC9GaWxlVGFza1NuYXBzaG90U3RvcmUvKQogIGFzc2VydC5tYXRjaChleHRlbnNpb24sIC9hY3RpdmVTdGVwczogXChcKSA9PiBzZXJ2aWNlXC5saXN0QWN0aXZlU3RlcHNcKFwpLykKfSkK",
              ""
            ),
            (
              "extensions/workflow-register/test/detachedHeldRecoveryCommand.test.js",
              "ICBhc3NlcnQuZG9lc05vdE1hdGNoKGJvZHksIC9jb29yZGluYXRlV29ya2Zsb3dSdW5FeGVjdXRpb25cKHJ1blN0b3JlLCBzZWxlY3Rpb25cLnJ1bklkLCAicmVjb3ZlckRldGFjaGVkSGVsZFJ1biIvKQp9KQo=",
              ""
            )
          ]
          for file_name, old_b64, new_b64 in replacements:
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              old = base64.b64decode(old_b64).decode("utf-8")
              new = base64.b64decode(new_b64).decode("utf-8")
              if old not in text:
                  raise SystemExit(f"replacement anchor not found: {file_name}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install dependencies
        run: npm ci --silent
      - name: Verify focused and full suites
        shell: bash
        run: |
          set -euo pipefail
          npm run compile --silent
          node --test \
            test/bobGateLifecycle.test.js \
            test/heldRunRecoveryClassifier.test.js \
            test/operationHubHeldRecovery.test.js \
            test/operationHub.test.js \
            test/operationHubMutations.test.js \
            test/detachedHeldRecoveryCommand.test.js \
            test/heldRecoveryDiagnostics.test.js \
            test/workflowEngineGuardedResume.test.js
          npm test --silent
          npm run dependency:policy --silent
          npm run architecture:policy --silent
          npm run source:policy --silent
          npm run schema:policy --silent
          npm run package --silent
          npm run package:policy --silent
      - name: Restore standard CI and publish verified final contracts
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/extensions-quality.yml > .github/workflows/extensions-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize detached held recovery contracts"
          git push origin HEAD:${{ github.head_ref }}
