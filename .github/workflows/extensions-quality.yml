name: extensions-quality
run-name: ${{ github.event_name == 'workflow_dispatch' && format('wave0a-{0}-{1}', inputs.expectedHeadSha, inputs.dispatchNonce) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  pull_request:
    paths:
      - "packages/processing-budget-runtime/**"
      - "tools/workflow-evidence/**"
      - "extensions/*/contracts/workflow-discovery-claims.json"
      - "extensions/*/contracts/workflow-contributions.json"
      - ".gitattributes"
      - "extensions/workflow-register/**"
      - "extensions/bob-bazaar-review/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/*.js"
      - "tools/real-machine-test-environment/**"
      - "docs/workflows/bazaar-project-rule-review/integration/**"
      - "docs/workflows/code-consistency-review/integration/**"
      - "docs/workflows/code-consistency-review/examples/**"
      - "extensions/bob-bazaar-review/docs/real-machine-test-spec-ja.md"
      - "extensions/bob-code-consistency-review/docs/real-machine-test-spec-ja.md"
      - "scripts/verify-ci-head*.js"
      - "scripts/exact-head-ci-contract.test.js"
      - "tools/main-consolidation/exact-head-ci-contract.json"
      - ".github/workflows/extensions-quality.yml"
  push:
    branches:
      - main
    paths:
      - "packages/processing-budget-runtime/**"
      - "tools/workflow-evidence/**"
      - "extensions/*/contracts/workflow-discovery-claims.json"
      - "extensions/*/contracts/workflow-contributions.json"
      - ".gitattributes"
      - "extensions/workflow-register/**"
      - "extensions/bob-bazaar-review/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/*.js"
      - "tools/real-machine-test-environment/**"
      - "docs/workflows/bazaar-project-rule-review/integration/**"
      - "docs/workflows/code-consistency-review/integration/**"
      - "docs/workflows/code-consistency-review/examples/**"
      - "extensions/bob-bazaar-review/docs/real-machine-test-spec-ja.md"
      - "extensions/bob-code-consistency-review/docs/real-machine-test-spec-ja.md"
      - "scripts/verify-ci-head*.js"
      - "scripts/exact-head-ci-contract.test.js"
      - "tools/main-consolidation/exact-head-ci-contract.json"
      - ".github/workflows/extensions-quality.yml"
  workflow_dispatch:
    inputs:
      expectedHeadSha:
        description: Full commit SHA to check out and verify
        required: true
        type: string
      dispatchNonce:
        description: Machine-generated 32-character lowercase hex correlation ID
        required: true
        type: string

concurrency:
  group: extensions-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-register:
    name: workflow-register
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/workflow-register

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json

      - name: Prepare shared processing runtime
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix packages/processing-budget-runtime
          npm run compile --prefix packages/processing-budget-runtime

      - name: Record CI baseline
        run: node ../../scripts/ci-baseline-summary.js

      - name: Verify CI baseline summary
        run: node --test ../../scripts/ci-baseline-summary.test.js

      - name: Verify Extension Host smoke contract
        run: node --test ../../scripts/extension-host-smoke-contract.test.js

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run dependency:policy

      - name: Architecture policy
        run: npm run architecture:policy

      - name: Source policy
        run: npm run source:policy

      - name: Schema policy
        run: npm run schema:policy

      - name: Contract v2 product runtime reachability
        run: node scripts/check-contract-v2-runtime-reachability.js

      - name: Unused dependency report
        run: npm run unused:report

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Build companion provider bridges
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          npm ci --prefix extensions/bob-bazaar-review
          npm run compile --prefix extensions/bob-bazaar-review
          npm ci --prefix extensions/bob-code-consistency-review
          npm run compile --prefix extensions/bob-code-consistency-review

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: VSIX policy
        run: npm run package:policy

      - name: Capture immutable evidence VSIX
        working-directory: ${{ github.workspace }}
        run: node tools/workflow-evidence/ci-evidence.mjs prepare "${{ runner.temp }}/evidence-vsix-workflow-register" "extensions/workflow-register/workflow-register-0.1.2.vsix"

      - name: Upload immutable evidence VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-vsix-workflow-register
          path: ${{ runner.temp }}/evidence-vsix-workflow-register
          if-no-files-found: error
          compression-level: 0

      - name: Install pinned local VS Code test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts --audit=false --fund=false @vscode/test-cli@0.0.12 @vscode/test-electron@2.5.2

      - name: Extension Host surface smoke
        env:
          SMOKE_EXTENSION_ID: local.workflow-register
          SMOKE_COMMANDS: workflowRegister.openOperationHub,workflowRegister.openWorkflowBuilder,workflowRegister.runWorkflow,workflowRegister.inspectRunStorage,workflowRegister.previewRunCleanup,workflowRegister.cleanupCompletedRuns,workflowRegister.deleteSelectedRuns,workflowRegister.pinRun,workflowRegister.unpinRun
          SMOKE_EXTRA_FILES: ../../scripts/three-extension-surface-extension-host.test.js
          SMOKE_WORKSPACE_FOLDER: test/fixtures/gui-surface-workspace
          SURFACE_PUBLIC_COMMANDS: workflowRegister.openOperationHub,workflowRegister.openWorkflowBuilder
          SURFACE_HIDDEN_COMMANDS: workflowRegister.runWorkflow
          SURFACE_PRIMARY_PANELS: workflowRegister.openOperationHub|workflowRegisterOperationHub|Bob 操作ハブ;workflowRegister.openWorkflowBuilder|workflowRegisterBuilder|ワークフロー作成・編集
        run: |
          node ../../scripts/extension-host-smoke.test.js --write-config
          xvfb-run -a ./node_modules/.bin/vscode-test

  bob-bazaar-review:
    name: bob-bazaar-review
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/bob-bazaar-review

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-bazaar-review/package-lock.json

      - name: Prepare shared processing runtime
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix packages/processing-budget-runtime
          npm run compile --prefix packages/processing-budget-runtime

      - name: Record CI baseline
        run: node ../../scripts/ci-baseline-summary.js

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run dependency:policy

      - name: Architecture policy
        run: npm run architecture:policy

      - name: Source policy
        run: npm run source:policy

      - name: Unused dependency report
        run: npm run unused:report

      - name: Unused dependency policy
        run: npm run unused:policy

      - name: Artifact size policy
        run: npm run artifact:policy

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: VSIX policy
        run: npm run package:policy

      - name: Install evidence compiler dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --prefix extensions/workflow-register

      - name: Build evidence compiler
        working-directory: ${{ github.workspace }}
        run: npm run compile --prefix extensions/workflow-register

      - name: Capture immutable evidence VSIX
        working-directory: ${{ github.workspace }}
        run: node tools/workflow-evidence/ci-evidence.mjs prepare "${{ runner.temp }}/evidence-vsix-bob-bazaar-review" "extensions/bob-bazaar-review/bob-bazaar-review-0.3.2.vsix"

      - name: Upload immutable evidence VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-vsix-bob-bazaar-review
          path: ${{ runner.temp }}/evidence-vsix-bob-bazaar-review
          if-no-files-found: error
          compression-level: 0

      - name: VSIX metrics
        run: npm run package:metrics

      - name: Install pinned local VS Code test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts --audit=false --fund=false @vscode/test-cli@0.0.12 @vscode/test-electron@2.5.2

      - name: Extension Host surface smoke
        env:
          SMOKE_EXTENSION_ID: local.bob-bazaar-review
          SMOKE_COMMANDS: bobBazaar.openReviewGui,bobBazaar.authorProjectRulesFromDocuments,bobBazaar.captureReviewResult
          SMOKE_EXTRA_FILES: ../../scripts/three-extension-surface-extension-host.test.js
          SMOKE_WORKSPACE_FOLDER: test/fixtures/gui-surface-workspace
          SURFACE_PUBLIC_COMMANDS: bobBazaar.openReviewGui,bobBazaar.authorProjectRulesFromDocuments
          SURFACE_HIDDEN_COMMANDS: bobBazaar.captureReviewResult
          SURFACE_PRIMARY_PANELS: bobBazaar.openReviewGui|bobBazaarReviewGui|Bazaar レビュー
        run: |
          node ../../scripts/extension-host-smoke.test.js --write-config
          xvfb-run -a ./node_modules/.bin/vscode-test

  bob-code-consistency-review:
    name: bob-code-consistency-review
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Prepare shared processing runtime
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix packages/processing-budget-runtime
          npm run compile --prefix packages/processing-budget-runtime

      - name: Record CI baseline
        run: node ../../scripts/ci-baseline-summary.js

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run dependency:policy

      - name: Architecture policy
        run: npm run architecture:policy

      - name: Source policy
        run: npm run source:policy

      - name: Unused dependency report
        run: npm run unused:report

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: VSIX policy
        run: npm run package:policy

      - name: Install evidence compiler dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --prefix extensions/workflow-register

      - name: Build evidence compiler
        working-directory: ${{ github.workspace }}
        run: npm run compile --prefix extensions/workflow-register

      - name: Capture immutable evidence VSIX
        working-directory: ${{ github.workspace }}
        run: node tools/workflow-evidence/ci-evidence.mjs prepare "${{ runner.temp }}/evidence-vsix-bob-code-consistency-review" "extensions/bob-code-consistency-review/bob-code-consistency-review-0.1.0.vsix"

      - name: Upload immutable evidence VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-vsix-bob-code-consistency-review
          path: ${{ runner.temp }}/evidence-vsix-bob-code-consistency-review
          if-no-files-found: error
          compression-level: 0

      - name: Install pinned local VS Code test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts --audit=false --fund=false @vscode/test-cli@0.0.12 @vscode/test-electron@2.5.2

      - name: Extension Host surface smoke
        env:
          SMOKE_EXTENSION_ID: local.bob-code-consistency-review
          SMOKE_COMMANDS: bobCodeConsistency.openReviewWizard,bobCodeConsistency.preprocess
          SMOKE_EXTRA_FILES: ../../scripts/three-extension-surface-extension-host.test.js
          SMOKE_WORKSPACE_FOLDER: test/fixtures/gui-surface-workspace
          SURFACE_PUBLIC_COMMANDS: bobCodeConsistency.openReviewWizard
          SURFACE_HIDDEN_COMMANDS: bobCodeConsistency.preprocess
          SURFACE_PRIMARY_PANELS: bobCodeConsistency.openReviewWizard|bobCodeConsistencyReviewWizard|整合プレレビュー
        run: |
          node ../../scripts/extension-host-smoke.test.js --write-config
          xvfb-run -a ./node_modules/.bin/vscode-test

      - name: Code Consistency triage operator smoke
        env:
          SMOKE_EXTENSION_ID: local.bob-code-consistency-review
          SMOKE_COMMANDS: bobCodeConsistency.openReviewWizard,bobCodeConsistency.preprocess
          SMOKE_EXTRA_FILES: ../../scripts/triage-integrity-extension-host.test.js
          SMOKE_WORKSPACE_FOLDER: test/fixtures/triage-operator-workspace
        run: |
          node ../../scripts/extension-host-smoke.test.js --write-config
          xvfb-run -a ./node_modules/.bin/vscode-test

  windows-smoke:
    name: Windows / ${{ matrix.extension }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - extension: workflow-register
            extension_id: local.workflow-register
            smoke_commands: workflowRegister.openOperationHub,workflowRegister.openWorkflowBuilder,workflowRegister.runWorkflow,workflowRegister.inspectRunStorage,workflowRegister.previewRunCleanup,workflowRegister.cleanupCompletedRuns,workflowRegister.deleteSelectedRuns,workflowRegister.pinRun,workflowRegister.unpinRun
            extra_test_files: "../../scripts/three-extension-surface-extension-host.test.js"
            workspace_folder: "test/fixtures/gui-surface-workspace"
            surface_public_commands: workflowRegister.openOperationHub,workflowRegister.openWorkflowBuilder
            surface_hidden_commands: workflowRegister.runWorkflow
            surface_primary_panels: workflowRegister.openOperationHub|workflowRegisterOperationHub|Bob 操作ハブ;workflowRegister.openWorkflowBuilder|workflowRegisterBuilder|ワークフロー作成・編集
            triage_extra_test_files: ""
            triage_workspace_folder: ""
          - extension: bob-bazaar-review
            extension_id: local.bob-bazaar-review
            smoke_commands: bobBazaar.openReviewGui,bobBazaar.authorProjectRulesFromDocuments,bobBazaar.captureReviewResult
            extra_test_files: "../../scripts/three-extension-surface-extension-host.test.js"
            workspace_folder: "test/fixtures/gui-surface-workspace"
            surface_public_commands: bobBazaar.openReviewGui,bobBazaar.authorProjectRulesFromDocuments
            surface_hidden_commands: bobBazaar.captureReviewResult
            surface_primary_panels: bobBazaar.openReviewGui|bobBazaarReviewGui|Bazaar レビュー
            triage_extra_test_files: ""
            triage_workspace_folder: ""
          - extension: bob-code-consistency-review
            extension_id: local.bob-code-consistency-review
            smoke_commands: bobCodeConsistency.openReviewWizard,bobCodeConsistency.preprocess
            extra_test_files: "../../scripts/three-extension-surface-extension-host.test.js"
            workspace_folder: "test/fixtures/gui-surface-workspace"
            surface_public_commands: bobCodeConsistency.openReviewWizard
            surface_hidden_commands: bobCodeConsistency.preprocess
            surface_primary_panels: bobCodeConsistency.openReviewWizard|bobCodeConsistencyReviewWizard|整合プレレビュー
            triage_extra_test_files: "../../scripts/triage-integrity-extension-host.test.js"
            triage_workspace_folder: "test/fixtures/triage-operator-workspace"

    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/${{ matrix.extension }}/package-lock.json

      - name: Prepare shared processing runtime
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix packages/processing-budget-runtime
          npm run compile --prefix packages/processing-budget-runtime

      - name: Record CI baseline
        run: node ../../scripts/ci-baseline-summary.js

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run dependency:policy

      - name: Architecture policy
        run: npm run architecture:policy

      - name: Source policy
        run: npm run source:policy

      - name: Build companion provider bridges
        if: matrix.extension == 'workflow-register'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          npm ci --prefix extensions/bob-bazaar-review
          npm run compile --prefix extensions/bob-bazaar-review
          npm ci --prefix extensions/bob-code-consistency-review
          npm run compile --prefix extensions/bob-code-consistency-review

      - name: Unit tests
        run: npm test

      - name: Contract v2 product runtime reachability
        if: matrix.extension == 'workflow-register'
        run: node scripts/check-contract-v2-runtime-reachability.js

      - name: Package
        run: npm run package

      - name: VSIX policy
        run: npm run package:policy

      - name: Install pinned local VS Code test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts --audit=false --fund=false @vscode/test-cli@0.0.12 @vscode/test-electron@2.5.2

      - name: Extension Host surface smoke
        shell: pwsh
        env:
          SMOKE_EXTENSION_ID: ${{ matrix.extension_id }}
          SMOKE_COMMANDS: ${{ matrix.smoke_commands }}
          SMOKE_EXTRA_FILES: ${{ matrix.extra_test_files }}
          SMOKE_WORKSPACE_FOLDER: ${{ matrix.workspace_folder }}
          SURFACE_PUBLIC_COMMANDS: ${{ matrix.surface_public_commands }}
          SURFACE_HIDDEN_COMMANDS: ${{ matrix.surface_hidden_commands }}
          SURFACE_PRIMARY_PANELS: ${{ matrix.surface_primary_panels }}
        run: |
          node ../../scripts/extension-host-smoke.test.js --write-config
          & .\node_modules\.bin\vscode-test.cmd

      - name: Code Consistency triage operator smoke
        if: ${{ matrix.triage_extra_test_files != '' }}
        shell: pwsh
        env:
          SMOKE_EXTENSION_ID: ${{ matrix.extension_id }}
          SMOKE_COMMANDS: ${{ matrix.smoke_commands }}
          SMOKE_EXTRA_FILES: ${{ matrix.triage_extra_test_files }}
          SMOKE_WORKSPACE_FOLDER: ${{ matrix.triage_workspace_folder }}
        run: |
          node ../../scripts/extension-host-smoke.test.js --write-config
          & .\node_modules\.bin\vscode-test.cmd

  real-machine-environment-contracts:
    name: Real-machine environment contracts
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify repository contracts
        run: node --test scripts/real-machine-test-environment.test.js scripts/real-machine-input-document-fixtures.test.js

      - name: Verify PowerShell manifest and seed plans
        shell: pwsh
        run: pwsh -NoProfile -File tools/real-machine-test-environment/Invoke-BobReviewTestEnvironment.ps1 -ValidateOnly

  extension-metrics:
    name: Extension source metrics
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Record CI baseline
        run: node scripts/ci-baseline-summary.js

      - name: Generate extension metrics
        run: node scripts/report-extension-metrics.js --output extension-metrics.md

      - name: Add metrics to job summary
        shell: bash
        run: cat extension-metrics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment extension metrics on pull request
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- bob-extension-metrics -->";
            const body = `${marker}\n${fs.readFileSync("extension-metrics.md", "utf8")}`;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });
            const previous = comments.data.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }

  evidence-subject:
    name: Workflow evidence subject
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [workflow-register, bob-bazaar-review, bob-code-consistency-review]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install compiler dependencies
        run: npm ci --prefix extensions/workflow-register

      - name: Compile current P4 and P7
        run: npm run compile --prefix extensions/workflow-register

      - name: Download actual VSIX subjects
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-vsix-*
          path: .workflow-evidence-inputs

      - name: Prepare common immutable subject
        run: node tools/workflow-evidence/ci-evidence.mjs prepare .workflow-evidence-subject --bundles .workflow-evidence-inputs/evidence-vsix-workflow-register .workflow-evidence-inputs/evidence-vsix-bob-bazaar-review .workflow-evidence-inputs/evidence-vsix-bob-code-consistency-review

      - name: Upload common immutable subject
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-evidence-subject
          path: .workflow-evidence-subject/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0

  evidence-portability:
    name: Workflow evidence / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [evidence-subject]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install compiler dependencies
        run: npm ci --prefix extensions/workflow-register

      - name: Compile current P4 and P7
        run: npm run compile --prefix extensions/workflow-register

      - name: Download common immutable subject
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workflow-evidence-subject
          path: .workflow-evidence-subject

      - name: Test bounded workflow evidence
        run: node --test --test-concurrency=2 tools/workflow-evidence/test/*.test.mjs

      - name: Generate evidence from actual source and common VSIX
        run: node tools/workflow-evidence/ci-evidence.mjs generate .workflow-evidence-subject workflow-evidence-output

      - name: Upload OS evidence and external native receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-evidence-${{ matrix.os }}
          path: workflow-evidence-output/
          include-hidden-files: true
          if-no-files-found: error

  evidence-byte-parity:
    name: Workflow evidence byte parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [evidence-portability]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install compiler dependencies
        run: npm ci --prefix extensions/workflow-register

      - name: Compile current P4 and P7
        run: npm run compile --prefix extensions/workflow-register

      - name: Download both OS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: workflow-evidence-*-latest
          path: .workflow-evidence-comparison

      - name: Compare all four artifacts and source VSIX bindings
        run: node tools/workflow-evidence/compare-evidence.mjs .workflow-evidence-comparison/workflow-evidence-ubuntu-latest .workflow-evidence-comparison/workflow-evidence-windows-latest
