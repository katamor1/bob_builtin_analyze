name: extensions-quality

on:
  pull_request:
    paths:
      - ".github/workflows/extensions-quality.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply path-boundary and fixture fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("extensions/workflow-register/src/core/runtime/runStatePath.ts")
          text = path.read_text()
          old = "      assertSafeWorkflowRunId(entry.name)\n      entries.push(entry.name)"
          new = "      assertSafeWorkflowRunId(entry.name)\n      await directDirectoryChain(root, [...RUNS_ROOT_SEGMENTS, entry.name], false)\n      entries.push(entry.name)"
          if old not in text:
              raise SystemExit("runStatePath target not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("extensions/workflow-register/test/runStateStorePathBoundary.test.js")
          text = path.read_text()
          old_import = 'const { FileRunStateStore } = require("../out/core/runStateStore")'
          new_import = 'const { CURRENT_WORKFLOW_RUN_STATE_SCHEMA_VERSION, FileRunStateStore } = require("../out/core/runStateStore")'
          if old_import not in text:
              raise SystemExit("test import target not found")
          text = text.replace(old_import, new_import, 1)

          old_setup = '''  const store = new FileRunStateStore({ workspaceRoot })
            await store.saveRun(runState("run-1", "initial"))
            const runFile = path.join(workspaceRoot, ".bob", "workflows", "runs", "run-1", "run.json")
            const replacementFile = path.join(path.dirname(runFile), "replacement.json")
            await fs.writeFile(replacementFile, `${JSON.stringify(runState("run-1", "replacement"), null, 2)}\n`)
          '''
          new_setup = '''  const store = new FileRunStateStore({ workspaceRoot })
            const runFile = path.join(workspaceRoot, ".bob", "workflows", "runs", "run-1", "run.json")
            const replacementFile = path.join(path.dirname(runFile), "replacement.json")
            const initial = { ...runState("run-1", "initial"), schemaVersion: CURRENT_WORKFLOW_RUN_STATE_SCHEMA_VERSION }
            const replacement = { ...runState("run-1", "replacement"), schemaVersion: CURRENT_WORKFLOW_RUN_STATE_SCHEMA_VERSION }
            await fs.mkdir(path.dirname(runFile), { recursive: true })
            await fs.writeFile(runFile, `${JSON.stringify(initial, null, 2)}\n`)
            await fs.writeFile(replacementFile, `${JSON.stringify(replacement, null, 2)}\n`)
          '''
          old_setup = old_setup.replace("            ", "  ")
          new_setup = new_setup.replace("            ", "  ")
          if old_setup not in text:
              raise SystemExit("atomic replacement test target not found")
          path.write_text(text.replace(old_setup, new_setup, 1))
          PY

      - name: Restore production workflow
        shell: bash
        run: git show ae8bc59ba0267dc2d929dc3d096503e1cb6fa27b:.github/workflows/extensions-quality.yml > .github/workflows/extensions-quality.yml

      - name: Commit and push
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/extensions-quality.yml \
            extensions/workflow-register/src/core/runtime/runStatePath.ts \
            extensions/workflow-register/test/runStateStorePathBoundary.test.js
          git commit -m "fix: preserve run path safety under durable listing"
          git push origin "HEAD:${HEAD_BRANCH}"
