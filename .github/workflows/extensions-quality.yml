name: extensions-quality

on:
  pull_request:
    paths:
      - "extensions/workflow-register/**"
      - ".github/workflows/extensions-quality.yml"

permissions:
  contents: read

concurrency:
  group: extensions-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p1-4-diagnostic:
    name: P1-4 workflow-register diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extensions/workflow-register
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - name: Install dependencies
        run: npm ci --silent
      - name: Compile and focused tests
        shell: bash
        run: |
          set -euo pipefail
          npm run compile --silent
          node --test \
            test/heldRunRecoveryClassifier.test.js \
            test/operationHubHeldRecovery.test.js \
            test/operationHub.test.js \
            test/operationHubMutations.test.js \
            test/detachedHeldRecoveryCommand.test.js \
            test/heldRecoveryDiagnostics.test.js \
            test/workflowEngineGuardedResume.test.js
      - name: Full unit suite with concise failure output
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/p1-4-full.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== failure excerpts ==="
            grep -n -B 35 -A 140 -E "not ok|AssertionError|ERR_ASSERTION|error TS|Error:" "$RUNNER_TEMP/p1-4-full.log" || true
            echo "=== tail ==="
            tail -n 240 "$RUNNER_TEMP/p1-4-full.log"
          else
            tail -n 80 "$RUNNER_TEMP/p1-4-full.log"
          fi
          exit "$status"
      - name: Upload unit log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p1-4-full-unit-log
          path: ${{ runner.temp }}/p1-4-full.log
          if-no-files-found: error
          retention-days: 3
