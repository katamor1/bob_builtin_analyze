name: extensions-quality

on:
  pull_request:
    paths:
      - "extensions/workflow-register/**"
      - "extensions/bob-bazaar-review/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/*.js"
      - ".github/workflows/extensions-quality.yml"
  push:
    branches:
      - main
    paths:
      - "extensions/workflow-register/**"
      - "extensions/bob-bazaar-review/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/*.js"
      - ".github/workflows/extensions-quality.yml"
  workflow_dispatch:

jobs:
  workflow-register:
    name: workflow-register
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/workflow-register

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run dependency:policy

      - name: Architecture policy
        run: npm run architecture:policy

      - name: Source policy
        run: npm run source:policy

      - name: Schema policy
        run: npm run schema:policy

      - name: Unused dependency report
        run: npm run unused:report

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: VSIX policy
        run: npm run package:policy

  bob-bazaar-review:
    name: bob-bazaar-review
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/bob-bazaar-review

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-bazaar-review/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run dependency:policy

      - name: Architecture policy
        run: npm run architecture:policy

      - name: Source policy
        run: npm run source:policy

      - name: Unused dependency report
        run: npm run unused:report

      - name: Unused dependency policy
        run: npm run unused:policy

      - name: Artifact size policy
        run: npm run artifact:policy

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: VSIX policy
        run: npm run package:policy

      - name: VSIX metrics
        run: npm run package:metrics

  bob-code-consistency-review:
    name: bob-code-consistency-review
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run dependency:policy

      - name: Architecture policy
        run: npm run architecture:policy

      - name: Source policy
        run: npm run source:policy

      - name: Unused dependency report
        run: npm run unused:report

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: VSIX policy
        run: npm run package:policy

  windows-smoke:
    name: Windows / ${{ matrix.extension }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        extension:
          - workflow-register
          - bob-bazaar-review
          - bob-code-consistency-review

    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/${{ matrix.extension }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run dependency:policy

      - name: Architecture policy
        run: npm run architecture:policy

      - name: Source policy
        run: npm run source:policy

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: VSIX policy
        run: npm run package:policy

  extension-metrics:
    name: Extension source metrics
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate extension metrics
        run: node scripts/report-extension-metrics.js --output extension-metrics.md

      - name: Add metrics to job summary
        shell: bash
        run: cat extension-metrics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment extension metrics on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- bob-extension-metrics -->";
            const body = `${marker}\n${fs.readFileSync("extension-metrics.md", "utf8")}`;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });
            const previous = comments.data.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }
