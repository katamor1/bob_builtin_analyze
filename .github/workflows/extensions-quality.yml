name: extensions-quality

on:
  pull_request:
    paths:
      - "extensions/workflow-register/**"
      - ".github/workflows/extensions-quality.yml"

permissions:
  contents: write

concurrency:
  group: extensions-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p1-4-fix-and-verify:
    name: P1-4 live-gate compatibility fix
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: extensions/workflow-register
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - name: Preserve live held gate resume compatibility
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path

          path = Path("extensions/workflow-register/src/workflowRunCommands.ts")
          text = path.read_text(encoding="utf-8")
          old = '''    const workflow = this.options.coreWorkflows.get(run.workflowId)
    if (!workflow) throw new Error(`Workflow definition is not loaded: ${run.workflowId}`)
    if (mode === "resume" && run.status === "held") {
      const assessment = await this.assessHeldRunRecovery(root, run, workflow)
      if (assessment.kind === "connected") {
        const step = workflow.engineSteps.find((candidate) => candidate.id === assessment.stepId)
        if (step) {
          const active = this.options.activeSteps().find((candidate) => (
            candidate.runId === run.runId
            && candidate.workflowId === run.workflowId
            && candidate.stepId === step.id
          ))
          await this.options.showManualStepPanel({ workflow, run, step, active })
          return run
        }
      }
      const message = assessment.kind === "detached-resumable"
        ? `Current held run is detached. Use workflowRegister.recoverDetachedHeldRun after reviewing the recovery preview: ${run.runId}`
        : `Current held run requires '${assessment.primaryAction.label}' before it can resume: ${run.runId}`
      await vscode.window.showWarningMessage(message)
      return message
    }
    const liveGate = this.options.gateRegistry.pendingForRun(root, runId)
'''
          new = '''    const workflow = this.options.coreWorkflows.get(run.workflowId)
    if (!workflow) throw new Error(`Workflow definition is not loaded: ${run.workflowId}`)
    const liveGate = this.options.gateRegistry.pendingForRun(root, runId)
    if (mode === "resume" && run.status === "held") {
      const assessment = await this.assessHeldRunRecovery(root, run, workflow)
      if (assessment.kind === "connected") {
        const step = workflow.engineSteps.find((candidate) => candidate.id === assessment.stepId)
        if (step) {
          const active = this.options.activeSteps().find((candidate) => (
            candidate.runId === run.runId
            && candidate.workflowId === run.workflowId
            && candidate.stepId === step.id
          ))
          await this.options.showManualStepPanel({ workflow, run, step, active })
          return run
        }
      }
      if (!liveGate) {
        const message = assessment.kind === "detached-resumable"
          ? `Current held run is detached. Use workflowRegister.recoverDetachedHeldRun after reviewing the recovery preview: ${run.runId}`
          : `Current held run requires '${assessment.primaryAction.label}' before it can resume: ${run.runId}`
        await vscode.window.showWarningMessage(message)
        return message
      }
    }
'''
          if old not in text:
              raise SystemExit("live held resume anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install dependencies
        run: npm ci --silent
      - name: Verify focused and full suites
        shell: bash
        run: |
          set -euo pipefail
          npm run compile --silent
          node --test \
            test/bobGateLifecycle.test.js \
            test/heldRunRecoveryClassifier.test.js \
            test/operationHubHeldRecovery.test.js \
            test/operationHub.test.js \
            test/operationHubMutations.test.js \
            test/detachedHeldRecoveryCommand.test.js \
            test/heldRecoveryDiagnostics.test.js \
            test/workflowEngineGuardedResume.test.js
          npm test --silent
          npm run dependency:policy --silent
          npm run architecture:policy --silent
          npm run source:policy --silent
          npm run schema:policy --silent
          npm run package --silent
          npm run package:policy --silent
      - name: Restore standard CI and publish verified fix
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/extensions-quality.yml > .github/workflows/extensions-quality.yml
          rm -f \
            .github/workflows/p1-4-evidence-hardening.yml \
            .github/workflows/p1-4-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve live held gate recovery semantics"
          git push origin HEAD:${{ github.head_ref }}
