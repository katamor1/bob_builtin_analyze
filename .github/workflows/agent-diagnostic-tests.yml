name: agent-diagnostic-tests

on:
  push:
    branches:
      - agent/three-extension-remediation-20260711
    paths:
      - "extensions/bob-code-consistency-review/**"
      - ".github/workflows/agent-diagnostic-tests.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  code-consistency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json
      - run: npm ci
      - name: Capture test output
        id: tests
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/code-consistency-test.log" 2>&1
          status=$?
          tail -n 180 "$RUNNER_TEMP/code-consistency-test.log" > "$RUNNER_TEMP/code-consistency-test-tail.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment diagnostic tail
        uses: actions/github-script@v7
        env:
          TEST_STATUS: ${{ steps.tests.outputs.status }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- agent-code-consistency-test-diagnostic -->";
            const tail = fs.readFileSync(process.env.RUNNER_TEMP + "/code-consistency-test-tail.log", "utf8");
            const body = `${marker}\n## Targeted test diagnostic\n\nExit: ${process.env.TEST_STATUS}\n\n\`\`\`text\n${tail.slice(-12000)}\n\`\`\``;
            const issue_number = 68;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });
            const previous = comments.data.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }
