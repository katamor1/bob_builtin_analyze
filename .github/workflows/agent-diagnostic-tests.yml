name: agent-diagnostic-tests

on:
  push:
    branches:
      - agent/three-extension-remediation-20260711
    paths:
      - "extensions/workflow-register/**"
      - "extensions/bob-bazaar-review/**"
      - ".github/workflows/agent-diagnostic-tests.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  workflow-register-architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/workflow-register
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - run: npm ci
      - name: Capture architecture policy output
        id: policy
        shell: bash
        run: |
          set +e
          npm run architecture:policy > "$RUNNER_TEMP/workflow-register-architecture.log" 2>&1
          status=$?
          tail -n 220 "$RUNNER_TEMP/workflow-register-architecture.log" > "$RUNNER_TEMP/workflow-register-architecture-tail.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment architecture diagnostic
        uses: actions/github-script@v7
        env:
          POLICY_STATUS: ${{ steps.policy.outputs.status }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- agent-workflow-register-architecture-diagnostic -->";
            const tail = fs.readFileSync(process.env.RUNNER_TEMP + "/workflow-register-architecture-tail.log", "utf8");
            const body = `${marker}\n## Workflow-register architecture diagnostic\n\nExit: ${process.env.POLICY_STATUS}\n\n\`\`\`text\n${tail.slice(-12000)}\n\`\`\``;
            const issue_number = 68;
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number });
            const previous = comments.data.find((comment) => comment.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });

  bazaar-review-unused:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/bob-bazaar-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-bazaar-review/package-lock.json
      - run: npm ci
      - name: Capture unused dependency policy output
        id: policy
        shell: bash
        run: |
          set +e
          npm run unused:policy > "$RUNNER_TEMP/bazaar-unused-policy.log" 2>&1
          status=$?
          tail -n 220 "$RUNNER_TEMP/bazaar-unused-policy.log" > "$RUNNER_TEMP/bazaar-unused-policy-tail.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment unused-policy diagnostic
        uses: actions/github-script@v7
        env:
          POLICY_STATUS: ${{ steps.policy.outputs.status }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- agent-bazaar-unused-policy-diagnostic -->";
            const tail = fs.readFileSync(process.env.RUNNER_TEMP + "/bazaar-unused-policy-tail.log", "utf8");
            const body = `${marker}\n## Bazaar unused-policy diagnostic\n\nExit: ${process.env.POLICY_STATUS}\n\n\`\`\`text\n${tail.slice(-12000)}\n\`\`\``;
            const issue_number = 68;
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number });
            const previous = comments.data.find((comment) => comment.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
