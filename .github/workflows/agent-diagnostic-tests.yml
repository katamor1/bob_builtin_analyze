name: agent-diagnostic-tests

on:
  push:
    branches:
      - agent/three-extension-remediation-20260711
    paths:
      - "extensions/workflow-register/**"
      - "extensions/bob-bazaar-review/**"
      - "extensions/bob-code-consistency-review/**"
      - ".github/workflows/agent-diagnostic-tests.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  workflow-register:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/workflow-register
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - run: npm ci
      - name: Capture focused test output
        id: tests
        shell: bash
        run: |
          set +e
          npm run compile > "$RUNNER_TEMP/workflow-register-test.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            node --test test/actionRegistry.test.js >> "$RUNNER_TEMP/workflow-register-test.log" 2>&1
            status=$?
          fi
          tail -n 180 "$RUNNER_TEMP/workflow-register-test.log" > "$RUNNER_TEMP/workflow-register-test-tail.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment workflow-register diagnostic tail
        uses: actions/github-script@v7
        env:
          TEST_STATUS: ${{ steps.tests.outputs.status }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- agent-workflow-register-test-diagnostic -->";
            const tail = fs.readFileSync(process.env.RUNNER_TEMP + "/workflow-register-test-tail.log", "utf8");
            const body = `${marker}\n## Workflow-register focused diagnostic\n\nExit: ${process.env.TEST_STATUS}\n\n\`\`\`text\n${tail.slice(-12000)}\n\`\`\``;
            const issue_number = 68;
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number });
            const previous = comments.data.find((comment) => comment.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });

  bazaar-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/bob-bazaar-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
