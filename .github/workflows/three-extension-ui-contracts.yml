name: three-extension-ui-contracts
run-name: ${{ github.event_name == 'workflow_dispatch' && format('wave0a-{0}-{1}', inputs.expectedHeadSha, inputs.dispatchNonce) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  pull_request:
    paths:
      - "tools/workflow-evidence/**"
      - "extensions/*/contracts/workflow-discovery-claims.json"
      - "extensions/*/contracts/workflow-contributions.json"
      - ".gitattributes"
      - "docs/**"
      - "extensions/workflow-register/**"
      - "extensions/bob-bazaar-review/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/three-extension-*.js"
      - "scripts/*-documentation-parity.test.js"
      - "scripts/extension-host-smoke-contract.test.js"
      - "scripts/verify-ci-head*.js"
      - "scripts/exact-head-ci-contract.test.js"
      - "tools/main-consolidation/exact-head-ci-contract.json"
      - ".github/workflows/three-extension-ui-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "tools/workflow-evidence/**"
      - "extensions/*/contracts/workflow-discovery-claims.json"
      - "extensions/*/contracts/workflow-contributions.json"
      - ".gitattributes"
      - "docs/**"
      - "extensions/workflow-register/**"
      - "extensions/bob-bazaar-review/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/three-extension-*.js"
      - "scripts/*-documentation-parity.test.js"
      - "scripts/extension-host-smoke-contract.test.js"
      - "scripts/verify-ci-head*.js"
      - "scripts/exact-head-ci-contract.test.js"
      - "tools/main-consolidation/exact-head-ci-contract.json"
      - ".github/workflows/three-extension-ui-contracts.yml"
  workflow_dispatch:
    inputs:
      expectedHeadSha:
        description: Full commit SHA to check out and verify
        required: true
        type: string
      dispatchNonce:
        description: Machine-generated 32-character lowercase hex correlation ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: three-extension-ui-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: UI and documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify UI and documentation contracts
        run: |
          node --test \
            scripts/three-extension-command-surface.test.js \
            scripts/three-extension-documentation-contract.test.js \
            scripts/bazaar-review-documentation-parity.test.js \
            scripts/code-consistency-documentation-parity.test.js \
            scripts/workflow-register-documentation-parity.test.js \
            scripts/extension-host-smoke-contract.test.js \
            scripts/three-extension-ui-contract-workflow.test.js \
            scripts/ci-baseline-summary.test.js \
            scripts/verify-ci-head.test.js \
            scripts/exact-head-ci-contract.test.js

      - name: Verify changed-file whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          HISTORICAL_PATCH: docs/release-evidence/workflow-contract-v2-foundation-doc-sync.patch
          EXPECTED_HISTORICAL_PATCH_BLOB: e0946c6a29f7aa17538b1bc89e8160892845fb44
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$HEAD_SHA"
          actual_historical_patch_blob="$(git rev-parse "$HEAD_SHA:$HISTORICAL_PATCH")"
          test "$actual_historical_patch_blob" = "$EXPECTED_HISTORICAL_PATCH_BLOB"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA" -- . ":(exclude)$HISTORICAL_PATCH"
          else
            git diff --check "$HEAD_SHA^" "$HEAD_SHA" -- . ":(exclude)$HISTORICAL_PATCH"
          fi
