name: Seal final Bob evidence scope state v2

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e
    paths:
      - .github/workflows/seal-bob-evidence-scope-final-v2.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  seal:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalized branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Remove superseded helpers before final validation
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/seal-bob-evidence-scope-final.yml \
            .github/workflows/verify-bob-evidence-scope-final-clean.yml \
            .github/workflows/collect-bob-evidence-scope-final-ci.yml \
            .github/workflows/finalize-bob-evidence-scope.yml \
            .github/workflows/finalize-bob-evidence-scope-v2.yml \
            .github/workflows/export-evidence-scope-current.yml \
            .github/workflows/apply-evidence-scope-phase5.yml \
            .github/phase5-code-payload.tar.gz

      - name: Regenerate and verify sealed evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: '72'
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          root = Path('.')
          impl = root / 'docs/implementation'
          required = [
              impl / 'bob-evidence-scope-phase5-verification-2026-07-12.md',
              impl / 'bob-evidence-scope-final-artifact-ledger-2026-07-12.md',
              impl / 'bob-evidence-scope-final-artifact-ledger-verification-2026-07-12.md',
              impl / 'bob-evidence-scope-final-ci-2026-07-12.md',
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing final evidence: {missing}')

          ci_text = (impl / 'bob-evidence-scope-final-ci-2026-07-12.md').read_text(encoding='utf-8')
          if ci_text.count('conclusion: `success`') < 2:
              raise SystemExit('authoritative CI record is incomplete')
          if re.search(r': `(failure|cancelled|action_required|timed_out|skipped|neutral|stale)`', ci_text):
              raise SystemExit('authoritative CI record contains non-success state')

          unchecked = []
          for path in sorted((root / 'docs/superpowers/plans').glob('*evidence-scope*.md')):
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if '- [ ]' in line:
                      unchecked.append(f'{path.as_posix()}:{line_no}:{line.strip()}')
          if unchecked:
              raise SystemExit('unchecked evidence-scope plan steps:\n' + '\n'.join(unchecked))

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          pr_number = os.environ['PR_NUMBER']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/pulls/{pr_number}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'bob-evidence-scope-sealer-v2',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pr = json.load(response)
          if pr.get('state') != 'open' or not pr.get('draft'):
              raise SystemExit(f"PR must remain open and draft: state={pr.get('state')} draft={pr.get('draft')}")
          if 'artifact stale ledger' not in (pr.get('title') or '').lower():
              raise SystemExit(f"PR title is not final: {pr.get('title')}")

          manifest_path = impl / 'bob-evidence-scope-final-artifact-ledger-manifest.json'
          completion_path = impl / 'bob-evidence-scope-final-completion-2026-07-12.json'
          patterns = [
              'docs/superpowers/specs/*evidence-scope*.md',
              'docs/superpowers/plans/*evidence-scope*.md',
              'docs/implementation/bob-evidence-scope-phase5*.md',
              'docs/implementation/bob-evidence-scope-final-artifact-ledger*.md',
              'docs/implementation/bob-evidence-scope-final-ci-2026-07-12.md',
              'docs/workflows/code-consistency-review/schemas/review-input.schema.json',
              'extensions/bob-code-consistency-review/resources/schemas/review-input.schema.json',
              'extensions/bob-code-consistency-review/docs/evidence-scope-domain-contract-ja.md',
              'extensions/bob-code-consistency-review/src/evidenceScope/*.ts',
              'extensions/bob-code-consistency-review/test/*Ledger*.test.js',
              'extensions/bob-code-consistency-review/test/*ledger*.test.js',
              'extensions/bob-code-consistency-review/test/*Stale*.test.js',
              'extensions/bob-code-consistency-review/test/*stale*.test.js',
              'extensions/bob-code-consistency-review/test/repositorySymbolIndexProducer.test.js',
          ]
          selected = set()
          for pattern in patterns:
              selected.update(path for path in root.glob(pattern) if path.is_file())
          selected.discard(manifest_path)
          selected.discard(completion_path)

          files = []
          for path in sorted(selected, key=lambda item: item.as_posix()):
              if path.suffix == '.ts' and not any(word in path.name.lower() for word in ('ledger', 'stale', 'repository')):
                  continue
              data = path.read_bytes()
              files.append({
                  'path': path.as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              'schema_version': 1,
              'artifact': 'bob-evidence-scope-final-artifact-ledger',
              'hash_algorithm': 'sha256',
              'source_commit': os.environ['SOURCE_SHA'],
              'files': files,
          }
          manifest_bytes = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          manifest_path.write_bytes(manifest_bytes)

          failures = []
          for item in files:
              path = root / item['path']
              data = path.read_bytes()
              if len(data) != item['bytes'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                  failures.append(item['path'])
          if failures:
              raise SystemExit(f'fresh manifest self-check failed: {failures}')

          allowed_helper = root / '.github/workflows/seal-bob-evidence-scope-final-v2.yml'
          helper_patterns = ('evidence-scope', 'phase5-code-payload')
          remaining = []
          for path in (root / '.github').rglob('*'):
              if not path.is_file() or path == allowed_helper:
                  continue
              lowered = path.name.lower()
              if any(pattern in lowered for pattern in helper_patterns) and (
                  path.parent.name == 'workflows' or lowered.endswith('.tar.gz')
              ):
                  remaining.append(path.as_posix())
          if remaining:
              raise SystemExit(f'unexpected helper files remain: {remaining}')

          completion = {
              'schema_version': 1,
              'artifact': 'bob-evidence-scope-final-completion',
              'verified_branch_head': os.environ['SOURCE_SHA'],
              'manifest_sha256': hashlib.sha256(manifest_bytes).hexdigest(),
              'manifest_file_count': len(files),
              'authoritative_ci_record': 'docs/implementation/bob-evidence-scope-final-ci-2026-07-12.md',
              'pr_number': 72,
              'pr_state': pr.get('state'),
              'pr_draft': pr.get('draft'),
              'temporary_helpers_present': False,
              'unchecked_plan_steps': 0,
              'manifest_verification': 'passed',
              'authoritative_ci_verification': 'passed',
          }
          completion_path.write_text(json.dumps(completion, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Remove sealer and publish final state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/seal-bob-evidence-scope-final-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/implementation .github
          git commit -m 'docs: seal bob evidence scope final evidence'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
