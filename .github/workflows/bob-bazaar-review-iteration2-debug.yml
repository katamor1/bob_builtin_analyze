name: bob-bazaar-review-iteration2-debug

on:
  pull_request:
    paths:
      - "extensions/bob-bazaar-review/**"
      - ".github/workflows/bob-bazaar-review-iteration2-debug.yml"

permissions:
  contents: read

jobs:
  capture-unused-output:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/bob-bazaar-review
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-bazaar-review/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Capture unused policy output
        shell: bash
        run: |
          set +e
          npm run unused:policy > unused-policy-output.txt 2>&1
          status=$?
          printf '%s\n' "$status" > unused-policy-exit-code.txt
          exit 0
      - name: Upload unused policy output
        uses: actions/upload-artifact@v4
        with:
          name: bob-bazaar-review-iteration2-unused-output
          path: |
            extensions/bob-bazaar-review/unused-policy-output.txt
            extensions/bob-bazaar-review/unused-policy-exit-code.txt
          if-no-files-found: error
