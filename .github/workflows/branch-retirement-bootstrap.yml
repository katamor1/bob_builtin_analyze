name: branch-retirement-bootstrap

on:
  pull_request:
    paths:
      - "tools/branch-retirement/bootstrap.tar.gz.b64"
      - "tools/branch-retirement/bootstrap-chunks/**"
      - "tools/branch-retirement/bootstrap-patch.mjs"
      - "tools/branch-retirement/bootstrap-patch-chunks/**"
      - ".github/workflows/branch-retirement-bootstrap.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: branch-retirement-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  test:
    name: policy tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify, extract, and patch implementation bundle
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs")
          const crypto = require("node:crypto")
          const chunkDirectory = "tools/branch-retirement/bootstrap-chunks"
          const chunks = fs.readdirSync(chunkDirectory).sort()
          if (chunks.length !== 8 || chunks.some((name, index) => name !== `part-${String(index).padStart(2, "0")}`)) throw new Error(`unexpected bootstrap chunks: ${chunks.join(",")}`)
          const encoded = chunks.map((name) => fs.readFileSync(`${chunkDirectory}/${name}`, "utf8")).join("")
          const bytes = Buffer.from(encoded, "base64")
          const hash = crypto.createHash("sha256").update(bytes).digest("hex")
          if (hash !== "861f416f7ff77c337c13ed740781cc5a21a80f8ef67df1365b6d9c7d3d3a483f") throw new Error(`bootstrap hash mismatch: ${hash}`)
          fs.writeFileSync("branch-retirement-bootstrap.tar.gz", bytes)
          NODE
          tar -xzf branch-retirement-bootstrap.tar.gz
          rm branch-retirement-bootstrap.tar.gz
          node tools/branch-retirement/bootstrap-patch.mjs

      - name: Run branch-retirement tests
        run: >-
          node --test
          tools/branch-retirement/test/retirementPolicy.test.mjs
          tools/branch-retirement/test/audit-branch-retirement.test.mjs
          tools/branch-retirement/test/deletionPolicy.test.mjs
          tools/branch-retirement/test/delete-retired-branches.test.mjs

      - name: Parse durable JSON evidence
        shell: node {0}
        run: |
          const fs = require("node:fs")
          for (const file of [
            "tools/branch-retirement/branch-retirement-map.json",
            "docs/release-evidence/branch-retirement-reviewed-observations-2026-07-16.json",
            "docs/release-evidence/branch-retirement-reconciliation-2026-07-16.json",
            "docs/release-evidence/branch-retirement-execution-2026-07-16.json"
          ]) JSON.parse(fs.readFileSync(file, "utf8"))

  audit:
    name: live exact-SHA audit
    needs: test
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout writable bootstrap branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract implementation, run live audit, and replace bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node - <<'NODE'
          const fs = require("node:fs")
          const crypto = require("node:crypto")
          const chunkDirectory = "tools/branch-retirement/bootstrap-chunks"
          const chunks = fs.readdirSync(chunkDirectory).sort()
          if (chunks.length !== 8 || chunks.some((name, index) => name !== `part-${String(index).padStart(2, "0")}`)) throw new Error(`unexpected bootstrap chunks: ${chunks.join(",")}`)
          const encoded = chunks.map((name) => fs.readFileSync(`${chunkDirectory}/${name}`, "utf8")).join("")
          const bytes = Buffer.from(encoded, "base64")
          const hash = crypto.createHash("sha256").update(bytes).digest("hex")
          if (hash !== "861f416f7ff77c337c13ed740781cc5a21a80f8ef67df1365b6d9c7d3d3a483f") throw new Error(`bootstrap hash mismatch: ${hash}`)
          fs.writeFileSync("branch-retirement-bootstrap.tar.gz", bytes)
          NODE
          tar -xzf branch-retirement-bootstrap.tar.gz
          rm branch-retirement-bootstrap.tar.gz
          node tools/branch-retirement/bootstrap-patch.mjs
          git fetch --no-tags origin main:refs/remotes/origin/main

          audit_json="docs/release-evidence/branch-retirement-reconciliation-2026-07-16.json"
          audit_markdown="docs/release-evidence/branch-retirement-reconciliation-2026-07-16.md"
          rm -f "$audit_json" "$audit_markdown"
          set +e
          node tools/branch-retirement/audit-branch-retirement.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --remote origin \
            --base origin/main \
            --map tools/branch-retirement/branch-retirement-map.json \
            --reviewed-observations docs/release-evidence/branch-retirement-reviewed-observations-2026-07-16.json \
            --json "$audit_json" \
            --markdown "$audit_markdown" \
            --review-critical 0 \
            --review-important 0 \
            --hosted-gates-passed \
            --allow-unprotected-main-with-exact-sha-guard > /tmp/branch-retirement-audit.log 2>&1
          audit_code=$?
          set -e
          cat /tmp/branch-retirement-audit.log

          if [[ ! -f "$audit_json" || ! -f "$audit_markdown" ]]; then
            tail_log="$(tail -n 60 /tmp/branch-retirement-audit.log)"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Live branch-retirement audit failed before durable evidence was written. Audit exit: \`$audit_code\`.\n\n\`\`\`text\n$tail_log\n\`\`\`"
            exit "${audit_code:-1}"
          fi

          git diff --check
          node - <<'NODE'
          const fs = require("node:fs")
          const audit = JSON.parse(fs.readFileSync("docs/release-evidence/branch-retirement-reconciliation-2026-07-16.json", "utf8"))
          if (audit.review.critical !== 0 || audit.review.important !== 0) throw new Error("whole-diff review gate is not green")
          if (audit.hostedGatesPassed !== true) throw new Error("hosted gate flag is not green")
          if (audit.mainGuard?.defaultBranch !== "main") throw new Error("default branch guard is not main")
          if (audit.mainGuard?.protected !== false || audit.mainGuard?.unprotectedExactShaGuardAuthorized !== true) throw new Error("unprotected-main exact-SHA guard was not explicitly recorded")
          console.log(JSON.stringify({ready_for_deletion: audit.ready_for_deletion, blockedBranches: audit.blockedBranches, mainGuard: audit.mainGuard}))
          NODE

          rm .github/workflows/branch-retirement-bootstrap.yml
          rm tools/branch-retirement/bootstrap.tar.gz.b64
          rm -rf tools/branch-retirement/bootstrap-chunks
          rm tools/branch-retirement/bootstrap-patch.mjs
          rm -rf tools/branch-retirement/bootstrap-patch-chunks
          git add .
          git commit -m "feat: implement guarded branch retirement"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

          ready="$(node -p 'JSON.parse(require("fs").readFileSync("docs/release-evidence/branch-retirement-reconciliation-2026-07-16.json","utf8")).ready_for_deletion')"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Linux/Windows policy tests and the live exact-SHA audit completed. Evidence commit: \`$(git rev-parse HEAD)\`; ready_for_deletion=\`$ready\`; audit exit=\`$audit_code\`. The unprotected-main exact-SHA guard was explicitly recorded. Bootstrap workflow, archive, chunks, and patch removed themselves from the deliverable branch."

          if [[ "$audit_code" -ne 0 ]]; then
            exit "$audit_code"
          fi
