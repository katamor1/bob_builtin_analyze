name: task-snapshot-import-provenance-executor

on:
  pull_request:
    paths:
      - ".github/workflows/task-snapshot-import-provenance-executor.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply provenance projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          model_file = Path("extensions/workflow-register/src/gui/operationHubModel.ts")
          model = model_file.read_text(encoding="utf-8")
          model = model.replace(
              '  ARTIFACT_REUSE_STATE_KEY,\n  parseWorkflowArtifactManifest,',
              '  ARTIFACT_REUSE_STATE_KEY,\n  TASK_SNAPSHOT_IMPORT_STATE_KEY,\n  parseWorkflowArtifactManifest,',
              1
          )
          model = model.replace(
              '  artifactReuseLabel?: string\n  artifactReuseStatus?: OperationHubStatus\n  completedStepCount: number',
              '  artifactReuseLabel?: string\n  artifactReuseStatus?: OperationHubStatus\n  taskSnapshotImportLabel?: string\n  taskSnapshotImportStatus?: OperationHubStatus\n  completedStepCount: number',
              1
          )
          state_anchor = '''interface ArtifactReuseState {
            sourceRunId?: string
            startStepId?: string
            reusedStepIds?: unknown[]
            hydratedKeys?: unknown[]
          }
          '''
          state_insert = state_anchor + '''
          interface TaskSnapshotImportState {
            importedAt?: string
            imported?: unknown[]
          }
          '''
          if 'interface TaskSnapshotImportState' not in model:
              if state_anchor not in model:
                  raise SystemExit("artifact reuse state anchor not found")
              model = model.replace(state_anchor, state_insert, 1)
          model = model.replace(
              '  const artifactReuse = summarizeArtifactReuse(run)\n  return {',
              '  const artifactReuse = summarizeArtifactReuse(run)\n  const taskSnapshotImport = summarizeTaskSnapshotImport(run)\n  return {',
              1
          )
          model = model.replace(
              '    artifactReuseLabel: artifactReuse?.label,\n    artifactReuseStatus: artifactReuse?.status,\n    completedStepCount,',
              '    artifactReuseLabel: artifactReuse?.label,\n    artifactReuseStatus: artifactReuse?.status,\n    taskSnapshotImportLabel: taskSnapshotImport?.label,\n    taskSnapshotImportStatus: taskSnapshotImport?.status,\n    completedStepCount,',
              1
          )
          function_anchor = 'function artifactManifestForRun(run: WorkflowRunState): WorkflowArtifactManifest | undefined {'
          function_text = '''function summarizeTaskSnapshotImport(run: WorkflowRunState): { label: string; status: OperationHubStatus } | undefined {
            const value = run.state[TASK_SNAPSHOT_IMPORT_STATE_KEY]
            if (typeof value !== "string") return undefined
            const parsed = parseJsonObject(value) as TaskSnapshotImportState | undefined
            if (!parsed) return undefined
            const count = Array.isArray(parsed.imported) ? parsed.imported.length : 0
            const at = parsed.importedAt ? ` / ${parsed.importedAt}` : ""
            return { label: `Imported from task snapshot: ${count} artifact(s)${at}`, status: "ok" }
          }

          '''
          if 'function summarizeTaskSnapshotImport' not in model:
              if function_anchor not in model:
                  raise SystemExit("manifest function anchor not found")
              model = model.replace(function_anchor, function_text + function_anchor, 1)
          model_file.write_text(model, encoding="utf-8")

          html_file = Path("extensions/workflow-register/src/gui/operationHubHtml.ts")
          html = html_file.read_text(encoding="utf-8")
          html = html.replace(
              '''  const reuseBadge = run.artifactReuseLabel && run.artifactReuseStatus
                ? `<span class="badge ${escapeHtml(run.artifactReuseStatus)}">${escapeHtml(run.artifactReuseLabel)}</span>`
                : ""
            return `<article class="${cardClass}">''',
              '''  const reuseBadge = run.artifactReuseLabel && run.artifactReuseStatus
                ? `<span class="badge ${escapeHtml(run.artifactReuseStatus)}">${escapeHtml(run.artifactReuseLabel)}</span>`
                : ""
              const taskSnapshotImportBadge = run.taskSnapshotImportLabel && run.taskSnapshotImportStatus
                ? `<span class="badge ${escapeHtml(run.taskSnapshotImportStatus)}">${escapeHtml(run.taskSnapshotImportLabel)}</span>`
                : ""
            return `<article class="${cardClass}">''',
              1
          )
          html = html.replace('${syncBadge}${manifestBadge}${reuseBadge}</span>', '${syncBadge}${manifestBadge}${reuseBadge}${taskSnapshotImportBadge}</span>', 1)
          html_file.write_text(html, encoding="utf-8")

          view_file = Path("extensions/workflow-register/src/commands/runControlView.ts")
          view = view_file.read_text(encoding="utf-8")
          view = view.replace(
              'import { ARTIFACT_MANIFEST_STATE_KEY, ARTIFACT_REUSE_STATE_KEY } from "../core/artifacts"',
              'import { ARTIFACT_MANIFEST_STATE_KEY, ARTIFACT_REUSE_STATE_KEY, TASK_SNAPSHOT_IMPORT_STATE_KEY } from "../core/artifacts"',
              1
          )
          manifest_anchor = '''  if (typeof run.state[ARTIFACT_MANIFEST_STATE_KEY] === "string") {
            return {
              description: "artifacts",
              tooltip: "artifact manifest is available for skip resume"
            }
          }
          '''
          import_block = '''  const imported = parseReuse(run.state[TASK_SNAPSHOT_IMPORT_STATE_KEY])
            if (imported) {
              const importedCount = Array.isArray(imported.imported) ? imported.imported.length : 0
              return {
                description: `snapshot ${importedCount}`,
                tooltip: `imported from task snapshot: ${importedCount} artifact(s), at=${imported.importedAt ?? "unknown"}`
              }
            }
          '''
          if 'description: `snapshot ${importedCount}`' not in view:
              if manifest_anchor not in view:
                  raise SystemExit("run view manifest anchor not found")
              view = view.replace(manifest_anchor, import_block + manifest_anchor, 1)
          view = view.replace(
              '  if (run.state[ARTIFACT_REUSE_STATE_KEY]) return "references"\n  if (run.state[ARTIFACT_MANIFEST_STATE_KEY]) return "archive"',
              '  if (run.state[ARTIFACT_REUSE_STATE_KEY]) return "references"\n  if (run.state[TASK_SNAPSHOT_IMPORT_STATE_KEY]) return "cloud-download"\n  if (run.state[ARTIFACT_MANIFEST_STATE_KEY]) return "archive"',
              1
          )
          view_file.write_text(view, encoding="utf-8")
          PY
      - name: Verify projections
        working-directory: extensions/workflow-register
        run: |
          npm ci
          npm run compile
          node --test \
            test/operationHubTaskSnapshotImport.test.js \
            test/operationHubArtifactReuse.test.js \
            test/runControlViewArtifactReuse.test.js
      - name: Commit verified projections
        shell: bash
        run: |
          rm .github/workflows/task-snapshot-import-provenance-executor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            extensions/workflow-register/src/gui/operationHubModel.ts \
            extensions/workflow-register/src/gui/operationHubHtml.ts \
            extensions/workflow-register/src/commands/runControlView.ts \
            .github/workflows/task-snapshot-import-provenance-executor.yml
          git commit -m "feat: surface task snapshot import provenance"
          git push origin HEAD:${{ github.head_ref }}
