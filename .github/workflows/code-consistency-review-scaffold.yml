name: code-consistency-review-scaffold
run-name: ${{ github.event_name == 'workflow_dispatch' && format('wave0a-{0}-{1}', inputs.expectedHeadSha, inputs.dispatchNonce) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  pull_request:
    paths:
      - "tools/workflow-evidence/**"
      - "extensions/*/contracts/workflow-discovery-claims.json"
      - "extensions/*/contracts/workflow-contributions.json"
      - ".gitattributes"
      - "docs/workflows/code-consistency-review/scaffold/**"
      - "docs/workflows/code-consistency-review/schemas/**"
      - "docs/workflows/code-consistency-review/templates/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/check-export-star-policy.js"
      - "scripts/ci-baseline-summary.js"
      - ".bob/workflows/code-consistency-review/WORKFLOW.md"
      - "scripts/verify-ci-head*.js"
      - "scripts/exact-head-ci-contract.test.js"
      - "tools/main-consolidation/exact-head-ci-contract.json"
      - ".github/workflows/code-consistency-review-scaffold.yml"
  push:
    branches:
      - main
    paths:
      - "tools/workflow-evidence/**"
      - "extensions/*/contracts/workflow-discovery-claims.json"
      - "extensions/*/contracts/workflow-contributions.json"
      - ".gitattributes"
      - "docs/workflows/code-consistency-review/scaffold/**"
      - "docs/workflows/code-consistency-review/schemas/**"
      - "docs/workflows/code-consistency-review/templates/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/check-export-star-policy.js"
      - "scripts/ci-baseline-summary.js"
      - ".bob/workflows/code-consistency-review/WORKFLOW.md"
      - "scripts/verify-ci-head*.js"
      - "scripts/exact-head-ci-contract.test.js"
      - "tools/main-consolidation/exact-head-ci-contract.json"
      - ".github/workflows/code-consistency-review-scaffold.yml"
  workflow_dispatch:
    inputs:
      expectedHeadSha:
        description: Full commit SHA to check out and verify
        required: true
        type: string
      dispatchNonce:
        description: Machine-generated 32-character lowercase hex correlation ID
        required: true
        type: string
  # Manual dispatch is retained for explicit post-evidence scaffold verification.

concurrency:
  group: code-consistency-review-scaffold-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-scaffold:
    name: Validate scaffold
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs/workflows/code-consistency-review/scaffold

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/workflows/code-consistency-review/scaffold/package-lock.json

      - name: Record CI baseline
        run: node ../../../../scripts/ci-baseline-summary.js

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run unit

      - name: Smoke tests
        run: npm run smoke

  validate-extension:
    name: Validate VS Code extension
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Record CI baseline
        run: node ../../scripts/ci-baseline-summary.js

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run dependency:policy

      - name: Architecture policy
        run: npm run architecture:policy

      - name: Source policy
        run: npm run source:policy

      - name: Unused dependency report
        run: npm run unused:report

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: VSIX policy
        run: npm run package:policy
