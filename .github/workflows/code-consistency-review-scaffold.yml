name: code-consistency-review-scaffold

on:
  pull_request:
    paths:
      - "docs/workflows/code-consistency-review/scaffold/**"
      - "docs/workflows/code-consistency-review/schemas/**"
      - "docs/workflows/code-consistency-review/templates/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/check-export-star-policy.js"
      - ".bob/workflows/code-consistency-review/WORKFLOW.md"
      - ".github/workflows/code-consistency-review-scaffold.yml"
  push:
    branches:
      - main
    paths:
      - "docs/workflows/code-consistency-review/scaffold/**"
      - "docs/workflows/code-consistency-review/schemas/**"
      - "docs/workflows/code-consistency-review/templates/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/check-export-star-policy.js"
      - ".bob/workflows/code-consistency-review/WORKFLOW.md"
      - ".github/workflows/code-consistency-review-scaffold.yml"
  workflow_dispatch:

concurrency:
  group: code-consistency-review-scaffold-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-scaffold:
    name: Validate scaffold
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs/workflows/code-consistency-review/scaffold

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/workflows/code-consistency-review/scaffold/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run unit

      - name: Smoke tests
        run: npm run smoke

  validate-extension:
    name: Validate VS Code extension
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run dependency:policy

      - name: Architecture policy
        run: npm run architecture:policy

      - name: Source policy
        run: npm run source:policy

      - name: Unused dependency report
        run: npm run unused:report

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: VSIX policy
        run: npm run package:policy

  phase5-diagnostic:
    name: Phase 5 Windows diagnostic
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: |
          Push-Location extensions/bob-code-consistency-review
          npm ci
          Pop-Location
          Push-Location extensions/workflow-register
          npm ci
          Pop-Location

      - name: Capture unit boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Push-Location extensions/bob-code-consistency-review
          & npm run compile 2>&1 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\phase5-windows-compile.log"
          $compileExit = $LASTEXITCODE
          & node --test test/repositorySymbolIndexProducer.test.js 2>&1 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\phase5-windows-focused.log"
          $focusedExit = $LASTEXITCODE
          & npm test 2>&1 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\phase5-windows-full.log"
          $fullExit = $LASTEXITCODE
          Pop-Location

          Push-Location extensions/workflow-register
          & npm test 2>&1 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\workflow-register-windows.log"
          $workflowExit = $LASTEXITCODE
          Pop-Location

          @(
            "phase5_compile=$compileExit",
            "phase5_focused=$focusedExit",
            "phase5_full=$fullExit",
            "workflow_register=$workflowExit"
          ) | Set-Content -Encoding ascii "$env:RUNNER_TEMP\exit-codes.txt"
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase5-checkpoint-diagnostic
          path: |
            ${{ runner.temp }}\phase5-windows-compile.log
            ${{ runner.temp }}\phase5-windows-focused.log
            ${{ runner.temp }}\phase5-windows-full.log
            ${{ runner.temp }}\workflow-register-windows.log
            ${{ runner.temp }}\exit-codes.txt
          if-no-files-found: error
          retention-days: 1
