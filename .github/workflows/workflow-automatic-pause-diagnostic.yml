# Temporary verification workflow for PR #75; removed after standard gates are evidenced.
name: workflow-automatic-pause-diagnostic

on:
  pull_request:
    paths:
      - "extensions/workflow-register/**"
      - "extensions/bob-code-consistency-review/**"
      - ".github/workflows/workflow-automatic-pause-diagnostic.yml"

concurrency:
  group: workflow-automatic-pause-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-windows-path-test-fixes:
    if: github.event.pull_request.head.ref == 'agent/workflow-automatic-pause-ci-verification-20260712'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-automatic-pause-limits-20260712
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Apply physical-path fixture fixes
        run: python .github/scripts/apply-windows-path-test-fixes.py
      - name: Verify affected Linux tests
        shell: bash
        run: |
          cd extensions/workflow-register
          npm ci --silent
          npm run compile --silent
          node --test \
            test/bobGateLifecycle.test.js \
            test/operationHubMutations.test.js \
            test/processWorkflowEngineArtifacts.test.js \
            test/runStateStorePathBoundary.test.js \
            test/workflowArtifactManifest.test.js \
            test/workflowPlatformP0E2e.test.js \
            test/workflowRunStateMigrationPath.test.js \
            test/workflowTaskSnapshotArtifactImport.test.js \
            test/workspaceFileTransaction.test.js
          cd ../bob-code-consistency-review
          npm ci --silent
          npm run compile --silent
          node --test test/traceabilityCatalogStore.test.js
      - name: Commit verified portability fixes
        shell: bash
        run: |
          rm -f \
            .github/scripts/apply-windows-path-test-fixes.py \
            .github/workflows/agent-apply-windows-path-test-fixes.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: canonicalize Windows workspace fixtures"
          git push origin HEAD:agent/workflow-automatic-pause-limits-20260712

  focused-automatic-pause:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/workflow-register
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - name: Install dependencies
        run: npm ci --silent
      - name: Compile
        run: npm run compile --silent
      - name: Run focused automatic-pause tests
        id: focused
        continue-on-error: true
        shell: bash
        run: node --test test/workflowAutomaticPause*.test.js > "$RUNNER_TEMP/automatic-pause-focused.log" 2>&1
      - name: Run full workflow-register test suite
        id: full
        continue-on-error: true
        shell: bash
        run: node --test test/*.test.js > "$RUNNER_TEMP/workflow-register-full.log" 2>&1
      - name: Print relevant test output
        if: always()
        shell: bash
        run: |
          for log in "$RUNNER_TEMP/automatic-pause-focused.log" "$RUNNER_TEMP/workflow-register-full.log"; do
            echo "=== $log ==="
            grep -n -B 25 -A 120 -E "not ok|AssertionError|ERR_ASSERTION|error:|Error:" "$log" || tail -n 40 "$log"
          done
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automatic-pause-test-logs
          path: |
            ${{ runner.temp }}/automatic-pause-focused.log
            ${{ runner.temp }}/workflow-register-full.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve focused and full-suite results
        if: always()
        env:
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
        shell: bash
        run: |
          test "$FOCUSED_OUTCOME" = "success"
          test "$FULL_OUTCOME" = "success"

  ci-reproduction:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workflow-register-ubuntu
            os: ubuntu-latest
            extension: workflow-register
          - name: workflow-register-windows
            os: windows-latest
            extension: workflow-register
          - name: bob-code-consistency-windows
            os: windows-latest
            extension: bob-code-consistency-review
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/${{ matrix.extension }}/package-lock.json
      - name: Install dependencies
        run: npm ci --silent
      - name: Run npm test
        id: suite
        continue-on-error: true
        run: npm test > "$RUNNER_TEMP/test.log" 2>&1
      - name: Print relevant test output
        if: always()
        run: grep -n -B 35 -A 160 -E "not ok|AssertionError|ERR_ASSERTION|error:|Error:" "$RUNNER_TEMP/test.log" || tail -n 80 "$RUNNER_TEMP/test.log"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}-test-log
          path: ${{ runner.temp }}/test.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test result
        if: always()
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: test "$SUITE_OUTCOME" = "success"
