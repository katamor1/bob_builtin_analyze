name: workflow-automatic-pause-diagnostic

on:
  pull_request:
    paths:
      - "extensions/workflow-register/src/core/modelSchema.ts"
      - "extensions/workflow-register/src/core/schema/workflowSchema.ts"
      - "extensions/workflow-register/schema/workflow-register.v1.schema.json"
      - "extensions/workflow-register/src/core/parser/**"
      - "extensions/workflow-register/src/core/engine/automaticPause.ts"
      - "extensions/workflow-register/src/core/engine/runPause.ts"
      - "extensions/workflow-register/src/core/runtime/runControlStore.ts"
      - "extensions/workflow-register/src/core/runDiagnostics.ts"
      - "extensions/workflow-register/src/commands/inspectRunDiagnostics.ts"
      - "extensions/workflow-register/test/workflowAutomaticPause*.test.js"
      - ".github/workflows/workflow-automatic-pause-diagnostic.yml"

concurrency:
  group: workflow-automatic-pause-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused-automatic-pause:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/workflow-register
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - name: Install dependencies
        run: npm ci --silent
      - name: Compile
        run: npm run compile --silent
      - name: Run focused automatic-pause tests
        id: focused
        shell: bash
        run: |
          set +e
          node --test test/workflowAutomaticPause*.test.js > "$RUNNER_TEMP/automatic-pause-focused.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/automatic-pause-focused.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Run full workflow-register test suite
        id: full
        shell: bash
        run: |
          set +e
          node --test test/*.test.js > "$RUNNER_TEMP/workflow-register-full.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -n -B 25 -A 120 -E "not ok|AssertionError|ERR_ASSERTION|error:" "$RUNNER_TEMP/workflow-register-full.log" || tail -n 300 "$RUNNER_TEMP/workflow-register-full.log"
          else
            tail -n 30 "$RUNNER_TEMP/workflow-register-full.log"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automatic-pause-test-logs
          path: |
            ${{ runner.temp }}/automatic-pause-focused.log
            ${{ runner.temp }}/workflow-register-full.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when focused or full suite failed
        if: steps.focused.outputs.status != '0' || steps.full.outputs.status != '0'
        shell: bash
        run: exit 1
