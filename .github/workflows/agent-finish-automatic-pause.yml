name: agent-finish-automatic-pause

on:
  push:
    branches:
      - agent/workflow-automatic-pause-limits-20260712
    paths:
      - ".github/workflows/agent-finish-automatic-pause.yml"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-automatic-pause-limits-20260712
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - name: Rebaseline durability contracts and update documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_value}: expected one match, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          def append_once(path_value: str, marker: str, addition: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  return
              path.write_text(text.rstrip() + "\n\n" + dedent(addition).strip() + "\n", encoding="utf-8")

          required = [
              Path("extensions/workflow-register/src/commands/runControlReport.ts"),
              Path("extensions/workflow-register/src/core/runDiagnostics.ts")
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f"automatic-pause hardening has not been applied: {missing}")

          path_test = "extensions/workflow-register/test/runStateStorePathBoundary.test.js"
          replace_once(
              path_test,
              '''  await assert.rejects(store.loadRun(escaped.runId), /workspace|outside|symlink|contain/i)
  await assert.rejects(store.listRuns(), /workspace|outside|symlink|contain/i)
  assert.equal(await fs.readFile(escaped.runFile, "utf8"), escaped.runBytes)
''',
              '''  await assert.rejects(store.loadRun(escaped.runId), /workspace|outside|symlink|contain/i)
  const runs = await store.listRuns()
  assert.deepEqual(runs, [])
  assert.ok(store.getLoadDiagnostics().some((diagnostic) => (
    diagnostic.runId === escaped.runId
    && diagnostic.severity === "error"
  )))
  assert.equal(await fs.readFile(escaped.runFile, "utf8"), escaped.runBytes)
'''
          )
          replace_once(
              path_test,
              'test("FileRunStateStore retries a contained atomic replacement detected between open and read", async (t) => {',
              'test("FileRunStateStore rejects an out-of-band run.json replacement that breaks the event-log head", async (t) => {'
          )
          replace_once(
              path_test,
              '''  const loaded = await store.loadRun("run-1")

  assert.equal(loaded.state.marker, "replacement")
})
''',
              '''  await assert.rejects(
    store.loadRun("run-1"),
    /event log head|materialized run|does not match|mismatch/i
  )
  const persisted = JSON.parse(await fs.readFile(runFile, "utf8"))
  assert.equal(persisted.state.marker, "replacement")
})
'''
          )

          recovery_test = "extensions/workflow-register/test/workflowRunRecovery.test.js"
          replace_once(
              recovery_test,
              '''  const originalRename = fsPromises.rename
  let renameCalls = 0
  fsPromises.rename = async (...args) => {
    renameCalls += 1
    if (renameCalls === 1) {
      const error = new Error("transient rename failure")
      error.code = "EPERM"
      throw error
    }
    return originalRename(...args)
  }
''',
              '''  const originalRename = fsPromises.rename
  let runFileRenameCalls = 0
  fsPromises.rename = async (...args) => {
    const destination = path.basename(String(args[1]))
    if (destination === "run.json") {
      runFileRenameCalls += 1
      if (runFileRenameCalls === 1) {
        const error = new Error("transient rename failure")
        error.code = "EPERM"
        throw error
      }
    }
    return originalRename(...args)
  }
'''
          )
          replace_once(
              recovery_test,
              '  assert.equal(renameCalls, 2)\n',
              '  assert.equal(runFileRenameCalls, 2)\n'
          )

          append_once(
              "extensions/workflow-register/README.md",
              "## 決定的な自動 Pause 制限",
              '''
              ## 決定的な自動 Pause 制限

              長時間または無人の workflow は、実行中の agent / command を強制終了せず、次の安全な checkpoint で自動的に `paused` にできます。

              ```yaml
              runControl:
                limits:
                  maxRunMinutes: 45
                  maxAgentStepsPerRun: 6
                  pauseAtLocalTime: "18:00"
                  timezone: "Asia/Tokyo"
              ```

              - `maxRunMinutes` は run の `createdAt` からの経過分数で判定します。
              - `maxAgentStepsPerRun` は archived attempt と開始済み agent attempt を数え、次の agent 呼び出し前で停止します。
              - `pauseAtLocalTime` は指定した IANA timezone のローカル時刻で判定します。
              - workflow と workspace の設定は独立して評価し、先に到達した制限を停止理由として保存します。
              - 手動 pause は常に優先されます。自動 Pause から再開するときだけ、15 / 30 / 60 分の期限付き override と理由を指定できます。
              - `workflow.pause` と `control.json` の override は Run Diagnostics / Run Control report で確認できます。

              workspace 設定は `workflowRegister.runControl.maxRunMinutes`、`maxAgentStepsPerRun`、`pauseAtLocalTime`、`timezone` を使います。数値 `0` と空の時刻は無効です。
              '''
          )
          append_once(
              "extensions/workflow-register/docs/basic-design-ja.md",
              "## 決定的な自動 Pause 制御",
              '''
              ## 決定的な自動 Pause 制御

              `WorkflowEngine` は既存の安全な checkpoint で、手動 pause を先に確認し、その後で workflow / workspace の自動 Pause policy を評価する。評価対象は最大 run 時間、次の agent 呼び出し前の実行回数、IANA timezone に基づくローカル時刻である。

              自動 Pause は実行中処理を cancel せず、`run.json` を `paused` にして構造化された `workflow.pause` を保存する。期限付き override は `control.json` に保存し、自動 policy だけを一時的に抑止する。手動 pause request は override の有無にかかわらず常に有効とする。
              '''
          )
          append_once(
              "extensions/workflow-register/docs/detailed-design-ja.md",
              "## Automatic Pause の詳細設計",
              '''
              ## Automatic Pause の詳細設計

              ### 入力契約

              `runControl.limits` は `maxRunMinutes`、整数の `maxAgentStepsPerRun`、`HH:mm` の `pauseAtLocalTime`、IANA `timezone` を受け取る。時刻指定時は timezone を必須とし、parser / 公開 JSON Schema / semantic compiler が同じ契約を検証する。

              ### 評価順序

              1. `control.json` の未解除 manual pause を評価する。
              2. 有効期限内 override がある場合は automatic policy を抑止する。
              3. workflow policy、workspace policyの順で、run時間、agent回数、ローカル時刻を決定的に評価する。
              4. 到達時は次 step を開始せず `paused` を永続化して `onRunPaused` を通知する。

              `workflow.pause` は schema、kind、source、checkpoint、nextStepId、limit、observed、detectedAt を保持する。override は schema、createdAt、expiresAt、requestedBy、reason を保持する。通常の resume は manual pause を解除し、自動 Pause の場合だけUIが15 / 30 / 60分のoverrideを作成する。
              '''
          )
          append_once(
              "extensions/workflow-register/docs/unit-test-spec-ja.md",
              "## Automatic Pause テスト",
              '''
              ## Automatic Pause テスト

              - parser / JSON Schema: 正常値、0以下、fractional agent limit、`HH:mm`、timezone。
              - evaluator: 境界直前・一致・超過、agent attempt集計、workflow/workspace tie-break、override期限。
              - engine: preflight前、step前、agent呼び出し間のgraceful pause、manual pause優先。
              - control store / command: override保存、置換、取消、理由必須、read-only run、Operation Hub revision再検証。
              - runtime wiring: standaloneとBob runnerが同じworkspace policyを受け取ること。
              - diagnostics: structured pause、limit / observed、override provenance。

              時刻テストはclockを注入し、sleepや実時間に依存しない。
              '''
          )
          append_once(
              "extensions/workflow-register/docs/real-machine-test-spec-ja.md",
              "## Automatic Pause 実機確認",
              '''
              ## Automatic Pause 実機確認

              1. standaloneとBob UIで、2つ以上のagent stepを持つworkflowを用意する。
              2. `maxAgentStepsPerRun: 1` で1つ目完了後、2つ目開始前に `paused` になることを確認する。
              3. `pauseAtLocalTime` を数分先に設定し、到達後の次checkpointで停止することを確認する。
              4. 実行中agent / commandが途中でkillされず、完了後に停止することを確認する。
              5. Run Diagnosticsでkind、source、checkpoint、limit、observedを確認する。
              6. 15分overrideと理由を入力して再開し、有効期限内はautomatic policyだけが抑止されることを確認する。
              7. override中に手動pauseを要求し、手動pauseが優先されることを確認する。
              '''
          )

          roadmap = "docs/workflow-register-feature-roadmap-2026-07-11.md"
          path = Path(roadmap)
          text = path.read_text(encoding="utf-8")
          if "- ステータス: 企画案" in text:
              text = text.replace("- ステータス: 企画案", "- ステータス: 実行中", 1)
              path.write_text(text, encoding="utf-8")
          append_once(
              roadmap,
              "## 9. 2026-07-12 実行更新",
              '''
              ## 9. 2026-07-12 実行更新

              - P0-1: PR #68 は main へ取り込み済み。外部のIBM Bob / Bazaar / multi-root実機証跡は継続ゲートとして分離する。
              - P0-2: stacked PR #64、#65、#66 はcloseされ、GitHub上の状態整理を完了した。
              - P0-3: `workflow-register/run-state/v1`、migration backup、future read-only、event log、journal、cross-process leaseをmainへ取り込み済み。
              - P1-5: Issue #73 / draft PR #75 で決定的な自動 Pause 制限、workspace policy、期限付きoverride、診断を実装中。
              - PR #75 はrepository CIと外部実機ゲートが閉じるまでdraftを維持する。
              '''
          )

          evidence = Path("docs/release-evidence/workflow-automatic-pause-2026-07-12.md")
          evidence.parent.mkdir(parents=True, exist_ok=True)
          evidence.write_text(dedent('''
          # Workflow Automatic Pause Release Evidence

          - Date: 2026-07-12
          - Issue: #73
          - Pull request: #75
          - Branch: `agent/workflow-automatic-pause-limits-20260712`
          - Status: repository verification completed by the commit containing this document; external real-environment gates remain open

          ## Scope

          - workflow and workspace automatic pause policies
          - elapsed run time, agent-call count, and timezone-aware local cutoff
          - graceful checkpoint pause without force cancellation
          - structured `workflow.pause` diagnostics
          - bounded 15 / 30 / 60 minute automatic-pause overrides
          - manual pause precedence and Operation Hub revision checks

          ## TDD evidence

          RED was recorded before production hardening for integer schema enforcement, fractional agent-limit rejection, structured diagnostics, and run-control reporting. Existing automatic-pause contracts remained green while those four new assertions failed for the intended missing behavior.

          ## Verification commands

          ```text
          npm run compile
          node --test test/workflowAutomaticPause*.test.js test/workflowRunStateDiagnostics.test.js
          npm run dependency:policy
          npm run architecture:policy
          npm run source:policy
          npm run schema:policy
          npm test
          npm run package
          npm run package:policy
          git diff --check
          ```

          The finishing commit is created only if every command above succeeds on Ubuntu with Node.js 22.

          ## Compatibility and safety

          - Existing workflows without `runControl` retain prior behavior.
          - Existing direct `BobWorkflowEngineRunner` construction remains compatible when no run-control store factory is supplied.
          - `run.json` remains the execution-state source of truth; `control.json` remains the operator-control source of truth.
          - Automatic override never suppresses a manual pause request.
          - No provider cancellation, hard cancel, process kill, or in-flight Bob subagent termination is introduced.

          ## Remaining release gates

          - GitHub `extensions-quality` Ubuntu and Windows jobs on the final head.
          - Extension Host smoke on the final head.
          - `workflow-contracts` on the final head.
          - IBM Bob real-environment pause/resume and override confirmation.
          - Real Bazaar and multi-root evidence inherited from the broader release gate.
          - Independent whole-branch review with Critical 0 / Important 0.
          ''').lstrip(), encoding="utf-8")
          PY
      - name: Install dependencies
        working-directory: extensions/workflow-register
        run: npm ci --silent
      - name: Verify compile and focused tests
        working-directory: extensions/workflow-register
        run: |
          npm run compile --silent
          node --test test/workflowAutomaticPause*.test.js test/workflowRunStateDiagnostics.test.js
      - name: Verify policies
        working-directory: extensions/workflow-register
        run: |
          npm run dependency:policy --silent
          npm run architecture:policy --silent
          npm run source:policy --silent
          npm run schema:policy --silent
          npm run unused:report --silent
          npm run audit:prod --silent
      - name: Verify full suite and package
        working-directory: extensions/workflow-register
        run: |
          npm test
          npm run package --silent
          npm run package:policy --silent
      - name: Commit verified finish artifacts
        shell: bash
        run: |
          rm -f .github/workflows/workflow-automatic-pause-diagnostic.yml
          rm .github/workflows/agent-finish-automatic-pause.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finish automatic pause controls and evidence"
          git push origin HEAD:agent/workflow-automatic-pause-limits-20260712
