name: Temporary implementation workspace export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-workspace:
    if: github.head_ref == 'codex/execute-shared-plan-6a53743e'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Archive implementation workspace
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --output="$RUNNER_TEMP/bob-evidence-scope-workspace.tar.gz" \
            HEAD \
            extensions scripts .github docs .bob

      - name: Upload implementation workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bob-evidence-scope-workspace
          path: ${{ runner.temp }}/bob-evidence-scope-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
