name: workflow-builder-skip-resume-tdd

on:
  pull_request:
    paths:
      - ".github/workflows/workflow-builder-skip-resume-tdd.yml"
      - "extensions/workflow-register/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extensions/workflow-register
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Capture full-suite result
        shell: bash
        run: |
          set +e
          npm test > full-output.txt 2>&1
          status=$?
          FULL_STATUS="$status" node - <<'NODE'
          const fs = require('fs')
          const text = fs.readFileSync('full-output.txt', 'utf8')
          const lines = text.split(/\r?\n/)
          const selected = []
          for (let i = 0; i < lines.length; i += 1) {
            if (/^(not ok|# fail|# tests|# pass|# duration_ms)/.test(lines[i])) {
              selected.push(...lines.slice(Math.max(0, i - 8), Math.min(lines.length, i + 35)))
            }
          }
          fs.writeFileSync('focused-output.txt', selected.join('\n') + `\nfull_status=${process.env.FULL_STATUS}\n`)
          NODE
          exit 0
      - name: Upload focused evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-builder-skip-resume-tdd
          path: extensions/workflow-register/focused-output.txt
          retention-days: 1
