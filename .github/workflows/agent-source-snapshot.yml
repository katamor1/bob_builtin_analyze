name: agent-source-snapshot

on:
  pull_request:
    paths:
      - ".bob/workflows/**"
      - "extensions/workflow-register/samples/**"
      - "extensions/bob-bazaar-review/templates/**"
      - "extensions/bob-code-consistency-review/templates/**"
      - "docs/workflows/**"
      - ".github/workflows/agent-source-snapshot.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-source-snapshot
          path: |
            .bob/workflows
            extensions/workflow-register/samples
            extensions/bob-bazaar-review/templates
            extensions/bob-code-consistency-review/templates
            docs/workflows
          if-no-files-found: error
          retention-days: 1
