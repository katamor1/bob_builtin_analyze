name: agent-code-consistency-full-diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - agent/three-extension-remediation-20260711
    paths:
      - "extensions/bob-code-consistency-review/**"
      - ".github/workflows/agent-code-consistency-full-diagnostic.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json
      - run: npm ci
      - name: Capture full test failure
        id: tests
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/code-consistency-full.log" 2>&1
          status=$?
          grep -n -B 35 -A 90 -E "not ok|AssertionError|error TS[0-9]+" "$RUNNER_TEMP/code-consistency-full.log" > "$RUNNER_TEMP/code-consistency-failure.log"
          if [ ! -s "$RUNNER_TEMP/code-consistency-failure.log" ]; then
            tail -n 140 "$RUNNER_TEMP/code-consistency-full.log" > "$RUNNER_TEMP/code-consistency-failure.log"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Comment full-test diagnostic
        uses: actions/github-script@v7
        env:
          TEST_STATUS: ${{ steps.tests.outputs.status }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- agent-code-consistency-full-diagnostic -->";
            const excerpt = fs.readFileSync(process.env.RUNNER_TEMP + "/code-consistency-failure.log", "utf8");
            const body = `${marker}\n## Code consistency full-test diagnostic\n\nExit: ${process.env.TEST_STATUS}\n\n\`\`\`text\n${excerpt.slice(0, 12000)}\n\`\`\``;
            const issue_number = 68;
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number });
            const previous = comments.data.find((comment) => comment.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
