name: Export evidence scope workspace

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e
    paths:
      - .github/workflows/export-evidence-scope-current.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Create workspace archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude='**/node_modules' \
            --exclude='**/out' \
            --exclude='**/*.vsix' \
            --exclude='.bob-review' \
            -czf "$RUNNER_TEMP/evidence-scope-current.tar.gz" .

      - name: Upload workspace archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-scope-current-${{ github.sha }}
          path: ${{ runner.temp }}/evidence-scope-current.tar.gz
          if-no-files-found: error
          retention-days: 1
