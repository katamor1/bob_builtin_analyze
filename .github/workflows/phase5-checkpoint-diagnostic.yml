name: Phase 5 checkpoint diagnostic

on:
  pull_request:
    paths:
      - "extensions/bob-code-consistency-review/**"
      - "extensions/workflow-register/**"
      - ".github/workflows/phase5-checkpoint-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: |
          Push-Location extensions/bob-code-consistency-review
          npm ci
          Pop-Location
          Push-Location extensions/workflow-register
          npm ci
          Pop-Location

      - name: Capture unit boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $diagnostic = $env:RUNNER_TEMP

          Push-Location extensions/bob-code-consistency-review
          & npm run compile 2>&1 | Set-Content -Encoding utf8 (Join-Path $diagnostic 'phase5-windows-compile.log')
          $compileExit = $LASTEXITCODE
          & node --test test/repositorySymbolIndexProducer.test.js 2>&1 | Set-Content -Encoding utf8 (Join-Path $diagnostic 'phase5-windows-focused.log')
          $focusedExit = $LASTEXITCODE
          & npm test 2>&1 | Set-Content -Encoding utf8 (Join-Path $diagnostic 'phase5-windows-full.log')
          $fullExit = $LASTEXITCODE
          Pop-Location

          Push-Location extensions/workflow-register
          & npm test 2>&1 | Set-Content -Encoding utf8 (Join-Path $diagnostic 'workflow-register-windows.log')
          $workflowExit = $LASTEXITCODE
          Pop-Location

          @(
            "phase5_compile=$compileExit",
            "phase5_focused=$focusedExit",
            "phase5_full=$fullExit",
            "workflow_register=$workflowExit"
          ) | Set-Content -Encoding ascii (Join-Path $diagnostic 'exit-codes.txt')
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase5-checkpoint-diagnostic
          path: |
            ${{ runner.temp }}\phase5-windows-compile.log
            ${{ runner.temp }}\phase5-windows-focused.log
            ${{ runner.temp }}\phase5-windows-full.log
            ${{ runner.temp }}\workflow-register-windows.log
            ${{ runner.temp }}\exit-codes.txt
          if-no-files-found: error
          retention-days: 1
