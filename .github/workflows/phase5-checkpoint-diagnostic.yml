name: Phase 5 checkpoint diagnostic

on:
  push:
    branches:
      - codex/evidence-scope-phase5-checkpoint-20260712

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/evidence-scope-phase5-checkpoint-20260712
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: pwsh
        run: |
          Push-Location extensions/bob-code-consistency-review
          npm ci
          Pop-Location
          Push-Location extensions/workflow-register
          npm ci
          Pop-Location

      - name: Capture failing unit boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $diagnostic = Join-Path $PWD 'docs/implementation/diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnostic | Out-Null

          Push-Location extensions/bob-code-consistency-review
          & npm run compile 2>&1 | Set-Content -Encoding utf8 (Join-Path $diagnostic 'phase5-windows-compile.log')
          $compileExit = $LASTEXITCODE
          & node --test test/repositorySymbolIndexProducer.test.js 2>&1 | Set-Content -Encoding utf8 (Join-Path $diagnostic 'phase5-windows-focused.log')
          $focusedExit = $LASTEXITCODE
          & npm test 2>&1 | Set-Content -Encoding utf8 (Join-Path $diagnostic 'phase5-windows-full.log')
          $fullExit = $LASTEXITCODE
          Pop-Location

          Push-Location extensions/workflow-register
          & npm test 2>&1 | Set-Content -Encoding utf8 (Join-Path $diagnostic 'workflow-register-windows.log')
          $workflowExit = $LASTEXITCODE
          Pop-Location

          @(
            "phase5_compile=$compileExit",
            "phase5_focused=$focusedExit",
            "phase5_full=$fullExit",
            "workflow_register=$workflowExit"
          ) | Set-Content -Encoding ascii (Join-Path $diagnostic 'exit-codes.txt')
          exit 0

      - name: Commit diagnostic evidence
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/implementation/diagnostics
          git commit -m 'ci: record phase 5 checkpoint diagnostics'
          git push origin HEAD:codex/evidence-scope-phase5-checkpoint-20260712
