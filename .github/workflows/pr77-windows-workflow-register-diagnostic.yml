name: pr77-windows-workflow-register-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/pr77-windows-workflow-register-diagnostic.yml"
      - "extensions/workflow-register/**"
  workflow_dispatch:

concurrency:
  group: pr77-windows-workflow-register-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extensions/workflow-register
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Capture full Windows unit-test output
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "workflow-register-windows-test.log"
          npm test *> $log
          $status = $LASTEXITCODE
          "`nEXIT_CODE=$status" | Out-File -FilePath $log -Append -Encoding utf8
          Write-Host "Captured test output with exit code $status"
          exit 0

      - name: Upload diagnostic log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr77-windows-workflow-register-diagnostic
          path: ${{ runner.temp }}/workflow-register-windows-test.log
          if-no-files-found: error
          retention-days: 1
