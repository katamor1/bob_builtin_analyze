name: workflow-builder-skip-resume-task4-ui

on:
  pull_request:
    paths:
      - ".github/workflows/workflow-builder-skip-resume-task4-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-builder-skip-resume-readiness-20260712
          fetch-depth: 0
      - name: Integrate readiness UI and request correlation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function patch(file, replacements) {
            let source = fs.readFileSync(file, 'utf8')
            for (const [before, after] of replacements) {
              const count = source.split(before).length - 1
              if (count !== 1) throw new Error(`${file}: expected one match, got ${count}: ${before.slice(0, 100)}`)
              source = source.replace(before, after)
            }
            fs.writeFileSync(file, source, 'utf8')
          }

          patch('extensions/workflow-register/src/webview/workflowBuilderClientScript.ts', [
            [
              'import { renderWorkflowBuilderPreviewScript } from "./workflowBuilderPreviewScript"',
              'import { renderWorkflowBuilderPreviewScript } from "./workflowBuilderPreviewScript"\nimport { renderWorkflowBuilderSkipResumeReadinessScript } from "./workflowBuilderSkipResumeReadinessScript"'
            ],
            [
              '    renderWorkflowBuilderFieldEventsScript(),\n    renderWorkflowBuilderActionEventsScript()',
              '    renderWorkflowBuilderFieldEventsScript(),\n    renderWorkflowBuilderSkipResumeReadinessScript(),\n    renderWorkflowBuilderActionEventsScript()'
            ]
          ])

          patch('extensions/workflow-register/src/webview/workflowBuilderTabRenderersScript.ts', [
            [
              "content.innerHTML = '<h2>Artifacts</h2><button data-action=\"add-artifact\">+ artifact</button>' + model.artifacts.map",
              "content.innerHTML = '<h2>Artifacts</h2>' + renderSkipResumeReadiness() + '<button data-action=\"add-artifact\">+ artifact</button>' + model.artifacts.map"
            ],
            [
              "'<p class=\"muted\">producedBy は存在する step id から選択してください。schema は任意の成果物スキーマ識別子です。</p>'; }",
              "'<p class=\"muted\">producedBy は存在する step id から選択してください。schema は任意の成果物スキーマ識別子です。</p>'; queueSkipResumeReadinessPreview(); }"
            ]
          ])

          patch('extensions/workflow-register/src/webview/workflowBuilderStyles.ts', [[
            '.help-result span, .help-result em { display: block; color: var(--vscode-descriptionForeground); font-size: 11px; font-style: normal; margin-top: 2px; }',
            `.help-result span, .help-result em { display: block; color: var(--vscode-descriptionForeground); font-size: 11px; font-style: normal; margin-top: 2px; }\n.skip-resume-readiness { border-left: 4px solid var(--vscode-focusBorder); }\n.skip-resume-candidate { border-top: 1px solid var(--vscode-panel-border); padding: 8px 0; }\n.skip-resume-candidate:first-of-type { border-top: none; }\n.skip-resume-blockers { border-left: 4px solid var(--vscode-testing-iconFailed); padding: 8px; margin: 8px 0; background: var(--vscode-inputValidation-errorBackground); }\n.skip-resume-markdown-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 10px; }\n.skip-resume-markdown-grid pre { max-height: 320px; font-size: 11px; }`
          ]])

          patch('extensions/workflow-register/src/webview/workflowBuilderPanel.ts', [
            [
              '| { type: "previewSkipResumeReadiness"; model: WorkflowAuthoringModel; selectedStepIds?: string[] }\n  | { type: "applySkipResumeReadiness"; model: WorkflowAuthoringModel; selectedStepIds: string[] }',
              '| { type: "previewSkipResumeReadiness"; model: WorkflowAuthoringModel; selectedStepIds?: string[]; requestId: string }\n  | { type: "applySkipResumeReadiness"; model: WorkflowAuthoringModel; selectedStepIds: string[]; requestId: string }'
            ],
            [
              'if (message.type === "previewSkipResumeReadiness") return this.previewSkipResumeReadiness(message.model, message.selectedStepIds)\n    if (message.type === "applySkipResumeReadiness") return this.applySkipResumeReadiness(message.model, message.selectedStepIds)',
              'if (message.type === "previewSkipResumeReadiness") return this.previewSkipResumeReadiness(message.model, message.selectedStepIds, message.requestId)\n    if (message.type === "applySkipResumeReadiness") return this.applySkipResumeReadiness(message.model, message.selectedStepIds, message.requestId)'
            ],
            [
              'private async previewSkipResumeReadiness(model: WorkflowAuthoringModel, selectedStepIds?: string[]): Promise<void> {',
              'private async previewSkipResumeReadiness(model: WorkflowAuthoringModel, selectedStepIds: string[] | undefined, requestId: string): Promise<void> {'
            ],
            [
              'type: "skipResumeReadinessPreviewResult",\n      ...this.skipResumeReadinessPreviewPayload(preview)',
              'type: "skipResumeReadinessPreviewResult",\n      requestId,\n      ...this.skipResumeReadinessPreviewPayload(preview)'
            ],
            [
              'private async applySkipResumeReadiness(model: WorkflowAuthoringModel, selectedStepIds: string[]): Promise<void> {',
              'private async applySkipResumeReadiness(model: WorkflowAuthoringModel, selectedStepIds: string[], requestId: string): Promise<void> {'
            ],
            [
              'type: "skipResumeReadinessPreviewResult",\n        ...this.skipResumeReadinessPreviewPayload(result)',
              'type: "skipResumeReadinessPreviewResult",\n        requestId,\n        ...this.skipResumeReadinessPreviewPayload(result)'
            ],
            [
              'type: "skipResumeReadinessApplied",\n      model: result.model,',
              'type: "skipResumeReadinessApplied",\n      requestId,\n      model: result.model,'
            ]
          ])
          NODE
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - name: Install dependencies
        working-directory: extensions/workflow-register
        run: npm ci
      - name: Verify readiness UX GREEN
        working-directory: extensions/workflow-register
        run: |
          npm run compile
          node --test \
            test/workflowSkipResumeAuthoringRoundTrip.test.js \
            test/workflowSkipResumeReadiness.test.js \
            test/workflowSkipResumeReadinessPreview.test.js \
            test/workflowBuilderSkipResumeReadinessWebview.test.js \
            test/workflowBuilderWebviewModules.test.js
      - name: Remove executor and commit verified UI
        shell: bash
        run: |
          rm .github/workflows/workflow-builder-skip-resume-task4-ui.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/workflow-builder-skip-resume-task4-ui.yml \
            extensions/workflow-register/src/webview/workflowBuilderClientScript.ts \
            extensions/workflow-register/src/webview/workflowBuilderTabRenderersScript.ts \
            extensions/workflow-register/src/webview/workflowBuilderStyles.ts \
            extensions/workflow-register/src/webview/workflowBuilderPanel.ts
          git commit -m "feat: add skip resume readiness to builder"
          git push origin HEAD:agent/workflow-builder-skip-resume-readiness-20260712
