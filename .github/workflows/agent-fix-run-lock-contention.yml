name: agent-fix-run-lock-contention

on:
  pull_request:
    paths:
      - "extensions/workflow-register/test/fixtures/automatic-pause-ci-verification.txt"
      - ".github/workflows/agent-fix-run-lock-contention.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/workflow-automatic-pause-ci-verification-20260712'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-automatic-pause-limits-20260712
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Apply contention and Windows alias fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_value}: expected one match, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          run_lock = "extensions/workflow-register/src/core/runtime/runLock.ts"
          old_acquire = dedent('''
          async function acquireWorkflowRunLock(
            workspaceRoot: string,
            runId: string,
            options: ResolvedWorkflowRunLockOptions
          ): Promise<WorkflowRunLockV1> {
            const startedAt = Date.now()
            while (true) {
              const now = options.now()
              const owner: WorkflowRunLockV1 = {
                schemaVersion: CURRENT_WORKFLOW_RUN_LOCK_SCHEMA_VERSION,
                runId,
                token: options.token(),
                pid: process.pid,
                hostname: options.hostname,
                createdAt: now.toISOString(),
                heartbeatAt: now.toISOString()
              }
              if (await createRunDurabilityFile(workspaceRoot, runId, "run.lock.json", serializeWorkflowRunLock(owner))) return owner

              const snapshot = await readRunDurabilityFile(workspaceRoot, runId, "run.lock.json")
              if (!snapshot) continue
              const inspection = inspectExistingLock(snapshot.bytes, snapshot.mtimeMs, runId, options)
              if (inspection.reclaim) {
                const removed = await removeRunDurabilityFile(workspaceRoot, runId, "run.lock.json", snapshot.bytes)
                if (removed) {
                  try {
                    options.onReclaimed?.(inspection.message)
                  } catch (error) {
                    console.warn("Workflow run lock reclamation callback failed.", error)
                  }
                  continue
                }
              }

              const elapsed = Date.now() - startedAt
              if (elapsed >= options.timeoutMs) {
                throw new Error(`Workflow run '${runId}' is busy or locked by another process. ${inspection.message}`)
              }
              await options.sleep(Math.min(options.pollMs, Math.max(1, options.timeoutMs - elapsed)))
            }
          }
          ''').strip()
          new_acquire = dedent('''
          async function acquireWorkflowRunLock(
            workspaceRoot: string,
            runId: string,
            options: ResolvedWorkflowRunLockOptions
          ): Promise<WorkflowRunLockV1> {
            const startedAt = Date.now()
            while (true) {
              const now = options.now()
              const owner: WorkflowRunLockV1 = {
                schemaVersion: CURRENT_WORKFLOW_RUN_LOCK_SCHEMA_VERSION,
                runId,
                token: options.token(),
                pid: process.pid,
                hostname: options.hostname,
                createdAt: now.toISOString(),
                heartbeatAt: now.toISOString()
              }
              let contentionMessage = "Lock metadata changed while it was being inspected."
              try {
                if (await createRunDurabilityFile(workspaceRoot, runId, "run.lock.json", serializeWorkflowRunLock(owner))) return owner

                const snapshot = await readRunDurabilityFile(workspaceRoot, runId, "run.lock.json")
                if (!snapshot) continue
                const inspection = inspectExistingLock(snapshot.bytes, snapshot.mtimeMs, runId, options)
                contentionMessage = inspection.message
                if (inspection.reclaim) {
                  const removed = await removeRunDurabilityFile(workspaceRoot, runId, "run.lock.json", snapshot.bytes)
                  if (removed) {
                    try {
                      options.onReclaimed?.(inspection.message)
                    } catch (error) {
                      console.warn("Workflow run lock reclamation callback failed.", error)
                    }
                    continue
                  }
                }
              } catch (error) {
                if (!isTransientLockContention(error, runId)) throw error
                contentionMessage = `Lock metadata changed while it was being inspected (${formatError(error)}).`
              }

              const elapsed = Date.now() - startedAt
              if (elapsed >= options.timeoutMs) {
                throw new Error(`Workflow run '${runId}' is busy or locked by another process. ${contentionMessage}`)
              }
              await options.sleep(Math.min(options.pollMs, Math.max(1, options.timeoutMs - elapsed)))
            }
          }
          ''').strip()
          replace_once(run_lock, old_acquire, new_acquire)
          replace_once(
              run_lock,
              "function resolveOptions(options: WorkflowRunLockOptions): ResolvedWorkflowRunLockOptions {",
              dedent('''
              function isTransientLockContention(error: unknown, runId: string): boolean {
                const message = formatError(error)
                return message.includes(`Workflow run '${runId}' durability file 'run.lock.json'`)
                  && (
                    message.includes("changed while its path was being verified")
                    || message.includes("changed while it was being read")
                  )
              }

              function resolveOptions(options: WorkflowRunLockOptions): ResolvedWorkflowRunLockOptions {
              ''').strip()
          )

          trace_test = "extensions/bob-code-consistency-review/test/traceabilityCatalogStore.test.js"
          replace_once(
              trace_test,
              "  assert.equal(path.dirname(aliasWinner.backupPath), path.dirname(directPath))",
              dedent('''
                assert.equal(
                  normalizePhysicalPath(await fs.realpath(path.dirname(aliasWinner.backupPath))),
                  normalizePhysicalPath(await fs.realpath(path.dirname(directPath)))
                )
              ''').rstrip()
          )
          PY
      - name: Verify workflow-register
        shell: bash
        run: |
          cd extensions/workflow-register
          npm ci --silent
          npm run compile --silent
          node --test test/workflowRunLock.test.js test/workflowRunLockHeartbeatContention.test.js
          npm test
      - name: Verify bob-code-consistency-review
        shell: bash
        run: |
          cd extensions/bob-code-consistency-review
          npm ci --silent
          npm run compile --silent
          node --test test/traceabilityCatalogStore.test.js
          npm test
      - name: Commit verified fixes
        shell: bash
        run: |
          rm .github/workflows/agent-fix-run-lock-contention.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: retry heartbeat lock contention safely"
          git push origin HEAD:agent/workflow-automatic-pause-limits-20260712
