name: p1-4-operation-hub-apply

on:
  pull_request:
    paths:
      - ".github/workflows/p1-4-operation-hub-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply held-recovery Operation Hub adapters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          model_path = Path("extensions/workflow-register/src/gui/operationHubModel.ts")
          model = model_path.read_text(encoding="utf-8")
          anchor = 'import type { CoreWorkflowDefinition, WorkflowRunState } from "../core/model"\n'
          line = 'import type { HeldRunRecoveryAssessment } from "../core/heldRunRecovery"\n'
          if line not in model:
              assert anchor in model
              model = model.replace(anchor, line + anchor, 1)
          model = model.replace('  "startFromArtifacts",\n', '  "startFromArtifacts",\n  "recoverDetachedHeldRun",\n  "importTaskSnapshotArtifacts",\n', 1)
          model = model.replace('  revision?: string\n}\n', '  revision?: string\n  heldRecovery?: HeldRunRecoveryAssessment\n}\n', 1)
          model = model.replace('  taskSnapshotImportStatus?: OperationHubStatus\n', '  taskSnapshotImportStatus?: OperationHubStatus\n  heldRecoveryKind?: HeldRunRecoveryAssessment["kind"]\n  heldRecoveryTitle?: string\n  heldRecoveryExplanation?: string\n  heldRecoveryBlockers: string[]\n', 1)
          old_map = '''      item.run,\n      input.focusedRunId,\n      item.revision,\n      input.focusedWorkspaceRoot\n'''
          new_map = '''      item.run,\n      input.focusedRunId,\n      item.revision,\n      input.focusedWorkspaceRoot,\n      item.heldRecovery\n'''
          assert old_map in model
          model = model.replace(old_map, new_map, 1)
          old_sig = '''  focusedRunId?: string,\n  revision?: string,\n  focusedWorkspaceRoot?: string\n): OperationHubRunSummary {\n'''
          new_sig = '''  focusedRunId?: string,\n  revision?: string,\n  focusedWorkspaceRoot?: string,\n  heldRecovery?: HeldRunRecoveryAssessment\n): OperationHubRunSummary {\n'''
          assert old_sig in model
          model = model.replace(old_sig, new_sig, 1)
          return_anchor = '''    taskSnapshotImportLabel: taskSnapshotImport?.label,\n    taskSnapshotImportStatus: taskSnapshotImport?.status,\n'''
          return_text = '''    taskSnapshotImportLabel: taskSnapshotImport?.label,\n    taskSnapshotImportStatus: taskSnapshotImport?.status,\n    heldRecoveryKind: heldRecovery?.kind,\n    heldRecoveryTitle: heldRecovery?.title,\n    heldRecoveryExplanation: heldRecovery?.explanation,\n    heldRecoveryBlockers: heldRecovery?.blockers.slice(0, 5) ?? [],\n'''
          assert return_anchor in model
          model = model.replace(return_anchor, return_text, 1)
          model = model.replace('    primaryActions: actionsForRun(root, run, Boolean(manifest?.artifacts.length), revision),\n', '    primaryActions: actionsForRun(root, run, Boolean(manifest?.artifacts.length), revision, heldRecovery),\n', 1)
          old_actions_sig = 'function actionsForRun(root: string, run: WorkflowRunState, hasReusableArtifacts: boolean, revision?: string): OperationHubAction[] {'
          new_actions_sig = 'function actionsForRun(root: string, run: WorkflowRunState, hasReusableArtifacts: boolean, revision?: string, heldRecovery?: HeldRunRecoveryAssessment): OperationHubAction[] {'
          assert old_actions_sig in model
          model = model.replace(old_actions_sig, new_actions_sig, 1)
          old_held = '''    case "held":\n      return withReuse([\n        { id: "openManualStepPanel", label: "手順を開く", commandId: "workflowRegister.openManualStepPanel", ...target, variant: "primary" },\n        { id: "runNextStep", label: "次へ", commandId: "workflowRegister.runNextStep", ...target },\n        inspect\n      ])\n'''
          new_held = '''    case "held":\n      return actionsForHeldRun(run, target, inspect, startFromArtifacts, heldRecovery)\n'''
          assert old_held in model
          model = model.replace(old_held, new_held, 1)
          helper_anchor = 'function artifactsForRun(root: string, run: WorkflowRunState, manifest?: WorkflowArtifactManifest): OperationHubArtifactSummary[] {\n'
          helper = '''function actionsForHeldRun(\n  run: WorkflowRunState,\n  target: { runId: string; workspaceRoot: string; expectedRevision?: string },\n  inspect: OperationHubAction,\n  startFromArtifacts: OperationHubAction | undefined,\n  heldRecovery: HeldRunRecoveryAssessment | undefined\n): OperationHubAction[] {\n  let primary: OperationHubAction\n  switch (heldRecovery?.primaryAction.id) {\n    case "open-manual-step":\n      primary = { id: "openManualStepPanel", label: "手動ステップを完了", commandId: "workflowRegister.openManualStepPanel", ...target, variant: "primary" }\n      break\n    case "resume-saved-state":\n      primary = { id: "recoverDetachedHeldRun", label: "保存済み状態から再開", commandId: "workflowRegister.recoverDetachedHeldRun", ...target, variant: "primary" }\n      break\n    case "review-artifacts":\n      primary = startFromArtifacts\n        ? { ...startFromArtifacts, label: "成果物を確認して途中再開", variant: "primary" }\n        : { ...inspect, label: "復旧診断を開く", variant: "primary" }\n      break\n    case "review-task-snapshot":\n      primary = { id: "importTaskSnapshotArtifacts", label: "Task Snapshotを確認", commandId: "workflowRegister.importArtifactsFromTaskSnapshots", ...target, variant: "primary" }\n      break\n    default:\n      primary = { ...inspect, label: "復旧診断を開く", variant: "primary" }\n      break\n  }\n  return primary.id === "inspectRunControl" ? [primary] : [primary, inspect]\n}\n\n'''
          assert helper_anchor in model
          model = model.replace(helper_anchor, helper + helper_anchor, 1)
          model_path.write_text(model, encoding="utf-8")

          provider_path = Path("extensions/workflow-register/src/gui/operationHubProvider.ts")
          provider = provider_path.read_text(encoding="utf-8")
          import_anchor = 'import type { CoreWorkflowDefinition, WorkflowRunState } from "../core/model"\n'
          imports = '''import { ARTIFACT_MANIFEST_STATE_KEY, parseWorkflowArtifactManifest } from "../core/artifacts"\nimport { classifyHeldRunRecovery } from "../core/heldRunRecovery"\nimport { FileTaskSnapshotStore } from "../core/taskSnapshots"\nimport { reviewTaskRegistry } from "../reviewTaskRegistry"\n'''
          if 'classifyHeldRunRecovery' not in provider:
              assert import_anchor in provider
              provider = provider.replace(import_anchor, imports + import_anchor, 1)
          provider = provider.replace('  startFromArtifacts: "workflowRegister.startFromStepWithArtifacts",\n', '  startFromArtifacts: "workflowRegister.startFromStepWithArtifacts",\n  recoverDetachedHeldRun: "workflowRegister.recoverDetachedHeldRun",\n  importTaskSnapshotArtifacts: "workflowRegister.importArtifactsFromTaskSnapshots",\n', 1)
          provider = provider.replace('  "openManualStepPanel",\n', '  "openManualStepPanel",\n  "recoverDetachedHeldRun",\n  "importTaskSnapshotArtifacts",\n', 1)
          provider = provider.replace('  "pauseCurrentRun"\n] as const\n', '  "pauseCurrentRun",\n  "recoverDetachedHeldRun"\n] as const\n', 1)
          old_load = '''    const runs = await Promise.all(roots.map(async (candidate) => {\n      const store = new FileRunStateStore({ workspaceRoot: candidate.root })\n      const runStates = await store.listRuns()\n      const snapshots = await Promise.all(runStates.map((run) => loadRunSnapshot(candidate.root, run.runId)))\n      return snapshots\n        .filter((snapshot): snapshot is NonNullable<typeof snapshot> => Boolean(snapshot))\n        .map((snapshot) => ({ root: candidate.root, run: snapshot.run, revision: snapshot.revision }))\n    }))\n    return buildOperationHubModel({\n'''
          new_load = '''    const workflows = this.options.api.listWorkflows()\n    const workflowsById = new Map(workflows.map((workflow) => [workflow.id, workflow]))\n    const runs = await Promise.all(roots.map(async (candidate) => {\n      const store = new FileRunStateStore({ workspaceRoot: candidate.root })\n      const taskSnapshotStore = new FileTaskSnapshotStore({ workspaceRoot: candidate.root })\n      const runStates = await store.listRuns()\n      const snapshots = await Promise.all(runStates.map((run) => loadRunSnapshot(candidate.root, run.runId)))\n      return Promise.all(snapshots\n        .filter((snapshot): snapshot is NonNullable<typeof snapshot> => Boolean(snapshot))\n        .map(async (snapshot) => {\n          const run = snapshot.run\n          const workflow = workflowsById.get(run.workflowId)\n          const taskSnapshots = run.status === "held"\n            ? await taskSnapshotStore.listSnapshots(run.runId).catch(() => [])\n            : []\n          const heldRecovery = classifyHeldRunRecovery({\n            run,\n            workflow,\n            liveTaskAvailable: Boolean(reviewTaskRegistry.taskForRun(candidate.root, run.runId)),\n            activeManualStepAvailable: Boolean(reviewTaskRegistry.taskForStep(candidate.root, run.runId, run.currentStep)),\n            artifactManifestAvailable: Boolean(parseWorkflowArtifactManifest(run.state[ARTIFACT_MANIFEST_STATE_KEY])),\n            taskSnapshotAvailable: taskSnapshots.some((item) => item.stepId === run.currentStep)\n          })\n          return { root: candidate.root, run, revision: snapshot.revision, heldRecovery }\n        }))\n    }))\n    return buildOperationHubModel({\n'''
          assert old_load in provider
          provider = provider.replace(old_load, new_load, 1)
          provider = provider.replace('      workflows: this.options.api.listWorkflows(),\n', '      workflows,\n', 1)
          provider_path.write_text(provider, encoding="utf-8")

          html_path = Path("extensions/workflow-register/src/gui/operationHubHtml.ts")
          html = html_path.read_text(encoding="utf-8")
          style_anchor = '    .artifact { display: flex; justify-content: space-between; align-items: center; gap: 6px; border-top: 1px solid var(--vscode-panel-border); padding-top: 6px; margin-top: 6px; }\n'
          style_line = '    .held-recovery { margin-top: 8px; padding: 8px; border-left: 3px solid var(--vscode-editorWarning-foreground); background: var(--vscode-textBlockQuote-background); }\n'
          if style_line not in html:
              assert style_anchor in html
              html = html.replace(style_anchor, style_anchor + style_line, 1)
          render_anchor = '    ${renderStepProvenanceList(run)}\n    <div class="actions">${run.primaryActions.map(renderActionButton).join("")}</div>\n'
          render_text = '    ${renderStepProvenanceList(run)}\n    ${renderHeldRecovery(run)}\n    <div class="actions">${run.primaryActions.map(renderActionButton).join("")}</div>\n'
          assert render_anchor in html
          html = html.replace(render_anchor, render_text, 1)
          helper_anchor = 'function renderStepProvenanceList(run: OperationHubRunSummary): string {\n'
          helper = '''function renderHeldRecovery(run: OperationHubRunSummary): string {\n  if (run.status !== "held" || !run.heldRecoveryKind) return ""\n  const blockers = run.heldRecoveryBlockers.length > 0\n    ? `<ul>${run.heldRecoveryBlockers.map((blocker) => `<li>${escapeHtml(blocker)}</li>`).join("")}</ul>`\n    : ""\n  return `<div class="held-recovery">\n    <strong>${escapeHtml(run.heldRecoveryTitle ?? "Held run recovery")}</strong>\n    <div class="muted">${escapeHtml(run.heldRecoveryExplanation ?? "")}</div>\n    ${blockers}\n  </div>`\n}\n\n'''
          if 'function renderHeldRecovery' not in html:
              assert helper_anchor in html
              html = html.replace(helper_anchor, helper + helper_anchor, 1)
          html_path.write_text(html, encoding="utf-8")
          PY

      - name: Verify focused contracts
        working-directory: extensions/workflow-register
        run: |
          npm ci --silent
          npm run compile --silent
          node --test \
            test/heldRunRecoveryClassifier.test.js \
            test/operationHubHeldRecovery.test.js \
            test/operationHubArtifactReuse.test.js \
            test/operationHubStepProvenance.test.js \
            test/operationHubTodoSync.test.js \
            test/operationHub.test.js \
            test/operationHubMutations.test.js

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/p1-4-operation-hub-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: surface detached held recovery actions"
          git push origin HEAD:${{ github.head_ref }}
