name: task-snapshot-final-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/task-snapshot-final-diagnostic.yml"
      - "extensions/workflow-register/src/taskSnapshotImportReport.ts"
      - "extensions/workflow-register/src/workflowRunCommands.ts"
      - "extensions/workflow-register/test/taskSnapshotImportReport.test.js"
      - "extensions/workflow-register/test/workflowTaskSnapshotImportCommand.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/workflow-register
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - run: npm ci
      - name: Capture focused output
        shell: bash
        run: |
          set +e
          npm run compile > final-diagnostic.txt 2>&1
          compile_status=$?
          node --test test/taskSnapshotImportReport.test.js test/workflowTaskSnapshotImportCommand.test.js >> final-diagnostic.txt 2>&1
          test_status=$?
          printf '\ncompile_status=%s\ntest_status=%s\n' "$compile_status" "$test_status" >> final-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-snapshot-final-diagnostic
          path: extensions/workflow-register/final-diagnostic.txt
          retention-days: 1
