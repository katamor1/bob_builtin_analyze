name: Fix phase 4 Windows CRLF test setup

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        working-directory: extensions/bob-code-consistency-review
        run: npm ci

      - name: Apply platform-neutral fixture update
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('extensions/bob-code-consistency-review/test/repositorySymbolIndex.test.js')
          text = path.read_text(encoding='utf-8')
          old = '''  const originalInput = fs.readFileSync(inputPath, "utf8")
          assert.match(originalInput, /analysis_options:\\s*\\n/)
          fs.writeFileSync(
            inputPath,
            originalInput.replace("analysis_options:\\n", `analysis_options:\\n  repository_symbol_index_path: ${relativePath}\\n`),
            "utf8"
          )
          '''
          new = '''  const originalInput = fs.readFileSync(inputPath, "utf8")
          const newline = originalInput.includes("\\r\\n") ? "\\r\\n" : "\\n"
          assert.match(originalInput, /analysis_options:\\r?\\n/)
          fs.writeFileSync(
            inputPath,
            originalInput.replace(
              /analysis_options:\\r?\\n/,
              `analysis_options:${newline}  repository_symbol_index_path: ${relativePath}${newline}`
            ),
            "utf8"
          )
          '''
          if old not in text:
              raise SystemExit('expected CRLF-sensitive test block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Reproduce Windows line endings and verify focused tests
        working-directory: extensions/bob-code-consistency-review
        shell: bash
        run: |
          set -euo pipefail
          fixture='../../docs/workflows/code-consistency-review/examples/multi-language-git-review/fixtures/workspace-common/review-input.yaml'
          cp "$fixture" "$RUNNER_TEMP/review-input.yaml.bak"
          cleanup() { cp "$RUNNER_TEMP/review-input.yaml.bak" "$fixture"; }
          trap cleanup EXIT
          python - <<'PY'
          from pathlib import Path
          path = Path('../../docs/workflows/code-consistency-review/examples/multi-language-git-review/fixtures/workspace-common/review-input.yaml')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
          path.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
          PY
          npm run compile
          node --test test/repositorySymbolIndex.test.js

      - name: Verify full suite and package gates
        working-directory: extensions/bob-code-consistency-review
        run: |
          npm test
          npm run dependency:policy
          npm run architecture:policy
          npm run source:policy
          npm run unused:report
          npm run audit:prod
          npm run package
          npm run package:policy

      - name: Remove diagnostics and commit fix
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-phase4-windows-crlf.yml
          rm -f .github/workflows/phase4-windows-diagnostic.yml
          rm -rf docs/implementation/diagnostics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: make repository index fixture CRLF-safe'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
