name: phase4-windows-fixture-fix

on:
  pull_request:
    paths:
      - ".github/workflows/phase4-windows-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-windows-fixture-fix:
    name: Apply and verify native Windows canonical roots
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR 77 branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-reproducible-runtime-phase4-hardening-20260712
          fetch-depth: 0

      - name: Verify coordinated head
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "d9c1f23615c1b1f05dc793efc1b83e43eabd1ff0") {
            throw "unexpected Phase 4 head"
          }

      - name: Use the native canonicalizer proven by the Windows probe
        shell: pwsh
        run: |
          @'
          const fs = require("node:fs")
          const files = [
            "extensions/workflow-register/test/bobGateLifecycle.test.js",
            "extensions/workflow-register/test/helpers/workflowEngineFixtures.js",
            "extensions/workflow-register/test/operationHubMutations.test.js",
            "extensions/workflow-register/test/workflowArtifactManifest.test.js",
            "extensions/workflow-register/test/workflowPlatformP0E2e.test.js",
            "extensions/workflow-register/test/workflowRunRecovery.test.js",
            "extensions/workflow-register/test/workflowRunStateMigrationPath.test.js",
            "extensions/workflow-register/test/workflowTaskSnapshotArtifactImport.test.js",
            "extensions/workflow-register/test/workspaceFileTransaction.test.js"
          ]
          for (const file of files) {
            const source = fs.readFileSync(file, "utf8")
            const updated = source.replaceAll("fs.realpathSync(", "fs.realpathSync.native(")
            if (updated.includes("fs.realpathSync(") || !updated.includes("fs.realpathSync.native(")) {
              throw new Error(`${file}: canonicalizer replacement did not converge`)
            }
            fs.writeFileSync(file, updated, "utf8")
          }
          '@ | Set-Content -Path apply-windows-fixture-fix.cjs -Encoding utf8
          node apply-windows-fixture-fix.cjs
          Remove-Item apply-windows-fixture-fix.cjs

          $allowed = @(
            "extensions/workflow-register/test/bobGateLifecycle.test.js",
            "extensions/workflow-register/test/helpers/workflowEngineFixtures.js",
            "extensions/workflow-register/test/operationHubMutations.test.js",
            "extensions/workflow-register/test/workflowArtifactManifest.test.js",
            "extensions/workflow-register/test/workflowPlatformP0E2e.test.js",
            "extensions/workflow-register/test/workflowRunRecovery.test.js",
            "extensions/workflow-register/test/workflowRunStateMigrationPath.test.js",
            "extensions/workflow-register/test/workflowTaskSnapshotArtifactImport.test.js",
            "extensions/workflow-register/test/workspaceFileTransaction.test.js"
          )
          $unexpected = @(git diff --name-only) | Where-Object { $_ -notin $allowed }
          if ($unexpected.Count -gt 0) { throw "unexpected changed paths: $unexpected" }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json

      - name: Install dependencies
        working-directory: extensions/workflow-register
        run: npm ci

      - name: Verify full workflow-register suite on Windows
        working-directory: extensions/workflow-register
        run: npm test

      - name: Commit and push verified fixture fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add `
            extensions/workflow-register/test/bobGateLifecycle.test.js `
            extensions/workflow-register/test/helpers/workflowEngineFixtures.js `
            extensions/workflow-register/test/operationHubMutations.test.js `
            extensions/workflow-register/test/workflowArtifactManifest.test.js `
            extensions/workflow-register/test/workflowPlatformP0E2e.test.js `
            extensions/workflow-register/test/workflowRunRecovery.test.js `
            extensions/workflow-register/test/workflowRunStateMigrationPath.test.js `
            extensions/workflow-register/test/workflowTaskSnapshotArtifactImport.test.js `
            extensions/workflow-register/test/workspaceFileTransaction.test.js
          git diff --cached --check
          git commit -m "test: use native Windows workspace identities"
          git push origin HEAD:agent/workflow-reproducible-runtime-phase4-hardening-20260712
