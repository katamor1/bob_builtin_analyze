name: phase4-windows-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/phase4-windows-diagnostic.yml"

permissions:
  contents: read

jobs:
  source-bundle:
    name: Source bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Upload selected sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase4-windows-source-bundle
          retention-days: 1
          path: |
            extensions/workflow-register/src/core/runtime/runLock.ts
            extensions/workflow-register/test/helpers/workflowEngineFixtures.js
            extensions/workflow-register/test/bobGateLifecycle.test.js
            extensions/workflow-register/test/operationHubMutations.test.js
            extensions/workflow-register/test/processWorkflowEngineArtifacts.test.js
            extensions/workflow-register/test/runStateStorePathBoundary.test.js
            extensions/workflow-register/test/workflowArtifactManifest.test.js
            extensions/workflow-register/test/workflowPlatformP0E2e.test.js
            extensions/workflow-register/test/workflowRunLock.test.js
            extensions/workflow-register/test/workflowRunRecovery.test.js
            extensions/workflow-register/test/workflowRunStateMigrationPath.test.js
            extensions/workflow-register/test/workflowTaskSnapshotArtifactImport.test.js
            extensions/workflow-register/test/workspaceFileTransaction.test.js
            extensions/bob-code-consistency-review/test/traceabilityCatalogStore.test.js

  windows-diagnostic:
    name: Windows diagnostic / ${{ matrix.extension }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extension:
          - workflow-register
          - bob-code-consistency-review

    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/${{ matrix.extension }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests and extract failures
        shell: pwsh
        run: |
          & npm.cmd test *> test-output.txt
          $exitCode = $LASTEXITCODE
          $lines = @(Get-Content test-output.txt)
          $selected = [System.Collections.Generic.List[string]]::new()
          $failureCount = 0
          for ($index = 0; $index -lt $lines.Count; $index += 1) {
            if ($lines[$index] -match '^not ok ') {
              $failureCount += 1
              if ($failureCount -le 20) {
                $start = [Math]::Max(0, $index - 1)
                $end = [Math]::Min($lines.Count - 1, $index + 24)
                for ($cursor = $start; $cursor -le $end; $cursor += 1) {
                  $selected.Add($lines[$cursor])
                }
                $selected.Add('---')
              }
            }
          }
          $summary = @($lines | Where-Object { $_ -match '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms)' })
          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add('extension=${{ matrix.extension }}')
          $report.Add("exit_code=$exitCode")
          $report.Add("failure_count=$failureCount")
          $report.Add('')
          $report.Add('FAILURES')
          if ($selected.Count -eq 0) {
            $report.Add('(none)')
          } else {
            foreach ($line in $selected) { $report.Add($line) }
          }
          $report.Add('')
          $report.Add('SUMMARY')
          foreach ($line in $summary) { $report.Add($line) }
          $report | Set-Content -Path diagnostic.txt -Encoding utf8
          exit 0

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase4-windows-${{ matrix.extension }}
          path: extensions/${{ matrix.extension }}/diagnostic.txt
          if-no-files-found: error
          retention-days: 1
