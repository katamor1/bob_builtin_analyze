name: phase4-windows-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/phase4-windows-diagnostic.yml"

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  windows-diagnostic:
    name: Windows diagnostic / ${{ matrix.extension }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extension:
          - workflow-register
          - bob-code-consistency-review

    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/${{ matrix.extension }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests and extract failures
        shell: pwsh
        run: |
          & npm.cmd test *> test-output.txt
          $exitCode = $LASTEXITCODE
          $lines = @(Get-Content test-output.txt)
          $selected = [System.Collections.Generic.List[string]]::new()
          $failureCount = 0
          for ($index = 0; $index -lt $lines.Count; $index += 1) {
            if ($lines[$index] -match '^not ok ') {
              $failureCount += 1
              if ($failureCount -le 20) {
                $start = [Math]::Max(0, $index - 1)
                $end = [Math]::Min($lines.Count - 1, $index + 24)
                for ($cursor = $start; $cursor -le $end; $cursor += 1) {
                  $selected.Add($lines[$cursor])
                }
                $selected.Add('---')
              }
            }
          }
          $summary = @($lines | Where-Object { $_ -match '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms)' })
          $report = [System.Collections.Generic.List[string]]::new()
          $report.Add('extension=${{ matrix.extension }}')
          $report.Add("exit_code=$exitCode")
          $report.Add("failure_count=$failureCount")
          $report.Add('')
          $report.Add('FAILURES')
          if ($selected.Count -eq 0) {
            $report.Add('(none)')
          } else {
            foreach ($line in $selected) { $report.Add($line) }
          }
          $report.Add('')
          $report.Add('SUMMARY')
          foreach ($line in $summary) { $report.Add($line) }
          $report | Set-Content -Path diagnostic.txt -Encoding utf8
          exit 0

      - name: Publish diagnostic comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require("node:fs");
            const extension = "${{ matrix.extension }}";
            const marker = `<!-- phase4-windows-diagnostic:${extension} -->`;
            const path = `extensions/${extension}/diagnostic.txt`;
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, "utf8").slice(0, 60000)
              : "diagnostic.txt was not produced";
            const body = `${marker}\n## Windows diagnostic: ${extension}\n\n\`\`\`text\n${report}\n\`\`\``;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }
