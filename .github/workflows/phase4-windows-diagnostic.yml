name: Phase 4 Windows diagnostic

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        working-directory: extensions/bob-code-consistency-review
        run: npm ci

      - name: Compile
        working-directory: extensions/bob-code-consistency-review
        run: npm run compile

      - name: Capture focused Phase 4 tests
        working-directory: extensions/bob-code-consistency-review
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          node --test test/repositorySymbolIndex.test.js *> "$env:RUNNER_TEMP\phase4-focused.log"
          $LASTEXITCODE | Out-File -Encoding ascii "$env:RUNNER_TEMP\phase4-focused.exit-code"
          exit 0

      - name: Capture full tests
        working-directory: extensions/bob-code-consistency-review
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          node --test test/*.test.js *> "$env:RUNNER_TEMP\phase4-full.log"
          $LASTEXITCODE | Out-File -Encoding ascii "$env:RUNNER_TEMP\phase4-full.exit-code"
          exit 0

      - name: Commit diagnostic logs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'docs/implementation/diagnostics'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$env:RUNNER_TEMP\phase4-focused.log" "$target\phase4-windows-focused.log"
          Copy-Item "$env:RUNNER_TEMP\phase4-focused.exit-code" "$target\phase4-windows-focused.exit-code"
          Copy-Item "$env:RUNNER_TEMP\phase4-full.log" "$target\phase4-windows-full.log"
          Copy-Item "$env:RUNNER_TEMP\phase4-full.exit-code" "$target\phase4-windows-full.exit-code"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/implementation/diagnostics
          git commit -m 'ci: record phase 4 Windows diagnostics'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
