name: Phase 4 Windows diagnostic

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        working-directory: extensions/bob-code-consistency-review
        run: npm ci

      - name: Compile
        working-directory: extensions/bob-code-consistency-review
        run: npm run compile

      - name: Capture focused Phase 4 tests
        working-directory: extensions/bob-code-consistency-review
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          node --test test/repositorySymbolIndex.test.js *> "$env:RUNNER_TEMP\phase4-focused.log"
          $LASTEXITCODE | Out-File -Encoding ascii "$env:RUNNER_TEMP\phase4-focused.exit-code"
          exit 0

      - name: Capture full tests
        working-directory: extensions/bob-code-consistency-review
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          node --test test/*.test.js *> "$env:RUNNER_TEMP\phase4-full.log"
          $LASTEXITCODE | Out-File -Encoding ascii "$env:RUNNER_TEMP\phase4-full.exit-code"
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase4-windows-diagnostic
          path: |
            ${{ runner.temp }}\phase4-focused.log
            ${{ runner.temp }}\phase4-focused.exit-code
            ${{ runner.temp }}\phase4-full.log
            ${{ runner.temp }}\phase4-full.exit-code
          if-no-files-found: error
          retention-days: 1
