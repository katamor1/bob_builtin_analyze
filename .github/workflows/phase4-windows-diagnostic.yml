name: phase4-windows-path-probe

on:
  pull_request:
    paths:
      - ".github/workflows/phase4-windows-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  path-probe:
    name: Probe Windows path canonicalizers
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Probe path APIs
        shell: pwsh
        run: |
          @'
          const fs = require("node:fs")
          const fsp = require("node:fs/promises")
          const os = require("node:os")
          const path = require("node:path")
          const cp = require("node:child_process")
          const util = require("node:util")

          ;(async () => {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), "phase4-path-probe-"))
            const results = { platform: process.platform, node: process.version, tmpdir: os.tmpdir(), root }
            const syncProbe = (name, operation) => {
              try { results[name] = operation() } catch (error) { results[`${name}Error`] = String(error?.stack ?? error) }
            }
            const asyncProbe = async (name, operation) => {
              try { results[name] = await operation() } catch (error) { results[`${name}Error`] = String(error?.stack ?? error) }
            }
            syncProbe("pathResolve", () => path.resolve(root))
            syncProbe("realpathSync", () => fs.realpathSync(root))
            syncProbe("realpathSyncNative", () => fs.realpathSync.native(root))
            syncProbe("realpathSyncNamespaced", () => fs.realpathSync(path.toNamespacedPath(root)))
            syncProbe("realpathSyncNativeNamespaced", () => fs.realpathSync.native(path.toNamespacedPath(root)))
            await asyncProbe("promisesRealpath", () => fsp.realpath(root))
            await asyncProbe("callbackRealpath", () => util.promisify(fs.realpath)(root))
            if (typeof fs.realpath.native === "function") {
              await asyncProbe("callbackRealpathNative", () => util.promisify(fs.realpath.native)(root))
            } else {
              results.callbackRealpathNativeError = "fs.realpath.native is unavailable"
            }
            syncProbe("cmdFull", () => cp.execFileSync(process.env.ComSpec, ["/d", "/s", "/c", `for %I in ("${root}") do @echo %~fI`], { encoding: "utf8" }).trim())
            syncProbe("powershellFullName", () => cp.execFileSync("powershell.exe", ["-NoProfile", "-Command", `(Get-Item -LiteralPath '${root.replaceAll("'", "''")}').FullName`], { encoding: "utf8" }).trim())
            syncProbe("powershellResolvePath", () => cp.execFileSync("powershell.exe", ["-NoProfile", "-Command", `(Resolve-Path -LiteralPath '${root.replaceAll("'", "''")}').ProviderPath`], { encoding: "utf8" }).trim())
            fs.writeFileSync("path-probe.json", `${JSON.stringify(results, null, 2)}\n`, "utf8")
            console.log(JSON.stringify(results, null, 2))
          })().catch((error) => {
            fs.writeFileSync("path-probe.json", `${JSON.stringify({ fatal: String(error?.stack ?? error) }, null, 2)}\n`, "utf8")
            console.error(error)
          })
          '@ | Set-Content -Path path-probe.cjs -Encoding utf8
          node path-probe.cjs
          exit 0

      - name: Upload path probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase4-windows-path-probe
          path: path-probe.json
          if-no-files-found: error
          retention-days: 1
