name: phase4-windows-diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/phase4-windows-diagnostic.yml"

permissions:
  contents: read

jobs:
  focused-lock-diagnostic:
    name: Focused workflow lock diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Phase 4 branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-reproducible-runtime-phase4-hardening-20260712

      - name: Verify implementation head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "9deb80c9f500bc4906177a6903264042115c622a"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json

      - name: Install dependencies
        working-directory: extensions/workflow-register
        run: npm ci

      - name: Compile
        working-directory: extensions/workflow-register
        run: npm run compile

      - name: Run focused lock test and capture output
        shell: bash
        working-directory: extensions/workflow-register
        run: |
          set +e
          node --test test/workflowRunLock.test.js > focused-lock-output.txt 2>&1
          status=$?
          set -e
          printf 'exit_code=%s\n' "$status" > focused-lock-diagnostic.txt
          cat focused-lock-output.txt >> focused-lock-diagnostic.txt
          cat focused-lock-diagnostic.txt
          exit 0

      - name: Upload focused diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focused-workflow-lock-diagnostic
          path: extensions/workflow-register/focused-lock-diagnostic.txt
          retention-days: 1
