name: agent-export-branch

on:
  pull_request:
    paths:
      - ".github/workflows/agent-export-branch.yml"
  push:
    branches:
      - agent/bob-review-document-input-fixtures-design
    paths:
      - ".github/workflows/agent-export-branch.yml"
  workflow_dispatch:

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Archive source tree
        shell: bash
        run: tar --exclude=.git -czf branch-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bob-review-document-input-fixtures-source
          path: branch-source.tar.gz
          if-no-files-found: error
          retention-days: 1
