name: triage-integrity-windows-diagnostic

on:
  pull_request:
    paths:
      - "extensions/bob-code-consistency-review/**"
      - ".github/workflows/triage-integrity-windows-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: triage-integrity-windows-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    name: Windows traceability identity fix verification
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Apply Windows-safe traceability test identity checks
        shell: pwsh
        run: |
          @'
          const fs = require("node:fs")
          const path = require("node:path")
          const filePath = path.join(process.cwd(), "test", "traceabilityCatalogStore.test.js")
          let text = fs.readFileSync(filePath, "utf8").replace(/\r\n/g, "\n")
          const directoryLine = '  const expectedDirectory = normalizePhysicalPath(path.dirname(targetPath))\n'
          const conditionLine = '      normalizePhysicalPath(path.dirname(candidate)) === expectedDirectory &&\n'
          const lexicalAssertion = '  assert.equal(path.dirname(aliasWinner.backupPath), path.dirname(directPath))\n'
          const physicalAssertion = '  assert.equal(normalizePhysicalPath(await fs.realpath(path.dirname(aliasWinner.backupPath))), normalizePhysicalPath(await fs.realpath(path.dirname(directPath))))\n'
          if (text.includes(directoryLine)) text = text.replace(directoryLine, "")
          if (text.includes(conditionLine)) text = text.replace(conditionLine, "")
          if (text.includes(lexicalAssertion)) text = text.replace(lexicalAssertion, physicalAssertion)
          if (text.includes("expectedDirectory")) throw new Error("expectedDirectory remains after patch")
          if (!text.includes(physicalAssertion.trim())) throw new Error("physical backup assertion was not installed")
          fs.writeFileSync(filePath, text)
          '@ | node

      - name: Run traceability CAS suite
        run: node --test test/traceabilityCatalogStore.test.js

      - name: Commit verified Windows traceability test fix
        working-directory: .
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/bob-code-consistency-review/test/traceabilityCatalogStore.test.js
          if (git diff --cached --quiet) {
            Write-Host "Windows traceability test fix is already committed."
            exit 0
          }
          git commit -m "test: compare traceability paths by physical identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
