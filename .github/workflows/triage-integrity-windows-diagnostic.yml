name: triage-integrity-windows-diagnostic

on:
  pull_request:
    paths:
      - "extensions/bob-code-consistency-review/**"
      - ".github/workflows/triage-integrity-windows-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: triage-integrity-windows-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Windows triage unit diagnostic
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Probe Windows fs.open paths and bindings
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "traceability-open-probe.cjs"
          $probeLog = Join-Path $env:RUNNER_TEMP "traceability-open-probe.log"
          @'
          const fs = require("node:fs/promises")
          const os = require("node:os")
          const path = require("node:path")
          const store = require(path.join(process.cwd(), "out", "core", "traceabilityCatalogStore"))
          console.log("open descriptor", Object.getOwnPropertyDescriptor(fs, "open"))
          const originalOpen = fs.open
          fs.open = async (...args) => {
            console.log("OPEN_ARG", typeof args[0], JSON.stringify(String(args[0])))
            return Reflect.apply(originalOpen, fs, args)
          }
          console.log("open patched", fs.open === originalOpen)
          ;(async () => {
            const workspaceRoot = await fs.mkdtemp(path.join(os.tmpdir(), "bob-trace-open-probe-"))
            console.log("workspaceRoot", JSON.stringify(workspaceRoot))
            console.log("workspaceRealpath", JSON.stringify(await fs.realpath(workspaceRoot)))
            await store.writeTraceabilityCatalog({
              workspaceRoot,
              catalog: { schema_version: 1, documents: [], domains: [], items: [], links: [], decisions: [] }
            })
            const result = await store.validateAndWriteTraceabilityGateReport({ workspaceRoot })
            console.log("report result", result.status, JSON.stringify(result.reportPath))
          })().catch((error) => {
            console.error(error)
            process.exitCode = 1
          })
          '@ | Set-Content -Path $probe -Encoding utf8
          node $probe *> $probeLog
          Get-Content $probeLog

      - name: Run traceability CAS suite and capture TAP
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "traceability-cas-windows.log"
          & node --test test/traceabilityCatalogStore.test.js *> $log
          $status = $LASTEXITCODE
          Write-Host "Traceability CAS test exit code: $status"
          Get-Content $log -Tail 320
          exit $status

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: traceability-windows-diagnostic-logs
          path: |
            ${{ runner.temp }}/traceability-open-probe.log
            ${{ runner.temp }}/traceability-cas-windows.log
          if-no-files-found: error
          retention-days: 3
