name: triage-integrity-windows-diagnostic

on:
  pull_request:
    paths:
      - "extensions/bob-code-consistency-review/**"
      - ".github/workflows/triage-integrity-windows-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: triage-integrity-windows-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    name: Windows traceability path fix verification
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Apply physical path normalization to CAS test barrier
        shell: pwsh
        run: |
          @'
          const fs = require("node:fs")
          const path = require("node:path")
          const filePath = path.join(process.cwd(), "test", "traceabilityCatalogStore.test.js")
          let text = fs.readFileSync(filePath, "utf8").replace(/\r\n/g, "\n")
          if (!text.includes('const fsSync = require("node:fs")')) {
            text = text.replace(
              'const assert = require("node:assert/strict")\n',
              'const assert = require("node:assert/strict")\nconst fsSync = require("node:fs")\n'
            )
          }
          const before = [
            'function normalizePhysicalPath(value) {',
            '  const resolved = path.resolve(value)',
            '  return process.platform === "win32" ? resolved.toLowerCase() : resolved',
            '}'
          ].join('\n')
          const after = [
            'function normalizePhysicalPath(value) {',
            '  const resolved = path.resolve(value)',
            '  let physicalPath = resolved',
            '  try {',
            '    physicalPath = fsSync.realpathSync.native(resolved)',
            '  } catch {',
            '    // Not-yet-created candidates fall back to their lexical path.',
            '  }',
            '  return process.platform === "win32" ? physicalPath.toLowerCase() : physicalPath',
            '}'
          ].join('\n')
          if (text.includes(before)) text = text.replace(before, after)
          else if (!text.includes('fsSync.realpathSync.native(resolved)')) {
            throw new Error("normalizePhysicalPath source did not match the expected contract")
          }
          fs.writeFileSync(filePath, text)
          '@ | node

      - name: Run traceability CAS suite
        run: node --test test/traceabilityCatalogStore.test.js

      - name: Commit verified Windows path fix
        working-directory: .
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/bob-code-consistency-review/test/traceabilityCatalogStore.test.js
          if (git diff --cached --quiet) {
            Write-Host "Windows path normalization is already committed."
            exit 0
          }
          git commit -m "test: canonicalize Windows traceability paths"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
