name: triage-integrity-finalization

on:
  pull_request:
    paths:
      - "extensions/bob-code-consistency-review/**"
      - ".github/workflows/triage-integrity-windows-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: triage-integrity-finalization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    name: Windows full verification and documentation sync
    runs-on: windows-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency policy
        run: npm run dependency:policy

      - name: Architecture policy
        run: npm run architecture:policy

      - name: Source policy
        run: npm run source:policy

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: VSIX policy
        run: npm run package:policy

      - name: Synchronize Phase 1 documentation and plan
        working-directory: .
        shell: pwsh
        run: |
          @'
          const fs = require("node:fs")
          const path = require("node:path")

          function appendSection(filePath, marker, lines) {
            let text = fs.readFileSync(filePath, "utf8").replace(/\r\n/g, "\n").trimEnd()
            if (!text.includes(marker)) text += `\n\n${lines.join("\n")}\n`
            fs.writeFileSync(filePath, text, "utf8")
          }

          appendSection(
            "extensions/bob-code-consistency-review/README.md",
            "<!-- TRIAGE-INTEGRITY-2026-07-12 -->",
            [
              "<!-- TRIAGE-INTEGRITY-2026-07-12 -->",
              "## Human Triage Integrity",
              "",
              "Human Triage は、Bob 出力由来の情報と人間の判断を別の正本として保存します。GUI は Bob finding / question の本文を更新せず、`source_id` に紐づく判断だけを保存します。",
              "",
              "```text",
              ".bob-review/human-triage/",
              "  triage-source.yaml",
              "  triage-decisions.yaml",
              "  triage-result.yaml",
              "  accepted-findings.md",
              "  rejected-findings.md",
              "  investigation-items.md",
              "  questions-to-author.md",
              "  follow-up-actions.md",
              "  migration-report.md",
              "```",
              "",
              "| ファイル | 役割 |",
              "| --- | --- |",
              "| `triage-source.yaml` | `triage-source/v1`。Bob output から生成する immutable snapshot。 |",
              "| `triage-decisions.yaml` | `triage-decisions/v1`。人間が編集する decision、severity、owner、reason、comment、follow-up を `source_id` key で保持する。 |",
              "| `triage-result.yaml` | 従来利用との互換用 projection。正本ではない。 |",
              "| 各 Markdown | source と decisions から毎回再生成する閲覧・引き継ぎ用 projection。手編集を判断の正本にしない。 |",
              "| `migration-report.md` | legacy migration、削除された source ID、rebase warning を記録する。 |",
              "",
              "保存時は `source_sha256` と `decision_revision` を確認します。別画面や再生成によってsourceまたはdecisionが変わった場合は `TRIAGE_SOURCE_CHANGED` または `TRIAGE_REVISION_CONFLICT` となるため、画面を再読込して判断をやり直してください。",
              "",
              "旧 `triage-result.yaml` だけが存在するworkspaceでは、初回生成時に一致する `source_id` の判断を `triage-decisions.yaml` へ移行します。旧ファイルはbackupされ、一致しないIDは推測で移さず `migration-report.md` に残します。"
            ]
          )

          appendSection(
            "extensions/bob-code-consistency-review/docs/detailed-design-ja.md",
            "<!-- TRIAGE-INTEGRITY-2026-07-12 -->",
            [
              "<!-- TRIAGE-INTEGRITY-2026-07-12 -->",
              "## 2026-07-12 Human Triage Integrity 詳細設計",
              "",
              "### データ境界",
              "",
              "```text",
              "Bob output",
              "  -> TriageSourceBuilder",
              "  -> triage-source.yaml        immutable / triage-source/v1",
              "  -> TriageDecisionStore",
              "  -> triage-decisions.yaml     human-editable / triage-decisions/v1",
              "  -> TriageProjectionBuilder",
              "  -> triage-result.yaml + Markdown projections",
              "```",
              "",
              "`triage-source.yaml` は Bob output の exact text hash、review ID、package ID、finding / question の全source contextを保持する。Webview messageからsource payloadを受け取らない。`triage-decisions.yaml` は `source_id` keyのmapで、人間が編集できるfieldと同schema内の未知fieldだけを保持する。",
              "",
              "### 競合制御",
              "",
              "- GUI load時にsource fileのSHA-256と`decision_revision`を取得する。",
              "- save時にdisk上の値と一致しなければ、source変更は`TRIAGE_SOURCE_CHANGED`、decision競合は`TRIAGE_REVISION_CONFLICT`で拒否する。",
              "- array positionをidentityとして使用しない。posted `source_id` の重複と未知IDを拒否する。",
              "- successful saveごとに`decision_revision`を1だけ増加する。",
              "",
              "### Decision validation",
              "",
              "| decision | 必須field |",
              "| --- | --- |",
              "| `accepted` | reason、owner、final severity |",
              "| `rejected` | reason |",
              "| `needs_investigation` | reason、およびownerまたはfollow-up action |",
              "| `deferred` | reason、follow-up due |",
              "| `question` | reason、およびownerまたはsuggested recipient |",
              "",
              "### File transaction",
              "",
              "全成果物を同一directory内のstaging directoryへ書き、YAML parseを完了してから既存fileをunique backupへrenameする。すべてのstaged fileをinstallできた場合だけ成功とする。途中失敗時は新規targetを削除し、backup setを元のfile名へ戻す。Markdownは常にsourceとdecisionsから再生成し、手編集内容を再入力として扱わない。",
              "",
              "### Legacy migration",
              "",
              "`triage-decisions.yaml`がなくlegacy `triage-result.yaml`がある場合だけ一回migrationする。現在のsourceに存在するIDのdecision fieldだけを移し、`triaged_by`と`triaged_at`を保持する。不一致IDは`migration-report.md`へ記録し、source本文や判断を補完しない。",
              "",
              "### GUI trust boundary",
              "",
              "Webviewから受理するのはaction whitelist、lock token、`source_id`、decision fieldだけである。summary、category、original severity、confidence、evidence、Bob reason等はdisk上の`triage-source.yaml`を正とする。CSP nonce、HTML escape、inline `onclick`禁止を維持する。"
            ]
          )

          appendSection(
            "extensions/bob-code-consistency-review/docs/unit-test-spec-ja.md",
            "<!-- TRIAGE-INTEGRITY-2026-07-12 -->",
            [
              "<!-- TRIAGE-INTEGRITY-2026-07-12 -->",
              "## 2026-07-12 Human Triage Integrity 単体テスト契約",
              "",
              "| ID | 観点 | 期待結果 | 実テスト |",
              "| --- | --- | --- | --- |",
              "| CCR-UT-055 | source snapshot | `triage-source/v1`がBob outputのfinding / question contextとexact hashを保持し、重複IDを拒否する。 | `test/humanTriageIntegrity.test.js` |",
              "| CCR-UT-056 | keyed decisions | posted順序に依存せず`source_id`へdecisionが紐づく。 | `test/humanTriageIntegrity.test.js` |",
              "| CCR-UT-057 | field preservation | disk上の未知top-level fieldとnested follow-up fieldを保持し、browser由来の未知fieldは採用しない。 | `test/humanTriageIntegrity.test.js`, `test/humanTriageBoundaries.test.js` |",
              "| CCR-UT-058 | decision validation | decision別必須field、severity enum、unknown decision、unknown source IDを拒否する。 | `test/humanTriageIntegrity.test.js` |",
              "| CCR-UT-059 | optimistic locking | stale source hashとstale decision revisionを安定したerror codeで拒否する。 | `test/humanTriageIntegrity.test.js` |",
              "| CCR-UT-060 | projection classification | accepted、rejected、investigation、question、follow-upがdecisionに従って別成果物へ出る。 | `test/humanTriageIntegrity.test.js`, `test/reviewOutputTriage.test.js` |",
              "| CCR-UT-061 | transaction rollback | staged YAML failure時に既存fileを維持し、staging directoryを残さない。 | `test/humanTriageBoundaries.test.js` |",
              "| CCR-UT-062 | legacy migration | matching IDだけを移行し、unmatched IDをreportし、legacy resultをbackupする。 | `test/humanTriageIntegrity.test.js` |",
              "| CCR-UT-063 | Webview boundary | untriaged state、lock token、source context、editable decision field、action/message whitelistを検証する。 | `test/guiFirstSurfaces.test.js`, `test/humanTriageBoundaries.test.js` |",
              "",
              "Windowsではtemporary directoryが8.3短縮名と長形式名で表現される場合がある。CAS test barrierとbackup directoryのassertionはlexical stringではなくphysical identityまたは対象basenameで比較する。"
            ]
          )

          appendSection(
            "extensions/bob-code-consistency-review/docs/real-machine-test-spec-ja.md",
            "<!-- TRIAGE-INTEGRITY-2026-07-12 -->",
            [
              "<!-- TRIAGE-INTEGRITY-2026-07-12 -->",
              "## 2026-07-12 Human Triage Integrity 実機テスト",
              "",
              "### CCR-RT-036 Generate / edit / save / reload",
              "",
              "| 項目 | 内容 |",
              "| --- | --- |",
              "| 手順 | Bob outputをcapture・validateし、Human Triage GUIで生成する。findingをaccepted、questionをquestionとして必要fieldを入力し保存後、GUIを閉じて再度開く。 |",
              "| 期待結果 | source contextは不変で、人間decision、owner、reason、comment、follow-upが再表示される。accepted / question / follow-up Markdownが保存内容と一致する。 |",
              "",
              "### CCR-RT-037 Source change conflict",
              "",
              "| 項目 | 内容 |",
              "| --- | --- |",
              "| 手順 | GUIを開いたままBob outputを変更してtriageを再生成し、古い画面から保存する。 |",
              "| 期待結果 | `TRIAGE_SOURCE_CHANGED`で保存を拒否し、新しいsourceとprojectionを上書きしない。再読込後は新sourceを表示する。 |",
              "",
              "### CCR-RT-038 Two-window decision revision conflict",
              "",
              "| 項目 | 内容 |",
              "| --- | --- |",
              "| 手順 | Human Triage GUIを2画面で開き、画面Aで保存後、古い画面Bから保存する。 |",
              "| 期待結果 | 画面Bは`TRIAGE_REVISION_CONFLICT`となる。Aのdecisionと生成成果物を保持し、再読込後に最新revisionを表示する。 |",
              "",
              "### CCR-RT-039 Legacy migration",
              "",
              "| 項目 | 内容 |",
              "| --- | --- |",
              "| 手順 | legacy `triage-result.yaml`だけを配置し、matching IDとunmatched IDを含めてtriageを生成する。 |",
              "| 期待結果 | matching decisionだけが`triage-decisions.yaml`へ移り、旧resultのbackupと`migration-report.md`が作成される。unmatched IDは判断へ混入しない。 |",
              "",
              "### CCR-RT-040 Backup and projection inspection",
              "",
              "| 項目 | 内容 |",
              "| --- | --- |",
              "| 手順 | decisionを複数回保存し、triage directoryのsource、decisions、互換YAML、各Markdown、backupを比較する。 |",
              "| 期待結果 | `triage-source.yaml`をGUI保存が変更せず、decision revisionが成功ごとに1増える。Markdownはdecision分類と一致し、手編集を正本として取り込まない。 |",
              "",
              "Phase 1の実機合格にはCCR-RT-036からCCR-RT-040の結果と、Developer Tools Consoleに未処理例外がないことをrelease evidenceへ記録する。"
            ]
          )

          const planPath = "docs/superpowers/plans/2026-07-12-bob-code-consistency-review-triage-integrity.md"
          let plan = fs.readFileSync(planPath, "utf8").replace(/\r\n/g, "\n")
          plan = plan.replace(/- \[ \]/g, "- [x]")
          if (!plan.includes("<!-- TRIAGE-INTEGRITY-EXECUTION-2026-07-12 -->")) {
            plan = `${plan.trimEnd()}\n\n<!-- TRIAGE-INTEGRITY-EXECUTION-2026-07-12 -->\n## Execution Evidence\n\n- TDD RED contracts were committed before production implementation.\n- Focused source, decision, projection, migration, transaction, GUI-boundary, and compatibility tests pass.\n- Windows full extension verification ran dependency, architecture, source, unit, package, and VSIX policy gates.\n- Ubuntu and Windows repository workflows remain the final share gate on the post-finalization commit.\n- Manual IBM Bob operator UAT remains a release-candidate gate and is not represented as automated completion.\n`
          }
          fs.writeFileSync(planPath, plan, "utf8")

          const specPath = "docs/superpowers/specs/2026-07-11-bob-code-consistency-review-workspace-v2-design.md"
          let spec = fs.readFileSync(specPath, "utf8").replace(/\r\n/g, "\n")
          spec = spec.replace("- ステータス: Proposed（設計レビュー待ち）", "- ステータス: Phase 1 implemented（Triage Integrity）")
          fs.writeFileSync(specPath, spec, "utf8")
          '@ | node

      - name: Inspect final documentation diff
        working-directory: .
        shell: pwsh
        run: |
          git diff --check
          git diff --stat

      - name: Commit documentation and remove temporary workflow
        working-directory: .
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-07-11-bob-code-consistency-review-workspace-v2-design.md
          git add docs/superpowers/plans/2026-07-12-bob-code-consistency-review-triage-integrity.md
          git add extensions/bob-code-consistency-review/README.md
          git add extensions/bob-code-consistency-review/docs/detailed-design-ja.md
          git add extensions/bob-code-consistency-review/docs/unit-test-spec-ja.md
          git add extensions/bob-code-consistency-review/docs/real-machine-test-spec-ja.md
          git rm .github/workflows/triage-integrity-windows-diagnostic.yml
          git commit -m "docs: finalize triage integrity phase"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
