name: triage-integrity-windows-diagnostic

on:
  pull_request:
    paths:
      - "extensions/bob-code-consistency-review/**"
      - ".github/workflows/triage-integrity-windows-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: triage-integrity-windows-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    name: Windows traceability barrier diagnostic
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Instrument basename-scoped CAS barrier
        shell: pwsh
        run: |
          @'
          const fs = require("node:fs")
          const path = require("node:path")
          const filePath = path.join(process.cwd(), "test", "traceabilityCatalogStore.test.js")
          let text = fs.readFileSync(filePath, "utf8").replace(/\r\n/g, "\n")
          const directoryLine = '  const expectedDirectory = normalizePhysicalPath(path.dirname(targetPath))\n'
          const conditionLine = '      normalizePhysicalPath(path.dirname(candidate)) === expectedDirectory &&\n'
          if (text.includes(directoryLine)) text = text.replace(directoryLine, "")
          if (text.includes(conditionLine)) text = text.replace(conditionLine, "")
          const candidateLine = '    const candidate = typeof args[0] === "string" ? args[0] : undefined\n'
          const debugLine = '    console.error("CAS_OPEN", JSON.stringify(candidate), JSON.stringify(candidate ? path.basename(candidate) : ""), JSON.stringify(tempPrefix))\n'
          if (!text.includes(debugLine)) {
            if (!text.includes(candidateLine)) throw new Error("CAS candidate line not found")
            text = text.replace(candidateLine, candidateLine + debugLine)
          }
          fs.writeFileSync(filePath, text)
          '@ | node

      - name: Run traceability CAS suite and capture evidence
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "traceability-cas-windows.log"
          $patched = Join-Path $env:RUNNER_TEMP "traceabilityCatalogStore.patched.test.js"
          Copy-Item test\traceabilityCatalogStore.test.js $patched
          & node --test test/traceabilityCatalogStore.test.js *> $log
          $status = $LASTEXITCODE
          Write-Host "Unit test exit code: $status"
          Get-Content $log -Tail 420
          exit $status

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: traceability-cas-barrier-diagnostic
          path: |
            ${{ runner.temp }}/traceability-cas-windows.log
            ${{ runner.temp }}/traceabilityCatalogStore.patched.test.js
          if-no-files-found: error
          retention-days: 3
