name: triage-integrity-windows-diagnostic

on:
  pull_request:
    paths:
      - "extensions/bob-code-consistency-review/**"
      - ".github/workflows/triage-integrity-windows-diagnostic.yml"
  workflow_dispatch:

concurrency:
  group: triage-integrity-windows-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Windows triage unit diagnostic
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: extensions/bob-code-consistency-review

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run full unit suite and capture TAP
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "triage-integrity-windows-unit.log"
          & node --test test/*.test.js *> $log
          $status = $LASTEXITCODE
          Write-Host "Unit test exit code: $status"
          Get-Content $log -Tail 320
          exit $status

      - name: Upload unit log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: triage-integrity-windows-unit-log
          path: ${{ runner.temp }}/triage-integrity-windows-unit.log
          if-no-files-found: error
          retention-days: 3
