name: Generate evidence scope phase 2 manifest

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Generate SHA-256 manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          paths = [
              "docs/superpowers/plans/2026-07-12-bob-evidence-scope-phase2.md",
              "docs/implementation/bob-evidence-scope-phase2-2026-07-12.md",
              "docs/implementation/bob-evidence-scope-phase2-verification-2026-07-12.md",
              "extensions/bob-code-consistency-review/docs/evidence-scope-domain-contract-ja.md",
              "extensions/bob-code-consistency-review/src/evidenceScope/reviewContextBudget.ts",
              "extensions/bob-code-consistency-review/src/evidenceScope/index.ts",
              "extensions/bob-code-consistency-review/src/core/pipeline.ts",
              "extensions/bob-code-consistency-review/src/core/reviewPackageBuilder.ts",
              "extensions/bob-code-consistency-review/resources/schemas/review-input.schema.json",
              "docs/workflows/code-consistency-review/schemas/review-input.schema.json",
              "extensions/bob-code-consistency-review/test/evidenceScopePipeline.test.js",
          ]

          files = []
          for item in paths:
              path = Path(item)
              data = path.read_bytes()
              files.append({
                  "path": item,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          payload = {
              "schema_version": 1,
              "artifact": "bob-evidence-scope-phase2",
              "hash_algorithm": "sha256",
              "source_commit": os.environ["SOURCE_COMMIT"],
              "files": files,
          }
          output = Path("docs/implementation/bob-evidence-scope-phase2-manifest.json")
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/implementation/bob-evidence-scope-phase2-manifest.json
          if git diff --cached --quiet; then
            echo 'Manifest is unchanged.'
            exit 0
          fi
          git commit -m 'docs: add bob evidence scope phase 2 manifest'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
