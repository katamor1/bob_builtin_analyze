name: p1-3-doc-status

on:
  pull_request:
    paths:
      - ".github/workflows/p1-3-doc-status.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Synchronize plan and roadmap status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          plan_path = Path("docs/superpowers/plans/2026-07-12-workflow-reuse-provenance-p1-3.md")
          plan = plan_path.read_text(encoding="utf-8")
          status = "\n**実行状況（2026-07-13）:** Task 1〜5 implemented and focused GREEN. Task 6 final cross-platform verification pending.\n"
          title = "# Workflow Reused / Skipped Provenance P1-3 Implementation Plan\n"
          if "**実行状況（2026-07-13）:**" not in plan:
              plan = plan.replace(title, title + status, 1)
          before, marker, after = plan.partition("### Task 6: Full verification and integration")
          if not marker:
              raise SystemExit("Task 6 marker missing")
          before = before.replace("- [ ]", "- [x]")
          plan_path.write_text(before + marker + after, encoding="utf-8")

          roadmap_path = Path("docs/workflow-register-feature-roadmap-2026-07-11.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          heading = "### P1-3. Reused / Skipped 状態を一貫表示する\n"
          line = "\n**実行状況（2026-07-13）:** Draft PR #90で実装済み。共通projector、Operation Hub、Runs View、Run Diagnostics、Bob chat control、metadata sanitization、表示上限のfocused testはGREEN。最終Ubuntu／Windows matrixとmergeは継続中。\n"
          if "Draft PR #90で実装済み" not in roadmap:
              if heading not in roadmap:
                  raise SystemExit("P1-3 roadmap heading missing")
              roadmap = roadmap.replace(heading, heading + line, 1)
          roadmap_path.write_text(roadmap, encoding="utf-8")
          PY

      - name: Commit synchronized documentation
        shell: bash
        run: |
          rm .github/workflows/p1-3-doc-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: synchronize P1-3 completion status"
          git push origin HEAD:${{ github.head_ref }}
