name: agent-diagnose-workflow-register-ci

on:
  pull_request:
    paths:
      - ".github/workflows/agent-diagnose-workflow-register-ci.yml"
      - "extensions/workflow-register/**"
      - "extensions/bob-code-consistency-review/**"

permissions:
  contents: read

concurrency:
  group: agent-diagnose-workflow-register-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workflow-register-ubuntu
            os: ubuntu-latest
            extension: workflow-register
          - name: workflow-register-windows
            os: windows-latest
            extension: workflow-register
          - name: bob-code-consistency-windows
            os: windows-latest
            extension: bob-code-consistency-review
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions/${{ matrix.extension }}
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/${{ matrix.extension }}/package-lock.json
      - name: Install dependencies
        run: npm ci --silent
      - name: Run test suite and capture log
        id: test
        run: |
          set +e
          npm test > "$RUNNER_TEMP/test.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/status.txt"
          if [ "$status" -ne 0 ]; then
            grep -n -B 35 -A 160 -E "not ok|AssertionError|ERR_ASSERTION|error:|Error:" "$RUNNER_TEMP/test.log" || tail -n 400 "$RUNNER_TEMP/test.log"
          else
            tail -n 40 "$RUNNER_TEMP/test.log"
          fi
          exit 0
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}-test-log
          path: |
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/status.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test result
        if: always()
        run: test "$(tr -d '\r\n' < "$RUNNER_TEMP/status.txt")" = "0"
