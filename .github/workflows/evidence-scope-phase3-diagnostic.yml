name: Evidence scope phase 3 diagnostic

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json
      - name: Install dependencies
        working-directory: extensions/bob-code-consistency-review
        run: npm ci
      - name: Capture full test suite
        working-directory: extensions/bob-code-consistency-review
        shell: bash
        run: |
          set +e
          npm test > phase3-tests.log 2>&1
          echo $? > phase3-tests.exit-code
          exit 0
      - name: Commit diagnostic
        run: |
          set -euo pipefail
          mkdir -p docs/implementation/diagnostics
          cp extensions/bob-code-consistency-review/phase3-tests.log docs/implementation/diagnostics/evidence-scope-phase3-tests.log
          cp extensions/bob-code-consistency-review/phase3-tests.exit-code docs/implementation/diagnostics/evidence-scope-phase3-tests.exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/implementation/diagnostics/evidence-scope-phase3-tests.log docs/implementation/diagnostics/evidence-scope-phase3-tests.exit-code
          git commit -m 'ci: record full evidence scope phase 3 diagnostics'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
