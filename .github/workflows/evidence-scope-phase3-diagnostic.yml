name: Evidence scope phase 3 diagnostic

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json
      - name: Install dependencies
        working-directory: extensions/bob-code-consistency-review
        run: npm ci
      - name: Compile
        working-directory: extensions/bob-code-consistency-review
        run: npm run compile
      - name: Capture focused tests
        working-directory: extensions/bob-code-consistency-review
        shell: bash
        run: |
          set +e
          node --test test/projectRulePack.test.js test/evidenceScopePipeline.test.js > "${RUNNER_TEMP}/phase3-tests.log" 2>&1
          echo $? > "${RUNNER_TEMP}/phase3-tests.exit-code"
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-scope-phase3-diagnostic
          path: |
            ${{ runner.temp }}/phase3-tests.log
            ${{ runner.temp }}/phase3-tests.exit-code
          if-no-files-found: error
          retention-days: 1
