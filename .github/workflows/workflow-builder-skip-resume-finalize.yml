name: workflow-builder-skip-resume-finalize

on:
  push:
    branches:
      - agent/workflow-builder-skip-resume-readiness-20260712
    paths:
      - ".github/workflows/workflow-builder-skip-resume-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-builder-skip-resume-readiness-20260712
          fetch-depth: 0

      - name: Verify finalization base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "91d8dcd56b8ef5ee336f09c34e5e7ec73f930055"

      - name: Update plan, operator docs, and evidence
        shell: bash
        env:
          FINALIZATION_TRIGGER_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text.rstrip() + "\n", encoding="utf-8")

          plan_path = "docs/superpowers/plans/2026-07-12-workflow-builder-skip-resume-readiness.md"
          plan = read(plan_path).replace("- [ ]", "- [x]")
          completion_marker = "## Completion Record"
          if completion_marker not in plan:
              plan += """

          ## Completion Record

          - Implementation code head: `91d8dcd56b8ef5ee336f09c34e5e7ec73f930055`.
          - Full suite: 789 tests passed, 0 failed, 0 skipped.
          - Focused TDD workflow: run `29201666390`, success.
          - Official Linux/Windows matrix: run `29201666388`, success.
          - Package, VSIX policy, and Extension Host smoke: success on Linux and Windows.
          - Whole-diff review after stale-preview, portable-path, and extension-field fixes: Critical 0 / Important 0.
          - Temporary CI workflows are removed in the cleanup tail after this documentation commit.
          """
          write(plan_path, plan)

          spec_path = "docs/superpowers/specs/2026-07-12-workflow-builder-skip-resume-readiness-design.md"
          spec = read(spec_path)
          original = "loader は `x-skipResume` を GUI 管理fieldとして読み、serializer は同じfield名で書き戻す。これにより YAML 手編集と GUI round-trip の両方で設定が消えない。"
          replacement = original + " `fileBound`以外の未知サブフィールドはauthoring modelの`unknownFrontMatter[\"x-skipResume\"]`へ退避し、serializerが管理値とmergeして前方互換に書き戻す。"
          if original not in spec:
              raise SystemExit("design insertion point not found")
          spec = spec.replace(original, replacement, 1)
          write(spec_path, spec)

          operator_path = "extensions/workflow-register/docs/workflow-builder-skip-resume-readiness-ja.md"
          operator = read(operator_path)
          old_roundtrip = "未知front matterは従来どおり`unknownFrontMatter`で保持するが、`x-skipResume`はBuilder管理項目なので二重出力しない。"
          new_roundtrip = "未知front matterは従来どおり`unknownFrontMatter`で保持する。`x-skipResume.fileBound`はBuilderが管理する一方、`x-skipResume`内の未知サブフィールドは`unknownFrontMatter[\"x-skipResume\"]`へ保持し、保存時に管理値とmergeするため失われない。"
          if old_roundtrip not in operator:
              raise SystemExit("operator round-trip paragraph not found")
          operator = operator.replace(old_roundtrip, new_roundtrip, 1)
          write(operator_path, operator)

          skip_plan_path = "extensions/workflow-register/docs/workflow-skip-resume-plan-ja.md"
          skip_plan = read(skip_plan_path)
          phase6_marker = "## Phase 6 — Workflow Builder readiness setup"
          if phase6_marker not in skip_plan:
              skip_plan += """

          ## Phase 6 — Workflow Builder readiness setup

          Workflow Builderの`Artifacts`タブに、file-bound skip resume定義をpreview-firstで準備する`途中再開 readiness`カードを追加した。

          - command / agent / manual form / manual approvalのresult keyを候補化する。
          - artifact ID、`producedBy`、run-scoped path、schemaを生成前に表示する。
          - candidateを選択し、Before / After Markdownとstrict diagnosticsを確認してからmodelへ適用する。
          - previewとapplyは同じpure plannerとstrict validatorを再実行する。
          - 既存artifactの削除、rename、上書きは行わない。
          - agentの`resultKey`不足、result stepのfile sink不足、ownership衝突、非portable path segmentはblockerとする。
          - apply後は適用済みmodelからfresh previewを取得する。
          - `x-skipResume`の未知サブフィールドをBuilder round-tripで保持する。

          applyは`WORKFLOW.md`を直接保存しない。利用者は既存の`Preview / Diagnostics`、`Diff`、`Save`経路で最終確認と保存を行う。
          """
          write(skip_plan_path, skip_plan)

          readme_path = "extensions/workflow-register/src/webview/README.md"
          readme = read(readme_path)
          row_anchor = "| `workflowBuilderGuidedHelpScript.ts` | Step type guide、動的選択肢ラベル、Diagnostics から設定項目への誘導。 |"
          row = row_anchor + "\n| `workflowBuilderSkipResumeReadinessScript.ts` | Artifactsタブのskip-resume候補選択、stale preview破棄、preview/apply message処理。 |"
          if "workflowBuilderSkipResumeReadinessScript.ts" not in readme:
              if row_anchor not in readme:
                  raise SystemExit("webview module table anchor not found")
              readme = readme.replace(row_anchor, row, 1)
          message_anchor = "| `resetTemplate` | template から新しい `WorkflowAuthoringModel` を作り直して Webview に送る。 |"
          message_rows = message_anchor + "\n| `previewSkipResumeReadiness` | pure plannerを実行し、候補、blocker、Before / After Markdown、strict diagnosticsを返す。 |\n| `applySkipResumeReadiness` | 同じplannerを再実行し、strict-validな場合だけ更新済みmodelを返す。 |"
          if "| `previewSkipResumeReadiness` |" not in readme:
              if message_anchor not in readme:
                  raise SystemExit("webview message table anchor not found")
              readme = readme.replace(message_anchor, message_rows, 1)
          readiness_section = """

          ## Skip Resume Readiness

          `workflowBuilderSkipResumeReadinessScript.ts`はArtifactsタブを開いた時点でsource signature付きpreviewを要求する。steps、artifacts、または`skipResume`が変わるとcached previewを破棄し、古いrequest IDのresponseを無視する。

          applyはWebviewのpreview結果を正本にせず、extension hostが`planSkipResumeReadiness()`とstrict validationを再実行する。成功時もファイルへ直接書かず、Builder modelだけを置き換えて通常previewを更新し、適用済みmodelからreadiness previewを再取得する。
          """
          if "## Skip Resume Readiness" not in readme:
              readme = readme.replace("\n## Save path", readiness_section + "\n\n## Save path", 1)
          write(readme_path, readme)

          trigger_head = os.environ.get("FINALIZATION_TRIGGER_HEAD", "unknown")
          release = f"""# Workflow Builder Skip Resume Readiness Release Evidence

          ## 1. 判定

          | 項目 | 値 |
          | --- | --- |
          | 実施日 | 2026-07-12 |
          | Repository | `katamor1/bob_builtin_analyze` |
          | Component | `extensions/workflow-register` |
          | Branch | `agent/workflow-builder-skip-resume-readiness-20260712` |
          | Pull request | #82 |
          | Verified implementation head | `91d8dcd56b8ef5ee336f09c34e5e7ec73f930055` |
          | Documentation trigger head | `{trigger_head}` |
          | Full suite | 789 passed / 0 failed / 0 skipped |
          | Official matrix | `extensions-quality` run `29201666388`: success |
          | Focused/full evidence | `workflow-builder-skip-resume-tdd` run `29201666390`: success |
          | Whole-diff review | Critical 0 / Important 0 |
          | Merge gate | **GO after temporary workflow cleanup and final branch checks** |

          ## 2. Delivered behavior

          - `WorkflowAuthoringModel.skipResume.fileBound`を明示的にround-tripする。
          - Artifactsタブで再利用候補をstep単位に選択できる。
          - artifact ID、`producedBy`、run-scoped path、schemaをpreviewする。
          - Before / Afterの完全なWORKFLOW.mdとstrict diagnosticsをapply前に表示する。
          - previewとapplyが同じpure plannerとstrict validatorを使用する。
          - applyはmodelだけを更新し、既存Preview / Diff / Save経路を維持する。
          - 既存artifactを自動削除、rename、上書きしない。
          - stale preview responseをrequest IDとsource signatureで拒否する。
          - apply後に適用済みmodelからfresh readiness previewを取得する。
          - 生成pathに使うstep ID / resultKeyのpath traversal、separator、Windows予約名を拒否する。
          - `x-skipResume`内の未知サブフィールドをBuilder round-tripで保持する。

          ## 3. TDD evidence

          ### Portable artifact path boundary

          Test-only head `5bc65e7af73cc3adcb24f8acc29da7192057c0b8`で、`../collect`、`../report`、`CON`などを拒否する回帰testを追加した。run `29201030733`で旧実装のfailureを記録し、production fix head `a0db6f0aabffd9d11762d49b9417955a5e2d7f0f`のrun `29201164317`でGREENを確認した。

          ### Forward-compatible extension fields

          Test-only head `e55471fc4e1a93671441452f36b1c46f0073d544`で未知`x-skipResume`サブフィールドの消失を再現した。run `29201519821`では789件中1件が意図どおり失敗し、`unknownFrontMatter[\"x-skipResume\"]`が`undefined`であることを観測した。

          Loaderはboolean `fileBound`だけを管理値として抽出し、それ以外をnested unknown front matterとして保存する。Serializerは未知fieldと管理値をmergeする。production head `91d8dcd56b8ef5ee336f09c34e5e7ec73f930055`のrun `29201666390`で789/789 GREENを確認した。

          ## 4. Full quality gates

          `extensions-quality` run `29201666388`は同じimplementation headで成功した。

          - Linux `workflow-register`: unit、dependency / architecture / source / schema policy、audit、package、VSIX policy、Extension Host smokeが成功。
          - Windows `workflow-register`: unit、policy、package、VSIX policy、Extension Host smokeが成功。
          - Linux / Windows `bob-code-consistency-review`: 成功。
          - Linux / Windows `bob-bazaar-review`: 成功。
          - Extension source metrics: 成功。

          Custom full-suite evidenceでは次を記録した。

          ```text
          tests: 789
          pass: 789
          fail: 0
          cancelled: 0
          skipped: 0
          full_status=0
          ```

          ## 5. Review findings closed

          1. apply後に通常previewだけ更新されreadiness previewが古いmodelに残る経路を修正した。
          2. generated artifact pathへstep ID / resultKeyを直接埋め込む境界にportable segment validationを追加した。
          3. `x-skipResume`をmanaged fieldへ移したことで未知サブフィールドが消える前方互換性問題を修正した。

          Final review result:

          ```text
          Critical: 0
          Important: 0
          ```

          ## 6. Residual risks and out-of-scope

          - task snapshot import preview / selective applyはP1-2。
          - reused / skipped表示統一はP1-3。
          - detached held run recovery assistantはP1-4。
          - resultKeyの自動追加、artifact schema推論、artifact file実生成は対象外。
          - BuilderはYAMLコメントと元のfield順序を完全保存しない。
          - 実IBM Bob / Bazaar / multi-root UATは製品配布の別ゲート。

          ## 7. Cleanup

          TDD evidence取得用の`.github/workflows/workflow-builder-skip-resume-tdd.yml`と、このdocumentation finalizerは最終cleanup tailで削除する。PR差分にtemporary workflowを残さない。
          """
          write("docs/release-evidence/workflow-builder-skip-resume-readiness-2026-07-12.md", release)

          review = """# Workflow Builder Skip Resume Readiness Whole-Diff Review

          ## Scope

          - authoring model / loader / serializer
          - pure readiness planner
          - preview/apply strict-validation boundary
          - Workflow Builder host messages
          - Artifacts tab client behavior and styles
          - round-trip, planner, preview, Webview, stale-response, path-boundary tests
          - operator documentation and release evidence
          - temporary workflow cleanup

          ## Review method

          1. mainとの差分をfile単位で確認した。
          2. model compatibility、unknown front matter、artifact non-destructive behaviorを確認した。
          3. preview/apply parityとstale response rejectionを確認した。
          4. generated path segmentのworkspace / Windows portability boundaryを確認した。
          5. Linux / Windows unit、policy、package、VSIX、Extension Host resultsを確認した。
          6. temporary workflowが最終PR差分へ残らないcleanup手順を確認した。

          ## Findings fixed during review

          ### Important — applied model did not request a fresh readiness preview

          Apply成功後に通常previewだけを更新する経路を修正し、cached readiness stateを破棄して適用済みmodelから再要求するtestを追加した。

          ### Important — generated path segments accepted traversal and reserved names

          step ID / resultKeyをartifact pathへ埋め込む前にportable segment validationを行い、separator、traversal、末尾dot、Windows予約device名をblockするtestを追加した。

          ### Important — managed x-skipResume dropped unknown nested fields

          `fileBound`以外の未知fieldをnested `unknownFrontMatter`へ保持し、serializerで管理値とmergeする回帰testを追加した。

          ## Final result

          | Severity | Open findings |
          | --- | ---: |
          | Critical | 0 |
          | Important | 0 |

          ## Verification used for review

          - Full suite: 789 passed / 0 failed / 0 skipped.
          - Focused/full evidence run: `29201666390`, success.
          - Official Linux/Windows matrix: `29201666388`, success.
          - Package、VSIX policy、Extension Host smoke: success on both platforms.

          ## Decision

          Code and CI gate: **GO**.

          Product release remains separately gated by real IBM Bob、Bazaar、multi-root、distribution-signing UAT.
          """
          write("docs/release-evidence/workflow-builder-skip-resume-readiness-review-2026-07-12.md", review)
          PY

      - name: Validate changed paths
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(docs/superpowers/plans/2026-07-12-workflow-builder-skip-resume-readiness.md|docs/superpowers/specs/2026-07-12-workflow-builder-skip-resume-readiness-design.md|docs/release-evidence/workflow-builder-skip-resume-readiness-2026-07-12.md|docs/release-evidence/workflow-builder-skip-resume-readiness-review-2026-07-12.md|extensions/workflow-register/docs/workflow-builder-skip-resume-readiness-ja.md|extensions/workflow-register/docs/workflow-skip-resume-plan-ja.md|extensions/workflow-register/src/webview/README.md)$'
          unexpected=$(git status --short | sed -E 's/^.. //' | grep -Ev "$allowed" || true)
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
          git diff --check

      - name: Commit documentation and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/superpowers/plans/2026-07-12-workflow-builder-skip-resume-readiness.md \
            docs/superpowers/specs/2026-07-12-workflow-builder-skip-resume-readiness-design.md \
            docs/release-evidence/workflow-builder-skip-resume-readiness-2026-07-12.md \
            docs/release-evidence/workflow-builder-skip-resume-readiness-review-2026-07-12.md \
            extensions/workflow-register/docs/workflow-builder-skip-resume-readiness-ja.md \
            extensions/workflow-register/docs/workflow-skip-resume-plan-ja.md \
            extensions/workflow-register/src/webview/README.md
          git diff --cached --check
          git commit -m "docs: record builder skip resume readiness gates"
          git push origin HEAD:agent/workflow-builder-skip-resume-readiness-20260712
