name: Fix phase 4 CRLF fixture

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Preserve fixture line endings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("extensions/bob-code-consistency-review/test/repositorySymbolIndex.test.js")
          text = target.read_text(encoding="utf-8")
          old = '''  const originalInput = fs.readFileSync(inputPath, "utf8")
          assert.match(originalInput, /analysis_options:\\s*\\n/)
          fs.writeFileSync(
            inputPath,
            originalInput.replace("analysis_options:\\n", `analysis_options:\\n  repository_symbol_index_path: ${relativePath}\\n`),
            "utf8"
          )'''
          new = '''  const originalInput = fs.readFileSync(inputPath, "utf8")
          const eol = originalInput.includes("\\r\\n") ? "\\r\\n" : "\\n"
          assert.match(originalInput, /analysis_options:\\r?\\n/)
          fs.writeFileSync(
            inputPath,
            originalInput.replace(
              /analysis_options:\\r?\\n/,
              `analysis_options:${eol}  repository_symbol_index_path: ${relativePath}${eol}`
            ),
            "utf8"
          )'''
          if old not in text:
              raise SystemExit("expected Phase 4 fixture block was not found")
          target.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit fixture and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-phase4-crlf-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extensions/bob-code-consistency-review/test/repositorySymbolIndex.test.js .github/workflows/fix-phase4-crlf-fixture.yml
          git commit -m 'test: preserve review input line endings in phase 4 fixture'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
