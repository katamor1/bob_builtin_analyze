name: agent-apply-automatic-pause-current-fixes

on:
  pull_request:
    paths:
      - ".github/workflows/agent-apply-automatic-pause-current-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-automatic-pause-limits-20260712
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - name: Apply integer schema contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path("extensions/workflow-register/src/core/schema/workflowSchema.ts"),
                  '        maxAgentStepsPerRun: { type: "number", exclusiveMinimum: 0 },',
                  '        maxAgentStepsPerRun: { type: "integer", exclusiveMinimum: 0 },'
              ),
              (
                  Path("extensions/workflow-register/schema/workflow-register.v1.schema.json"),
                  '            "maxAgentStepsPerRun": { "type": "number", "exclusiveMinimum": 0 },',
                  '            "maxAgentStepsPerRun": { "type": "integer", "exclusiveMinimum": 0 },'
              )
          ]
          for path, old, new in replacements:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one schema anchor")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install dependencies
        working-directory: extensions/workflow-register
        run: npm ci --silent
      - name: Verify automatic pause contracts
        working-directory: extensions/workflow-register
        run: |
          npm run compile --silent
          node --test test/workflowAutomaticPause*.test.js test/workflowRunStateDiagnostics.test.js
          npm run schema:policy --silent
          npm run architecture:policy --silent
          npm run source:policy --silent
      - name: Commit verified schema and cleanup
        shell: bash
        run: |
          rm -f \
            .github/workflows/agent-apply-automatic-pause-current-fixes.yml \
            .github/workflows/agent-apply-automatic-pause-hardening.yml \
            .github/workflows/agent-debug-automatic-pause-anchors.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/agent-apply-automatic-pause-current-fixes.yml \
            .github/workflows/agent-apply-automatic-pause-hardening.yml \
            .github/workflows/agent-debug-automatic-pause-anchors.yml \
            extensions/workflow-register/schema/workflow-register.v1.schema.json \
            extensions/workflow-register/src/core/schema/workflowSchema.ts
          git commit -m "feat: enforce integer automatic pause limits"
          git push origin HEAD:agent/workflow-automatic-pause-limits-20260712
