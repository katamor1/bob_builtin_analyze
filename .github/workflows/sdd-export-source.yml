name: SDD Export Source

on:
  push:
    branches:
      - agent/workflow-register-japanese-finish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: workflow-register-finish-${{ github.sha }}
          path: |
            .
            !.git
            !**/node_modules
            !**/*.vsix
          retention-days: 1
          include-hidden-files: true
