name: agent-sync-automatic-pause-final-evidence

on:
  pull_request:
    paths:
      - "extensions/workflow-register/test/fixtures/automatic-pause-ci-verification.txt"
      - ".github/workflows/agent-sync-automatic-pause-final-evidence.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'agent/workflow-automatic-pause-ci-verification-20260712'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-automatic-pause-limits-20260712
          fetch-depth: 0
      - name: Synchronize plan and evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_value}: expected one match, found {count}: {old[:100]!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          def append_once(path_value: str, marker: str, addition: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  return
              path.write_text(text.rstrip() + "\n\n" + dedent(addition).strip() + "\n", encoding="utf-8")

          plan = "docs/superpowers/plans/2026-07-12-workflow-automatic-pause-limits.md"
          replace_once(
              plan,
              "- Pull request state: remains draft while current-main reconciliation and external real-environment evidence are open.",
              "- Pull request state: current-main reconciliation and required hosted checks are complete; the PR remains draft only for external real-environment evidence."
          )
          replace_once(
              plan,
              "- [ ] Reconcile draft PR #75 with the current `main` branch and re-run required checks on the reconciled head.",
              "- [x] Reconciled draft PR #75 with `main` at `57ff053bc3f476e3e9d268a743f25edeb0d68356`; reconciliation commit `5e9bad7621e279314f58fbacdced591654fee576`; required checks passed on evidence head `516560f27237dbd422f597d73bc1680407d72ba8`."
          )

          evidence = "docs/release-evidence/workflow-automatic-pause-2026-07-12.md"
          replace_once(
              evidence,
              "- Deliverable source head: `5adabec8e03ea4af948d6d2518dd5628f35e367c`",
              "- Reconciled implementation commit: `5e9bad7621e279314f58fbacdced591654fee576`\n- Required-check evidence head: `516560f27237dbd422f597d73bc1680407d72ba8`"
          )
          replace_once(
              evidence,
              "- Ready to leave draft: NO, pending current-main reconciliation and the external gates below",
              "- Ready to leave draft: NO, pending only the external real-environment gates below"
          )
          append_once(evidence, "## Reconciled-head required checks", '''
          ## Reconciled-head required checks

          After merging current `main`, the user-authored evidence head `516560f27237dbd422f597d73bc1680407d72ba8` passed:

          - `workflow-contracts` run `29199698139`: success
          - `extensions-quality` run `29199698142`: success
          - `code-consistency-review-scaffold` run `29199698155`: success
          - Ubuntu and Windows workflow-register policy, unit, package, VSIX policy, and Extension Host smoke jobs: success
          - Ubuntu and Windows related-extension jobs: success
          ''')

          review = "docs/release-evidence/workflow-automatic-pause-independent-review-2026-07-12.md"
          replace_once(
              review,
              "- Review state: repository implementation and hosted quality gates reviewed; current-main reconciliation and external real-environment gates remain open",
              "- Review state: repository implementation, current-main reconciliation, and hosted quality gates reviewed; external real-environment gates remain open"
          )
          replace_once(
              review,
              "- Merge/release verdict: remains draft / NO-GO until current-main reconciliation and external real-environment evidence are complete",
              "- Merge/release verdict: remains draft / NO-GO until external real-environment evidence is complete"
          )
          replace_once(
              review,
              "- reconcile PR #75 with the current `main` branch and re-run required checks on the reconciled head\n",
              ""
          )
          append_once(review, "## Current-main reconciliation update", '''
          ## Current-main reconciliation update

          PR #75 was reconciled with main commit `57ff053bc3f476e3e9d268a743f25edeb0d68356` in merge commit `5e9bad7621e279314f58fbacdced591654fee576`. The bounded three-file conflict resolution retained current-main Phase 4 durability contracts and automatic-pause heartbeat-contention coverage. Reconciled-head runs `29199698139`, `29199698142`, and `29199698155` all completed successfully.
          ''')

          reconciliation = "docs/release-evidence/workflow-automatic-pause-main-reconciliation-2026-07-12.md"
          replace_once(
              reconciliation,
              "The feature branch is ahead of `main` and behind by zero commits. GitHub reports PR #75 as mergeable. The pull request remains draft only for the required hosted-check rerun on the reconciled head and the separately tracked real IBM Bob, Bazaar process-cleanup, and multi-root evidence.",
              "The feature branch is ahead of `main` and behind by zero commits. GitHub reports PR #75 as mergeable. Required hosted checks passed on user-authored evidence head `516560f27237dbd422f597d73bc1680407d72ba8`; the pull request remains draft only for separately tracked real IBM Bob, Bazaar process-cleanup, and multi-root evidence."
          )
          append_once(reconciliation, "## Reconciled-head hosted checks", '''
          ## Reconciled-head hosted checks

          - `workflow-contracts` run `29199698139`: success
          - `extensions-quality` run `29199698142`: success
          - `code-consistency-review-scaffold` run `29199698155`: success
          - Ubuntu / Windows unit tests, package, VSIX policy, and Extension Host smoke: success
          ''')
          PY
          rm .github/workflows/agent-sync-automatic-pause-final-evidence.yml
          git diff --check
      - name: Commit synchronized evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: complete automatic pause repository gates"
          git push origin HEAD:agent/workflow-automatic-pause-limits-20260712
