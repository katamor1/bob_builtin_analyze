name: p1-3-final-matrix-trigger

on:
  pull_request:
    paths:
      - ".github/workflows/p1-3-final-matrix-trigger.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Push trigger and clean final head
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          printf '\n# P1-3 final verification trigger\n' >> .github/workflows/workflow-contracts.yml
          printf '\n# P1-3 final verification trigger\n' >> .github/workflows/code-consistency-review-scaffold.yml
          git add .github/workflows/workflow-contracts.yml .github/workflows/code-consistency-review-scaffold.yml
          git diff --cached --check
          git commit -m "chore: trigger P1-3 final workflows"
          git push origin HEAD:${{ github.head_ref }}

          git checkout HEAD^ -- .github/workflows/workflow-contracts.yml .github/workflows/code-consistency-review-scaffold.yml
          rm .github/workflows/p1-3-final-matrix-trigger.yml
          git add -A
          git diff --cached --check
          git commit -m "chore: remove P1-3 verification trigger"
          git push origin HEAD:${{ github.head_ref }}
