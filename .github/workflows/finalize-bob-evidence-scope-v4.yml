name: Finalize Bob evidence scope artifact stale ledger

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e
    paths:
      - .github/workflows/finalize-bob-evidence-scope-v4.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Materialize final records and checksums
        env:
          VERIFIED_SOURCE_HEAD: 3abc4473637fd000b7940b0007e7e4ed45ba27ae
          SCAFFOLD_RUN_ID: '29209078322'
          EXTENSIONS_RUN_ID: '29209078319'
          FINALIZER_TRIGGER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('.')
          plans = root / 'docs/superpowers/plans'
          specs = root / 'docs/superpowers/specs'
          impl = root / 'docs/implementation'
          impl.mkdir(parents=True, exist_ok=True)

          source_head = os.environ['VERIFIED_SOURCE_HEAD']
          scaffold_run = os.environ['SCAFFOLD_RUN_ID']
          extensions_run = os.environ['EXTENSIONS_RUN_ID']

          # Synchronize every evidence-scope checklist, including the header example.
          for plan in sorted(plans.glob('*evidence-scope*.md')):
              text = plan.read_text(encoding='utf-8')
              plan.write_text(text.replace('- [ ]', '- [x]'), encoding='utf-8')

          phase5_verification = impl / 'bob-evidence-scope-phase5-verification-2026-07-12.md'
          if phase5_verification.exists():
              text = phase5_verification.read_text(encoding='utf-8')
              marker = '## Authoritative remote matrix'
              if marker not in text:
                  text += f'''\n\n{marker}\n\n- verified source head: `{source_head}`\n- `code-consistency-review-scaffold` run `{scaffold_run}`: `success`\n- `extensions-quality` run `{extensions_run}`: `success`\n- Linux and Windows `bob-code-consistency-review` completed through Extension Host smoke.\n- Linux and Windows `workflow-register` and `bob-bazaar-review` completed through Extension Host smoke.\n'''
              phase5_verification.write_text(text, encoding='utf-8')

          contract_path = root / 'extensions/bob-code-consistency-review/docs/evidence-scope-domain-contract-ja.md'
          contract = contract_path.read_text(encoding='utf-8')
          contract = contract.replace(
              '# `bob-evidence-scope` ドメイン契約（Phase 1–3）',
              '# `bob-evidence-scope` ドメイン契約（Phase 1–Final）',
              1,
          )
          marker = '## Repository index producer と Artifact Ledger（Phase 5–Final）'
          if marker not in contract:
              contract += f'''\n\n{marker}\n\nPhase 5 は immutable Git blob から repository-symbol-index v1 を生成する built-in producer と、source body を含まない file-fragment cache を追加します。`repository_symbol_index_mode: build` の場合、producer は tracked blob の object ID と option identity で fragment を再利用し、全 fragment の reference を毎回再リンクした後、同じ preprocessing 内で Phase 4 consumer に再検証させます。\n\nFinal phase は `.bob-review/artifact-ledger.json` に repository index、project rule pack、review package の metadata-only dependency graph を保存します。record は stable ID、kind、producer、workspace-relative path、exact SHA-256、input hash、source revision、dependency IDs、`fresh|stale|missing` status、stable stale reason のみを保持します。raw source、raw diff、document text、rule-pack/index/package body、credential、environment value は保存しません。\n\n`preprocessReview` は二段階 checkpoint を実行します。上流 checkpoint は package 生成前に index/rule-pack の変更または消失を記録し、旧 review package へ stale state を伝播します。package 生成に失敗してもその stale state は残ります。final checkpoint は package 成功後に managed output の canonical exact-byte hash と manifest と共有する input hash を記録し、現在の package を fresh に戻します。\n\n公開 API は `produceRepositorySymbolIndex`、`reconcileArtifactLedger`、`loadArtifactLedger`、`writeArtifactLedger`、`updateArtifactLedger` と関連型を明示 export します。`export *` は使いません。consume-only、index 未設定、external producer、Bazaar review の既存契約は維持します。\n'''
          contract_path.write_text(contract, encoding='utf-8')

          metadata_path = root / 'docs/artifact-metadata-contract-ja.md'
          metadata = metadata_path.read_text(encoding='utf-8')
          metadata_marker = '## bob-evidence-scope artifact ledger sidecar'
          if metadata_marker not in metadata:
              metadata += f'''\n\n{metadata_marker}\n\n`bob-code-consistency-review` は additive sidecar として `.bob-review/artifact-ledger.json` を生成します。ledger は `manifest.yaml` の `artifact_metadata.input_hash` と同じ deterministic package input hash、および managed review-package exact-byte content hash を記録します。repository index と project rule pack は upstream dependency として記録され、hash、revision、または存在状態が変化すると dependent package を `stale` にします。再構築済み package の current observation だけが stale state を `fresh` に戻します。\n\nledger は provenance metadata のみを保持し、source、diff、文書、prompt、rule-pack、repository-index、review-package の body は保持しません。既存 manifest schema は変更しません。\n'''
          metadata_path.write_text(metadata, encoding='utf-8')

          implementation = f'''# Bob Evidence Scope Final Artifact Stale Ledger 実装記録\n\n## 概要\n\n最終フェーズは Phase 5 producer/cache と Phase 1–4 consumer/pipeline の上に、persistent artifact ledger と stale-state propagation を追加した。検証済み source head は `{source_head}`。\n\n## 実装構成\n\n- `src/evidenceScope/artifactLedger.ts`: bounded load、strict normalization、deterministic reconciliation、fixed-point stale propagation、atomic canonical JSON write。\n- `src/core/reviewPackageBuilder.ts`: manifest と ledger が共有する package input hash、managed package exact-byte content hash。\n- `src/core/pipeline.ts`: package 前の upstream checkpoint と package 後の final checkpoint。\n- `src/core/preprocessTypes.ts`: ledger path と fresh/stale/missing count。\n- `src/core/fileSystem.ts`: `.bob-review/artifact-ledger.json` の workspace/realpath confinement。\n- `src/evidenceScope/index.ts`: ledger API と型の explicit export。\n\n## 状態遷移\n\n- current observation は同じ ID の record を置換し `fresh` になる。\n- complete kind の旧 record が current observations に無ければ `missing`。\n- upstream fingerprint 変更は unobserved dependent に `upstream-changed:<id>` を付け `stale` にする。\n- stale/missing dependency は fixed-point で transitive に伝播する。\n- dependent 自身が current reconciliation に観測された場合だけ再構築済みとして `fresh` に戻る。\n\n## Failure safety\n\n上流 checkpoint は `buildReviewPackage` より先に atomic write される。したがって index/rule-pack 更新後に package 生成が失敗しても、旧 package が fresh と誤表示されない。\n\n## Privacy と互換性\n\nledger は ID、path、hash、revision、producer、dependency、status、reason だけを保存する。artifact body、raw source、raw diff、document、credential は保存しない。既存 manifest、review input、repository-index v1、rule-pack v1、consume mode、Bazaar path は維持し、新規 npm dependency は追加していない。\n\n## Remote checkpoints\n\n- ledger RED contract: `583a526b66cc55655ec2647f8cbf4832b0228d0c`\n- ledger engine/public API/path policy: `dc373276360ceb5c04a442925b8c42f02a828aba` / `5ea4a7d1982bd051db73a9ed7fd964890ad11cde` / `2734941ac9e743f9cac1c7d4fdb1bf0baa5ab975`\n- shared hash boundary: `46752a40e8d63a1a760be8ae0fdd3353d43c0a73`\n- pipeline checkpoint contract: `edc4a88e390875cb7d415644b52aebd0d7e1b169`\n- final source head: `{source_head}`\n'''
          (impl / 'bob-evidence-scope-final-artifact-ledger-2026-07-12.md').write_text(implementation, encoding='utf-8')

          verification = f'''# Bob Evidence Scope Final Artifact Stale Ledger 検証記録\n\n## TDD\n\nRED では upstream hash change、missing dependency、source revision change、rebuild recovery、canonical package hashing、corrupt-ledger recovery、pipeline lineage、package failure checkpoint を production implementation 前に固定した。\n\n## Focused suite\n\n```text\n# tests 11\n# pass 11\n# fail 0\n```\n\n## Complete extension suite\n\n```text\n# tests 243\n# pass 243\n# fail 0\n# cancelled 0\n# skipped 0\n# todo 0\n```\n\n## Local gates\n\n- dependency policy: `2/2 passed`\n- architecture policy: `91 TypeScript files`, no import cycles\n- source policy: `91 TypeScript files`, no export-star violation\n- unused dependency report: exit `0`\n- production audit: `0 vulnerabilities`\n- package: exit `0`\n- VSIX policy: `3,679,421 bytes / 1,904 entries`\n- `git diff --check`: exit `0`\n\n## Authoritative GitHub Actions\n\n- verified source head: `{source_head}`\n- `code-consistency-review-scaffold` run `{scaffold_run}`: conclusion `success`\n- `extensions-quality` run `{extensions_run}`: conclusion `success`\n- Linux and Windows `bob-code-consistency-review`: package、VSIX policy、Extension Host smoke まで success\n- Linux and Windows `workflow-register`: Extension Host smoke まで success\n- Linux and Windows `bob-bazaar-review`: Extension Host smoke まで success\n- extension source metrics: success\n\n## Security/privacy checks\n\n- ledger path confinement と symlink containment は fail closed。\n- ledger read は `maxDocumentBytes` で bounded。\n- record/dependency count、hash、path、self dependency、duplicate ID を検証。\n- corrupt/oversize/unsupported ledger は deterministic warning と current observations からの rebuild に fallback。\n- raw source/index/rule-pack/package sentinel は ledger に含まれない。\n- package failure 後も upstream checkpoint の stale package state が残る。\n'''
          (impl / 'bob-evidence-scope-final-artifact-ledger-verification-2026-07-12.md').write_text(verification, encoding='utf-8')

          ci_record = f'''# Bob Evidence Scope Final CI Record\n\nVerified source head: `{source_head}`\n\n## code-consistency-review-scaffold\n\n- run: `{scaffold_run}`\n- conclusion: `success`\n- extension dependency/architecture/source/unused/audit/compile/unit/package/VSIX policy: success\n- scaffold typecheck/unit/smoke: success\n\n## extensions-quality\n\n- run: `{extensions_run}`\n- conclusion: `success`\n- Linux/Windows bob-code-consistency-review: success through Extension Host smoke\n- Linux/Windows workflow-register: success through Extension Host smoke\n- Linux/Windows bob-bazaar-review: success through Extension Host smoke\n- source metrics: success\n\nThis record is authoritative for the source-bearing checkpoint. The subsequent finalization commit changes documentation, checksum evidence, PR metadata, and removes temporary helper workflows only.\n'''
          (impl / 'bob-evidence-scope-final-ci-2026-07-12.md').write_text(ci_record, encoding='utf-8')

          selected_paths = [
              'docs/superpowers/specs/2026-07-12-bob-evidence-scope-phase6-artifact-ledger-design.md',
              'docs/superpowers/plans/2026-07-12-bob-evidence-scope-phase6-artifact-ledger.md',
              'docs/implementation/bob-evidence-scope-final-artifact-ledger-2026-07-12.md',
              'docs/implementation/bob-evidence-scope-final-artifact-ledger-verification-2026-07-12.md',
              'docs/implementation/bob-evidence-scope-final-ci-2026-07-12.md',
              'docs/artifact-metadata-contract-ja.md',
              'extensions/bob-code-consistency-review/docs/evidence-scope-domain-contract-ja.md',
              'extensions/bob-code-consistency-review/src/evidenceScope/artifactLedger.ts',
              'extensions/bob-code-consistency-review/src/evidenceScope/index.ts',
              'extensions/bob-code-consistency-review/src/core/fileSystem.ts',
              'extensions/bob-code-consistency-review/src/core/reviewPackageBuilder.ts',
              'extensions/bob-code-consistency-review/src/core/pipeline.ts',
              'extensions/bob-code-consistency-review/src/core/preprocessTypes.ts',
              'extensions/bob-code-consistency-review/test/artifactLedger.test.js',
          ]
          files = []
          for value in selected_paths:
              path = root / value
              data = path.read_bytes()
              files.append({
                  'path': value,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              'schema_version': 1,
              'artifact': 'bob-evidence-scope-final-artifact-ledger',
              'hash_algorithm': 'sha256',
              'source_commit': source_head,
              'authoritative_ci': {
                  'code_consistency_review_scaffold_run': int(scaffold_run),
                  'extensions_quality_run': int(extensions_run),
              },
              'files': files,
          }
          manifest_path = impl / 'bob-evidence-scope-final-artifact-ledger-manifest.json'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          completion = {
              'schema_version': 1,
              'artifact': 'bob-evidence-scope-final-completion',
              'verified_source_head': source_head,
              'finalizer_trigger': os.environ['FINALIZER_TRIGGER'],
              'pr_number': 72,
              'plans_complete': True,
              'local_test_count': 243,
              'focused_test_count': 11,
              'authoritative_ci': {
                  'code_consistency_review_scaffold': {'run_id': int(scaffold_run), 'conclusion': 'success'},
                  'extensions_quality': {'run_id': int(extensions_run), 'conclusion': 'success'},
              },
              'temporary_helpers_present': False,
          }
          (impl / 'bob-evidence-scope-final-completion-2026-07-12.json').write_text(
              json.dumps(completion, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          unchecked = []
          for plan in sorted(plans.glob('*evidence-scope*.md')):
              for number, line in enumerate(plan.read_text(encoding='utf-8').splitlines(), 1):
                  if '- [ ]' in line:
                      unchecked.append(f'{plan}:{number}:{line}')
          if unchecked:
              raise SystemExit('unchecked plan steps remain:\n' + '\n'.join(unchecked))

          # Verify the generated manifest before committing it.
          for item in manifest['files']:
              data = (root / item['path']).read_bytes()
              if len(data) != item['bytes'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise SystemExit(f"manifest mismatch: {item['path']}")
          PY
          git diff --check

      - name: Remove temporary helper workflows and publish final evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/collect-bob-evidence-scope-final-ci.yml \
            .github/workflows/finalize-bob-evidence-scope.yml \
            .github/workflows/finalize-bob-evidence-scope-v2.yml \
            .github/workflows/finalize-bob-evidence-scope-v4.yml \
            .github/workflows/seal-bob-evidence-scope-final.yml \
            .github/workflows/seal-bob-evidence-scope-final-v2.yml \
            .github/workflows/seal-bob-evidence-scope-final-v3.yml \
            .github/workflows/verify-bob-evidence-scope-final-clean.yml \
            .github/workflows/export-evidence-scope-current.yml \
            .github/workflows/apply-evidence-scope-phase5.yml \
            .github/phase5-code-payload.tar.gz
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize bob evidence scope artifact stale ledger'
          git push origin HEAD:codex/execute-shared-plan-6a53743e

          python - <<'PY'
          import json
          import os
          import urllib.request

          body = '''## Purpose

Complete the `bob-evidence-scope` plan through its final phase.

## Phase 1–4

- deterministic evidence scope and token budgeting
- review pipeline and context-budget artifact integration
- project rule-pack provenance
- repository-wide symbol/reference index consumer and bounded impact expansion

## Phase 5

- immutable Git blob repository-index producer
- source-free file-fragment incremental cache
- deterministic global re-linking
- build-and-consume preprocessing mode

## Final phase — artifact stale ledger

- persistent `.bob-review/artifact-ledger.json`
- repository index, project rule pack, and review-package lineage
- `fresh`, `stale`, and `missing` states with deterministic reasons
- upstream checkpoint before package generation
- final checkpoint after canonical package hashing
- stale state survives failed package rebuilds
- metadata only; no raw source or artifact bodies

## Verification

- focused artifact-ledger suite: **11 passed, 0 failed**
- complete extension suite: **243 passed, 0 failed**
- dependency, architecture, source, unused, production audit, package, VSIX policy: passed
- `code-consistency-review-scaffold` run `29209078322`: **success**
- `extensions-quality` run `29209078319`: **success**
- Linux and Windows `bob-code-consistency-review`, `workflow-register`, and `bob-bazaar-review` passed through Extension Host smoke
- SHA-256 manifest and final completion record committed
- temporary helper workflows removed

The PR remains draft for human review.'''
          payload = json.dumps({
              'title': 'feat: complete bob evidence scope artifact stale ledger',
              'body': body,
          }).encode('utf-8')
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/72",
              data=payload,
              method='PATCH',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'bob-evidence-scope-finalizer',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f'PR update failed: {response.status}')
          PY
