name: agent-rerun-final-quality

on:
  push:
    branches:
      - agent/workflow-automatic-pause-limits-20260712
    paths:
      - ".github/workflows/agent-rerun-final-quality.yml"

permissions:
  actions: write
  contents: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-automatic-pause-limits-20260712
          fetch-depth: 0
      - name: Rerun latest failed extension-quality jobs once
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list \
            --repo katamor1/bob_builtin_analyze \
            --workflow extensions-quality.yml \
            --branch agent/workflow-automatic-pause-limits-20260712 \
            --event pull_request \
            --limit 1 \
            --json databaseId,conclusion \
            --jq '.[0] | select(.conclusion != "success") | .databaseId')
          if [ -n "${run_id:-}" ]; then
            gh run rerun "$run_id" --failed --repo katamor1/bob_builtin_analyze
          fi
      - name: Remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/agent-rerun-final-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-rerun-final-quality.yml
          git commit -m "ci: remove final quality rerun helper"
          git push origin HEAD:agent/workflow-automatic-pause-limits-20260712
