name: agent-fix-automatic-pause-midnight

on:
  push:
    branches:
      - agent/workflow-automatic-pause-limits-20260712
    paths:
      - ".github/workflows/agent-fix-automatic-pause-midnight.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-automatic-pause-limits-20260712
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - name: Add midnight regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("extensions/workflow-register/test/workflowAutomaticPauseEvaluator.test.js")
          text = path.read_text(encoding="utf-8")
          marker = 'test("local time cutoff remains due after midnight once a prior cutoff was crossed"'
          if marker not in text:
              text = text.rstrip() + '''

          test("local time cutoff remains due after midnight once a prior cutoff was crossed", () => {
            const policies = [policy("workflow", { pauseAtLocalTime: "18:00", timezone: "Asia/Tokyo" })]
            const state = run({ createdAt: "2026-07-11T08:00:00.000Z" })

            assert.deepEqual(evaluateAutomaticPause({
              run: state,
              nextStep: agentStep(),
              now: new Date("2026-07-11T16:00:00.000Z"),
              policies
            }), {
              kind: "pauseAtLocalTime",
              source: "workflow",
              limit: { pauseAtLocalTime: "18:00", timezone: "Asia/Tokyo" },
              observed: { localTime: "01:00", timezone: "Asia/Tokyo" }
            })
          })
          '''.replace("          ", "")
              path.write_text(text, encoding="utf-8")
          PY
      - name: Install dependencies
        working-directory: extensions/workflow-register
        run: npm ci --silent
      - name: Verify RED
        id: red
        working-directory: extensions/workflow-register
        shell: bash
        run: |
          npm run compile --silent
          set +e
          node --test test/workflowAutomaticPauseEvaluator.test.js > "$RUNNER_TEMP/midnight-red.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/midnight-red.log"
          if [ "$status" -eq 0 ]; then
            echo "Regression unexpectedly passed before the production fix." >&2
            exit 1
          fi
          grep -q "local time cutoff remains due after midnight" "$RUNNER_TEMP/midnight-red.log"
      - name: Implement timezone-aware date crossing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_value: str, old: str, new: str) -> None:
              path = Path(path_value)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_value}: expected one match, found {count}: {old!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          path = "extensions/workflow-register/src/core/engine/automaticPause.ts"
          replace_once(
              path,
              "    const localTime = localTimeDecision(input.now, policy)\n",
              "    const localTime = localTimeDecision(input.run, input.now, policy)\n"
          )
          replace_once(
              path,
              "function localTimeDecision(now: Date, policy: AutomaticPausePolicySource): AutomaticPauseDecision | undefined {\n",
              "function localTimeDecision(run: WorkflowRunState, now: Date, policy: AutomaticPausePolicySource): AutomaticPauseDecision | undefined {\n"
          )
          replace_once(
              path,
              '''  const localTime = formatLocalTime(now, timezone)
  if (minutesSinceMidnight(localTime) < minutesSinceMidnight(pauseAtLocalTime)) return undefined
''',
              '''  const runCreatedAt = new Date(run.createdAt)
  if (!Number.isFinite(runCreatedAt.getTime())) return undefined
  const localDate = formatLocalDate(now, timezone)
  const runLocalDate = formatLocalDate(runCreatedAt, timezone)
  const cutoffReached = localDate > runLocalDate || (
    localDate === runLocalDate
    && minutesSinceMidnight(formatLocalTime(now, timezone)) >= minutesSinceMidnight(pauseAtLocalTime)
  )
  if (!cutoffReached) return undefined
  const localTime = formatLocalTime(now, timezone)
'''
          )
          helper = '''function formatLocalDate(value: Date, timezone: string): string {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: timezone,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(value)
  const year = parts.find((part) => part.type === "year")?.value ?? "0000"
  const month = parts.find((part) => part.type === "month")?.value ?? "00"
  const day = parts.find((part) => part.type === "day")?.value ?? "00"
  return `${year}-${month}-${day}`
}

'''
          replace_once(path, "function formatLocalTime(now: Date, timezone: string): string {\n", helper + "function formatLocalTime(now: Date, timezone: string): string {\n")
          PY
      - name: Verify GREEN and full suite
        working-directory: extensions/workflow-register
        run: |
          npm run compile --silent
          node --test test/workflowAutomaticPauseEvaluator.test.js test/workflowAutomaticPauseEngine.test.js
          npm run architecture:policy --silent
          npm run source:policy --silent
          npm test
          npm run package --silent
          npm run package:policy --silent
      - name: Commit regression fix
        shell: bash
        run: |
          rm .github/workflows/agent-fix-automatic-pause-midnight.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep automatic pause due across midnight"
          git push origin HEAD:agent/workflow-automatic-pause-limits-20260712
