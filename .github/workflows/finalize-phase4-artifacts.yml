name: Finalize phase 4 artifacts

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Install finalized artifacts
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/phase4-docs.b64" <<'PAYLOAD'
[... PAYLOAD REDACTED FOR BREVITY IN SUMMARY ...]
PAYLOAD
          base64 -d "$RUNNER_TEMP/phase4-docs.b64" > "$RUNNER_TEMP/phase4-docs.tar.gz"
          tar -xzf "$RUNNER_TEMP/phase4-docs.tar.gz"

      - name: Remove temporary diagnostics and commit artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-phase4-workspace.yml
          rm -rf docs/implementation/diagnostics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            docs/superpowers/specs/2026-07-12-bob-evidence-scope-phase4-design.md \
            docs/superpowers/plans/2026-07-12-bob-evidence-scope-phase4.md \
            docs/implementation/bob-evidence-scope-phase4-2026-07-12.md \
            docs/implementation/bob-evidence-scope-phase4-verification-2026-07-12.md \
            docs/implementation/bob-evidence-scope-phase4-manifest.json \
            extensions/bob-code-consistency-review/docs/evidence-scope-domain-contract-ja.md \
            .github/workflows/export-phase4-workspace.yml \
            docs/implementation/diagnostics
          git commit -m 'docs: finalize bob evidence scope phase 4 artifacts'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
