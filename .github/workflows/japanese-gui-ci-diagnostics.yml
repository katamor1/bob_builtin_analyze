name: Apply Japanese GUI validation fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .sdd/diagnostics/japanese-gui

permissions:
  contents: write

concurrency:
  group: japanese-gui-validation-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'katamor1/bob_builtin_analyze' &&
      github.event.pull_request.number == 132 &&
      github.event.pull_request.user.login == 'katamor1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/japanese-gui-copy-review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply bounded display-contract fixes and remove diagnostics
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = 'agent/japanese-gui-copy-review'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$HEAD_BRANCH"
          test "$(git rev-parse "origin/$HEAD_BRANCH")" = "$EXPECTED_HEAD"

          python - <<'PY'
          from pathlib import Path

          package = Path('extensions/workflow-register/package.json')
          package_text = package.read_text(encoding='utf-8')
          old_category = '"category": "Bob ワークフロー"'
          new_category = '"category": "Bob Workflow"'
          if package_text.count(old_category) != 58:
              raise SystemExit(f'Expected 58 localized workflow command categories, found {package_text.count(old_category)}')
          if new_category in package_text:
              raise SystemExit('English workflow command category unexpectedly already present')
          package.write_text(package_text.replace(old_category, new_category), encoding='utf-8')

          smoke = Path('scripts/triage-integrity-extension-host.test.js')
          smoke_text = smoke.read_text(encoding='utf-8')
          old_label = 'const HUMAN_TRIAGE_TAB_LABEL = "Code Consistency Human Triage"'
          new_label = 'const HUMAN_TRIAGE_TAB_LABEL = "指摘・確認事項の判定"'
          if smoke_text.count(old_label) != 1 or new_label in smoke_text:
              raise SystemExit('Human Triage tab-label contract changed unexpectedly')
          smoke.write_text(smoke_text.replace(old_label, new_label, 1), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/japanese-gui-ci-diagnostics.yml .sdd/diagnostics/japanese-gui
          git add extensions/workflow-register/package.json scripts/triage-integrity-extension-host.test.js
          git diff --cached --check
          git commit -m 'fix: align Japanese GUI display contracts with validation'
          git push origin "HEAD:$HEAD_BRANCH"
