name: Verify final Bob evidence scope cleanup

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e
    paths:
      - .github/workflows/verify-bob-evidence-scope-final-clean.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Verify evidence, checksums, plans, CI, and PR state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: '72'
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          root = Path('.')
          required = [
              root / 'docs/implementation/bob-evidence-scope-phase5-verification-2026-07-12.md',
              root / 'docs/implementation/bob-evidence-scope-final-artifact-ledger-2026-07-12.md',
              root / 'docs/implementation/bob-evidence-scope-final-artifact-ledger-verification-2026-07-12.md',
              root / 'docs/implementation/bob-evidence-scope-final-artifact-ledger-manifest.json',
              root / 'docs/implementation/bob-evidence-scope-final-ci-2026-07-12.md',
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing final evidence: {missing}')

          manifest_path = root / 'docs/implementation/bob-evidence-scope-final-artifact-ledger-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('schema_version') != 1 or manifest.get('hash_algorithm') != 'sha256':
              raise SystemExit('invalid final artifact manifest header')
          failures = []
          for item in manifest.get('files', []):
              path = root / item['path']
              if not path.is_file():
                  failures.append(f"missing:{item['path']}")
                  continue
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if len(data) != item['bytes'] or digest != item['sha256']:
                  failures.append(f"mismatch:{item['path']}")
          if failures:
              raise SystemExit(f'manifest verification failed: {failures}')

          relevant_plans = sorted((root / 'docs/superpowers/plans').glob('*evidence-scope*.md'))
          unchecked = []
          for path in relevant_plans:
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if '- [ ]' in line:
                      unchecked.append(f'{path.as_posix()}:{number}:{line.strip()}')
          if unchecked:
              raise SystemExit('unchecked evidence-scope plan steps:\n' + '\n'.join(unchecked))

          ci_text = (root / 'docs/implementation/bob-evidence-scope-final-ci-2026-07-12.md').read_text(encoding='utf-8')
          if ci_text.count('conclusion: `success`') < 2:
              raise SystemExit('final CI record does not contain two successful authoritative workflows')
          if re.search(r': `(failure|cancelled|action_required|timed_out|skipped|neutral|stale)`', ci_text):
              raise SystemExit('final CI record contains a non-success job or workflow')

          helper_names = {
              'collect-bob-evidence-scope-final-ci.yml',
              'finalize-bob-evidence-scope.yml',
              'finalize-bob-evidence-scope-v2.yml',
              'export-evidence-scope-current.yml',
              'apply-evidence-scope-phase5.yml',
          }
          present_helpers = [name for name in helper_names if (root / '.github/workflows' / name).exists()]
          if present_helpers:
              raise SystemExit(f'superseded helper workflows remain: {present_helpers}')
          if (root / '.github/phase5-code-payload.tar.gz').exists():
              raise SystemExit('temporary Phase 5 payload remains')

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          pr_number = os.environ['PR_NUMBER']
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/pulls/{pr_number}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'bob-evidence-scope-cleanup-verifier',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pr = json.load(response)
          if pr.get('state') != 'open' or not pr.get('draft'):
              raise SystemExit(f"PR must remain open and draft: state={pr.get('state')} draft={pr.get('draft')}")
          if 'artifact stale ledger' not in pr.get('title', '').lower():
              raise SystemExit(f"PR title is not synchronized: {pr.get('title')}")
          body = pr.get('body') or ''
          for phrase in ('Phase 5', 'Final phase', 'code-consistency-review-scaffold', 'extensions-quality'):
              if phrase not in body:
                  raise SystemExit(f'PR body missing final marker: {phrase}')

          completion = {
              'schema_version': 1,
              'artifact': 'bob-evidence-scope-final-completion',
              'verified_branch_head': os.environ['SOURCE_SHA'],
              'manifest_source_commit': manifest.get('source_commit'),
              'manifest_file_count': len(manifest.get('files', [])),
              'authoritative_ci_record': 'docs/implementation/bob-evidence-scope-final-ci-2026-07-12.md',
              'pr_number': 72,
              'pr_state': pr.get('state'),
              'pr_draft': pr.get('draft'),
              'temporary_helpers_present': False,
              'unchecked_plan_steps': 0,
              'manifest_verification': 'passed',
          }
          Path('docs/implementation/bob-evidence-scope-final-completion-2026-07-12.json').write_text(
              json.dumps(completion, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Remove verifier and commit completion record
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-bob-evidence-scope-final-clean.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/implementation .github/workflows
          git commit -m 'docs: record bob evidence scope final completion'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
