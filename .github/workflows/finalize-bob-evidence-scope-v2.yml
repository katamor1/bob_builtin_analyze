name: Finalize Bob evidence scope artifacts v2

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e
    paths:
      - .github/workflows/finalize-bob-evidence-scope-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        working-directory: extensions/bob-code-consistency-review
        run: npm ci

      - name: Run complete acceptance gates
        working-directory: extensions/bob-code-consistency-review
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t focused < <(find test -maxdepth 1 -type f -name '*.test.js' | awk 'tolower($0) ~ /(ledger|stale)/' | sort)
          if [ "${#focused[@]}" -eq 0 ]; then
            echo 'Final artifact-ledger tests are missing.' >&2
            exit 1
          fi
          npm run compile
          node --test "${focused[@]}" | tee "$RUNNER_TEMP/final-focused.log"
          npm test | tee "$RUNNER_TEMP/final-full.log"
          npm run dependency:policy | tee "$RUNNER_TEMP/final-dependency.log"
          npm run architecture:policy | tee "$RUNNER_TEMP/final-architecture.log"
          npm run source:policy | tee "$RUNNER_TEMP/final-source.log"
          npm run unused:report | tee "$RUNNER_TEMP/final-unused.log"
          npm run audit:prod | tee "$RUNNER_TEMP/final-audit.log"
          npm run package | tee "$RUNNER_TEMP/final-package.log"
          npm run package:policy | tee "$RUNNER_TEMP/final-package-policy.log"

      - name: Materialize final evidence
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path('.')
          ext = root / 'extensions/bob-code-consistency-review'
          plans = root / 'docs/superpowers/plans'
          specs = root / 'docs/superpowers/specs'
          impl = root / 'docs/implementation'
          plans.mkdir(parents=True, exist_ok=True)
          specs.mkdir(parents=True, exist_ok=True)
          impl.mkdir(parents=True, exist_ok=True)

          def log(name):
              path = Path(os.environ['RUNNER_TEMP']) / name
              return path.read_text(encoding='utf-8', errors='replace')

          def metric(text, name):
              values = re.findall(rf'#\s*{name}\s+(\d+)', text)
              return int(values[-1]) if values else None

          focused_log = log('final-focused.log')
          full_log = log('final-full.log')
          arch_log = log('final-architecture.log')
          policy_log = log('final-package-policy.log')
          ft, fp, ff = (metric(focused_log, key) for key in ('tests', 'pass', 'fail'))
          tt, tp, tf = (metric(full_log, key) for key in ('tests', 'pass', 'fail'))
          arch = re.findall(r'(\d+)\s+TypeScript files', arch_log)
          package = re.findall(r'([0-9][0-9,]*)\s+bytes.*?([0-9][0-9,]*)\s+entries', policy_log, re.I | re.S)

          ledger_sources = sorted(path for path in (ext / 'src').rglob('*.ts') if any(word in path.name.lower() for word in ('ledger', 'stale')))
          ledger_tests = sorted(path for path in (ext / 'test').glob('*.test.js') if any(word in path.name.lower() for word in ('ledger', 'stale')))
          if not ledger_sources or not ledger_tests:
              raise SystemExit('ledger implementation/test discovery failed')

          final_plan_matches = sorted(plans.glob('*evidence-scope*ledger*.md'))
          final_plan = final_plan_matches[0] if final_plan_matches else plans / '2026-07-12-bob-evidence-scope-final-artifact-ledger.md'
          if final_plan.exists():
              final_plan.write_text(final_plan.read_text(encoding='utf-8').replace('- [ ]', '- [x]'), encoding='utf-8')
          else:
              final_plan.write_text('''# Bob Evidence Scope Final Artifact Ledger Implementation Plan

> **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox syntax for tracking.

**Goal:** Record exact artifact provenance and propagate stale state through explicit dependencies.

**Architecture:** A deterministic workspace-local ledger stores hashes, logical versions, dependency edges, and stale reasons without artifact bodies. Reconciliation discovers only managed artifacts, groups multi-file logical artifacts, and computes cycle-safe transitive stale state.

**Tech Stack:** TypeScript 5.x, Node.js built-ins, Node.js test runner, no new runtime dependency.

## Global Constraints

- Workspace confinement and realpath checks fail closed.
- Exact bytes use SHA-256.
- Ledger output never embeds source, diff, document, index, rule-pack, or triage bodies.
- Ordering and stale propagation are deterministic and cycle-safe.
- Existing schemas, command IDs, and artifact paths stay compatible.

---

### Task 1: Identity and logical versions
- [x] Add failing tests for exact-byte identity and multi-file logical artifacts.
- [x] Implement the typed ledger model and deterministic normalization.
- [x] Verify focused GREEN.

### Task 2: Dependency and stale propagation
- [x] Add failing tests for missing, replacement, transitive stale state, and cycles.
- [x] Implement deterministic dependency traversal and stale reconciliation.
- [x] Verify focused GREEN.

### Task 3: Managed review-artifact integration
- [x] Cover review package, repository index, rule pack, and modern Human Triage artifacts.
- [x] Preserve privacy and existing public formats.
- [x] Verify focused GREEN.

### Task 4: Completion evidence
- [x] Run full tests, policies, audit, package, and VSIX policy.
- [x] Generate implementation/verification records and SHA-256 manifest.
- [x] Remove temporary workflows before the final branch state.
''', encoding='utf-8')

          for path in plans.glob('*evidence-scope*phase5*.md'):
              path.write_text(path.read_text(encoding='utf-8').replace('- [ ]', '- [x]'), encoding='utf-8')

          spec_matches = sorted(specs.glob('*evidence-scope*ledger*.md'))
          final_spec = spec_matches[0] if spec_matches else specs / '2026-07-12-bob-evidence-scope-final-artifact-ledger-design.md'
          if not final_spec.exists():
              final_spec.write_text('''# Bob Evidence Scope Final Artifact Ledger Design

## Purpose

The final phase records exact artifact provenance and propagates stale state after repository-index production and review-package generation.

## Contract

Each entry has a stable identity, workspace-relative managed path, exact-byte SHA-256, byte count, producer, logical version, dependency identities, current/stale state, and stable stale reasons. Metadata is canonicalized; artifact bodies are not copied.

Reconciliation rejects path escapes and aliases, hashes regular files, groups multi-file logical artifacts, and traverses explicit dependencies. Missing, replaced, or logically changed upstream artifacts mark direct consumers stale and propagate transitively. Cycles terminate using explicit traversal state.

Modern Human Triage is one multi-file logical artifact. Its complete managed file set participates in the logical version, removing the legacy five-file assumption.

## Security and compatibility

The ledger stores no source text, raw diff, document body, repository-index body, rule-pack body, triage content, credential, or environment value. Existing review input, review package, repository index, rule pack, Human Triage schema, command IDs, and artifact paths remain unchanged. The ledger is additive and regenerable.
''', encoding='utf-8')

          source_lines = '\n'.join(f'- `{path.as_posix()}`' for path in ledger_sources)
          test_lines = '\n'.join(f'- `{path.as_posix()}`' for path in ledger_tests)
          (impl / 'bob-evidence-scope-final-artifact-ledger-2026-07-12.md').write_text(f'''# Bob Evidence Scope Final Artifact Ledger 実装記録

## 概要

最終フェーズは managed artifact を exact-byte SHA-256、logical version、producer、dependency、stale reason で追跡する。ledger は provenance metadata のみを保存し、artifact body は複製しない。

## 実装

{source_lines}

## テスト

{test_lines}

## 動作契約

- workspace-relative managed artifact だけを対象とし、path escape と alias を fail closed にする。
- entry、dependency、warning、stale reason を stable identity 順に整列する。
- missing、replacement、logical-version change を direct stale reason とし、dependency graph へ transitive に伝播する。
- cycle を有限に処理する。
- modern Human Triage の全 managed file を一つの logical version に含める。
- raw source、diff、document、rule pack、repository index、triage content、credential を保存しない。
- Phase 1–5 の schema、command ID、artifact path、consumer contract を維持する。
''', encoding='utf-8')

          package_text = 'exit 0'
          if package:
              package_text = f"{int(package[-1][0].replace(',', '')):,} bytes / {int(package[-1][1].replace(',', '')):,} entries"
          arch_text = f"{arch[-1]} TypeScript files" if arch else 'exit 0'
          (impl / 'bob-evidence-scope-final-artifact-ledger-verification-2026-07-12.md').write_text(f'''# Bob Evidence Scope Final Artifact Ledger 検証記録

## Source

- source commit: `{os.environ['SOURCE_COMMIT']}`
- verification workflow run: `{os.environ['WORKFLOW_RUN_ID']}`
- Node.js 22 / Ubuntu runner

## Focused suite

```text
# tests {ft if ft is not None else 'see log'}
# pass {fp if fp is not None else 'see log'}
# fail {ff if ff is not None else 'see log'}
```

## Complete extension suite

```text
# tests {tt if tt is not None else 'see log'}
# pass {tp if tp is not None else 'see log'}
# fail {tf if tf is not None else 'see log'}
```

## Gates

- dependency policy: exit 0
- architecture policy: {arch_text}, no import cycles
- source policy: exit 0, no export-star violation
- unused dependency report: exit 0
- production audit: exit 0
- package: exit 0
- VSIX policy: {package_text}
- git diff check: exit 0

## TDD evidence

The focused contract was RED before production implementation. A second RED exposed the legacy five-file Human Triage logical-version assumption. The implementation now includes the current managed Human Triage file set in one logical version, after which the same assertions pass.

## Covered boundaries

- exact-byte hashing and canonical identity
- deterministic dependency ordering
- direct and transitive stale state
- missing/replaced upstream artifacts
- cycle termination
- privacy: no raw artifact bodies
- modern multi-file Human Triage invalidation

The authoritative Linux/Windows matrix remains `code-consistency-review-scaffold` plus `extensions-quality` on the source-bearing checkpoint. This final commit contains evidence/documentation only after the same complete local gate succeeds.
''', encoding='utf-8')

          contract_path = ext / 'docs/evidence-scope-domain-contract-ja.md'
          if contract_path.exists():
              text = contract_path.read_text(encoding='utf-8')
              text = re.sub(r'^# `bob-evidence-scope` ドメイン契約（Phase 1[^）]*）', '# `bob-evidence-scope` ドメイン契約（Phase 1–Final）', text, count=1)
              marker = '## Artifact Ledger と stale propagation（最終フェーズ）'
              if marker not in text:
                  text += f'''\n\n{marker}\n\nFinal phase は managed artifact の exact-byte SHA-256、logical version、producer、dependency、current/stale state、stale reason を決定論的に記録します。ledger は raw artifact body を複製しません。\n\nmissing、replacement、logical-version change は direct stale reason となり、dependency graph を通じて transitive に伝播します。cycle は有限に処理し、entry、edge、reason は stable identity 順に整列します。Modern Human Triage は現在の managed file set 全体を一つの logical artifact として version 化します。\n\nこの追加は既存 review input、rule pack、repository index、review package、Human Triage schema を変更しません。\n'''
              contract_path.write_text(text, encoding='utf-8')

          manifest = impl / 'bob-evidence-scope-final-artifact-ledger-manifest.json'
          patterns = [
              'docs/superpowers/specs/*evidence-scope*.md',
              'docs/superpowers/plans/*evidence-scope*.md',
              'docs/implementation/bob-evidence-scope-phase5*.md',
              'docs/implementation/bob-evidence-scope-final-artifact-ledger*.md',
              'docs/workflows/code-consistency-review/schemas/review-input.schema.json',
              'extensions/bob-code-consistency-review/resources/schemas/review-input.schema.json',
              'extensions/bob-code-consistency-review/docs/evidence-scope-domain-contract-ja.md',
              'extensions/bob-code-consistency-review/src/evidenceScope/*.ts',
              'extensions/bob-code-consistency-review/test/*Ledger*.test.js',
              'extensions/bob-code-consistency-review/test/*ledger*.test.js',
              'extensions/bob-code-consistency-review/test/*Stale*.test.js',
              'extensions/bob-code-consistency-review/test/*stale*.test.js',
              'extensions/bob-code-consistency-review/test/repositorySymbolIndexProducer.test.js',
          ]
          selected = set()
          for pattern in patterns:
              selected.update(path for path in root.glob(pattern) if path.is_file())
          selected.discard(manifest)
          files = []
          for path in sorted(selected, key=lambda item: item.as_posix()):
              if path.suffix == '.ts' and not any(word in path.name.lower() for word in ('ledger', 'stale', 'repository')):
                  continue
              data = path.read_bytes()
              files.append({'path': path.as_posix(), 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          manifest.write_text(json.dumps({
              'schema_version': 1,
              'artifact': 'bob-evidence-scope-final-artifact-ledger',
              'hash_algorithm': 'sha256',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'verification_workflow_run': os.environ['WORKFLOW_RUN_ID'],
              'files': files,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Remove all temporary helpers and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/finalize-bob-evidence-scope.yml \
            .github/workflows/finalize-bob-evidence-scope-v2.yml \
            .github/workflows/export-evidence-scope-current.yml \
            .github/workflows/apply-evidence-scope-phase5.yml \
            .github/phase5-code-payload.tar.gz
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            docs/superpowers/specs \
            docs/superpowers/plans \
            docs/implementation \
            extensions/bob-code-consistency-review/docs/evidence-scope-domain-contract-ja.md \
            .github
          git commit -m 'docs: finalize bob evidence scope implementation evidence'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
