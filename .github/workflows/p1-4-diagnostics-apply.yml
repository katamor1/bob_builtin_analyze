name: p1-4-diagnostics-apply

on:
  pull_request:
    paths:
      - ".github/workflows/p1-4-diagnostics-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply held recovery diagnostics projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          provenance_path = Path("extensions/workflow-register/src/core/runProvenance.ts")
          provenance = provenance_path.read_text(encoding="utf-8")
          import_anchor = 'import type { RunStepState, WorkflowRunState } from "./model"\n'
          import_line = 'import { HELD_RECOVERY_STATE_KEY } from "./heldRunRecovery"\n'
          if import_line not in provenance:
              assert import_anchor in provenance
              provenance = provenance.replace(import_anchor, import_line + import_anchor, 1)
          interface_anchor = '''export interface WorkflowRunProvenanceProjection {\n'''
          held_interface = '''export interface WorkflowHeldRecoveryProjection {\n  kind: "saved-state"\n  runId: string\n  stepId: string\n  nextStepId?: string\n  recoveredAt: string\n  source: "operation-hub"\n}\n\n'''
          if 'export interface WorkflowHeldRecoveryProjection' not in provenance:
              assert interface_anchor in provenance
              provenance = provenance.replace(interface_anchor, held_interface + interface_anchor, 1)
          provenance = provenance.replace('  taskSnapshotImportedAt?: string\n  steps: WorkflowStepProvenanceProjection[]\n', '  taskSnapshotImportedAt?: string\n  heldRecovery?: WorkflowHeldRecoveryProjection\n  steps: WorkflowStepProvenanceProjection[]\n', 1)
          projection_anchor = '''  const taskSnapshotImport = parseTaskSnapshotImport(run.state[TASK_SNAPSHOT_IMPORT_STATE_KEY])\n'''
          projection_line = '''  const heldRecovery = parseHeldRecovery(run.state[HELD_RECOVERY_STATE_KEY], run.runId)\n'''
          if projection_line not in provenance:
              assert projection_anchor in provenance
              provenance = provenance.replace(projection_anchor, projection_anchor + projection_line, 1)
          provenance = provenance.replace('    taskSnapshotImportedAt: taskSnapshotImport?.importedAt,\n    steps: run.steps.map((step) => {\n', '    taskSnapshotImportedAt: taskSnapshotImport?.importedAt,\n    heldRecovery,\n    steps: run.steps.map((step) => {\n', 1)
          parser_anchor = 'function parseRecord(value: unknown): Record<string, unknown> | undefined {\n'
          parser = '''function parseHeldRecovery(value: unknown, expectedRunId: string): WorkflowHeldRecoveryProjection | undefined {\n  const record = parseRecord(value)\n  if (!record) return undefined\n  if (record.schemaVersion !== "workflow-register/held-recovery/v1") return undefined\n  if (record.kind !== "saved-state" || record.source !== "operation-hub") return undefined\n  const runId = optionalString(record.runId)\n  const stepId = optionalString(record.stepId)\n  const nextStepId = optionalString(record.nextStepId)\n  const recoveredAt = optionalString(record.recoveredAt)\n  if (!runId || runId !== expectedRunId || !stepId || !recoveredAt) return undefined\n  return {\n    kind: "saved-state",\n    runId,\n    stepId,\n    nextStepId,\n    recoveredAt,\n    source: "operation-hub"\n  }\n}\n\n'''
          if 'function parseHeldRecovery' not in provenance:
              assert parser_anchor in provenance
              provenance = provenance.replace(parser_anchor, parser + parser_anchor, 1)
          provenance_path.write_text(provenance, encoding="utf-8")

          diagnostics_path = Path("extensions/workflow-register/src/core/runDiagnostics.ts")
          diagnostics = diagnostics_path.read_text(encoding="utf-8")
          has_anchor = '''    || provenance.taskSnapshotImportCount > 0\n    || provenance.definitionMismatchAllowed\n'''
          has_text = '''    || provenance.taskSnapshotImportCount > 0\n    || provenance.heldRecovery\n    || provenance.definitionMismatchAllowed\n'''
          assert has_anchor in diagnostics
          diagnostics = diagnostics.replace(has_anchor, has_text, 1)
          lines_anchor = '''  if (provenance.taskSnapshotImportCount > 0) {\n    lines.push(`- imported from task snapshot: ${provenance.taskSnapshotImportCount} artifact(s)${provenance.taskSnapshotImportedAt ? ` at ${provenance.taskSnapshotImportedAt}` : ""}`)\n  }\n  lines.push(`- definition mismatch allowed: ${provenance.definitionMismatchAllowed ? "yes" : "no"}`)\n'''
          lines_text = '''  if (provenance.taskSnapshotImportCount > 0) {\n    lines.push(`- imported from task snapshot: ${provenance.taskSnapshotImportCount} artifact(s)${provenance.taskSnapshotImportedAt ? ` at ${provenance.taskSnapshotImportedAt}` : ""}`)\n  }\n  if (provenance.heldRecovery) {\n    lines.push(\n      "",\n      "Held run recovery:",\n      `- kind: ${provenance.heldRecovery.kind}`,\n      `- step: ${provenance.heldRecovery.stepId}`,\n      `- next step: ${provenance.heldRecovery.nextStepId ?? "workflow completion"}`,\n      `- recovered: ${provenance.heldRecovery.recoveredAt}`,\n      `- source: ${provenance.heldRecovery.source}`\n    )\n  }\n  lines.push(`- definition mismatch allowed: ${provenance.definitionMismatchAllowed ? "yes" : "no"}`)\n'''
          assert lines_anchor in diagnostics
          diagnostics = diagnostics.replace(lines_anchor, lines_text, 1)
          diagnostics_path.write_text(diagnostics, encoding="utf-8")
          PY

      - name: Verify focused contracts
        id: focused
        working-directory: extensions/workflow-register
        shell: bash
        run: |
          set +e
          npm ci --silent > "$RUNNER_TEMP/p1-4-diagnostics.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then npm run compile --silent >> "$RUNNER_TEMP/p1-4-diagnostics.log" 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then
            node --test \
              test/heldRecoveryDiagnostics.test.js \
              test/workflowRunProvenance.test.js \
              test/workflowRunProvenanceDiagnostics.test.js \
              test/workflowRunDiagnostics.test.js \
              test/detachedHeldRecoveryCommand.test.js >> "$RUNNER_TEMP/p1-4-diagnostics.log" 2>&1
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            grep -n -B 35 -A 120 -E "not ok|AssertionError|error TS|Error:" "$RUNNER_TEMP/p1-4-diagnostics.log" || tail -n 220 "$RUNNER_TEMP/p1-4-diagnostics.log"
          else
            tail -n 35 "$RUNNER_TEMP/p1-4-diagnostics.log"
          fi
          exit "$status"

      - name: Upload focused failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p1-4-diagnostics-focused-log
          path: ${{ runner.temp }}/p1-4-diagnostics.log
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified implementation
        if: success()
        shell: bash
        run: |
          rm .github/workflows/p1-4-diagnostics-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: diagnose detached held recovery provenance"
          git push origin HEAD:${{ github.head_ref }}
