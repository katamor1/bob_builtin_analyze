name: workflow-builder-skip-resume-task3-panel

on:
  pull_request:
    paths:
      - ".github/workflows/workflow-builder-skip-resume-task3-panel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-builder-skip-resume-readiness-20260712
          fetch-depth: 0
      - name: Wire host preview and apply messages
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'extensions/workflow-register/src/webview/workflowBuilderPanel.ts'
          let source = fs.readFileSync(file, 'utf8')
          function replaceExactly(before, after) {
            const count = source.split(before).length - 1
            if (count !== 1) throw new Error(`expected one match, got ${count}: ${before.slice(0, 80)}`)
            source = source.replace(before, after)
          }

          replaceExactly(
            'import { WorkflowAuthoringModel, WorkflowAuthoringStep } from "../core/workflowAuthoringModel"\nimport { serializeAuthoringModelToMarkdown } from "../core/workflowAuthoringSerializer"',
            'import { WorkflowAuthoringModel, WorkflowAuthoringStep } from "../core/workflowAuthoringModel"\nimport { serializeAuthoringModelToMarkdown } from "../core/workflowAuthoringSerializer"\nimport {\n  applySkipResumeReadiness,\n  buildSkipResumeReadinessPreview,\n  SkipResumeReadinessPreview\n} from "../core/authoring/workflowSkipResumeReadinessPreview"'
          )

          replaceExactly(
            '  | { type: "diff"; model: WorkflowAuthoringModel }\n  | { type: "validateStepDraft"; model: WorkflowAuthoringModel; draftStep: WorkflowAuthoringStep; stepIndex: number }',
            '  | { type: "diff"; model: WorkflowAuthoringModel }\n  | { type: "previewSkipResumeReadiness"; model: WorkflowAuthoringModel; selectedStepIds?: string[] }\n  | { type: "applySkipResumeReadiness"; model: WorkflowAuthoringModel; selectedStepIds: string[] }\n  | { type: "validateStepDraft"; model: WorkflowAuthoringModel; draftStep: WorkflowAuthoringStep; stepIndex: number }'
          )

          replaceExactly(
            '    if (message.type === "preview") return this.preview(message.model)\n    if (message.type === "diff") return this.showDiff(message.model)',
            '    if (message.type === "preview") return this.preview(message.model)\n    if (message.type === "previewSkipResumeReadiness") return this.previewSkipResumeReadiness(message.model, message.selectedStepIds)\n    if (message.type === "applySkipResumeReadiness") return this.applySkipResumeReadiness(message.model, message.selectedStepIds)\n    if (message.type === "diff") return this.showDiff(message.model)'
          )

          replaceExactly(
            '  private async preview(model: WorkflowAuthoringModel): Promise<void> {',
            `  private async previewSkipResumeReadiness(model: WorkflowAuthoringModel, selectedStepIds?: string[]): Promise<void> {\n    const preview = buildSkipResumeReadinessPreview(model, selectedStepIds, { sourceId: this.options.sourceId })\n    await this.panel.webview.postMessage({\n      type: "skipResumeReadinessPreviewResult",\n      ...this.skipResumeReadinessPreviewPayload(preview)\n    })\n  }\n\n  private async applySkipResumeReadiness(model: WorkflowAuthoringModel, selectedStepIds: string[]): Promise<void> {\n    const result = applySkipResumeReadiness(model, selectedStepIds, { sourceId: this.options.sourceId })\n    if (!result.ok || !result.model) {\n      await this.panel.webview.postMessage({\n        type: "skipResumeReadinessPreviewResult",\n        ...this.skipResumeReadinessPreviewPayload(result)\n      })\n      return\n    }\n    await this.panel.webview.postMessage({\n      type: "skipResumeReadinessApplied",\n      model: result.model,\n      preview: this.skipResumeReadinessPreviewPayload(result)\n    })\n  }\n\n  private skipResumeReadinessPreviewPayload(preview: SkipResumeReadinessPreview): Record<string, unknown> {\n    return {\n      ok: preview.ok,\n      candidates: preview.candidates,\n      blockingIssues: preview.blockingIssues,\n      changes: preview.changes,\n      selectedStepIds: preview.selectedStepIds,\n      beforeMarkdown: preview.beforeMarkdown,\n      afterMarkdown: preview.afterMarkdown,\n      diagnostics: formatWorkflowDiagnostics({ ok: preview.ok, diagnostics: preview.diagnostics }),\n      filePath: preview.filePath\n    }\n  }\n\n  private async preview(model: WorkflowAuthoringModel): Promise<void> {`
          )

          fs.writeFileSync(file, source, 'utf8')
          NODE
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/workflow-register/package-lock.json
      - name: Install dependencies
        working-directory: extensions/workflow-register
        run: npm ci
      - name: Verify host boundary GREEN
        working-directory: extensions/workflow-register
        run: |
          npm run compile
          node --test \
            test/workflowSkipResumeAuthoringRoundTrip.test.js \
            test/workflowSkipResumeReadiness.test.js \
            test/workflowSkipResumeReadinessPreview.test.js
      - name: Remove executor and commit verified host wiring
        shell: bash
        run: |
          rm .github/workflows/workflow-builder-skip-resume-task3-panel.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/workflow-builder-skip-resume-task3-panel.yml \
            extensions/workflow-register/src/webview/workflowBuilderPanel.ts
          git commit -m "feat: preview and apply skip resume readiness"
          git push origin HEAD:agent/workflow-builder-skip-resume-readiness-20260712
