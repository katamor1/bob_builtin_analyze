name: bob-bazaar-review-iteration3-workspace

on:
  push:
    branches:
      - agent/bob-bazaar-review-review-run-v3-iteration3
    paths:
      - ".github/workflows/bob-bazaar-review-iteration3-workspace.yml"
  pull_request:
    paths:
      - ".github/workflows/bob-bazaar-review-iteration3-workspace.yml"

permissions:
  contents: read

jobs:
  prepare-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-bazaar-review/package-lock.json
      - name: Install dependencies
        working-directory: extensions/bob-bazaar-review
        run: npm ci
      - name: Pack implementation workspace
        shell: bash
        run: tar -czf /tmp/bob-bazaar-review-iteration3-workspace.tgz extensions/bob-bazaar-review docs/superpowers/specs docs/superpowers/plans
      - name: Upload implementation workspace
        uses: actions/upload-artifact@v4
        with:
          name: bob-bazaar-review-iteration3-workspace
          path: /tmp/bob-bazaar-review-iteration3-workspace.tgz
          if-no-files-found: error
