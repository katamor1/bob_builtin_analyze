name: bob-bazaar-review-iteration3-workspace

on:
  push:
    branches:
      - agent/bob-bazaar-review-review-run-v3-iteration3
    paths:
      - ".github/workflows/bob-bazaar-review-iteration3-workspace.yml"
      - ".github/patches/bob-bazaar-review-iteration3.patch.gz.b64.part*"
  pull_request:
    paths:
      - ".github/workflows/bob-bazaar-review-iteration3-workspace.yml"
      - ".github/patches/bob-bazaar-review-iteration3.patch.gz.b64.part*"
      - "extensions/bob-bazaar-review/**"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: agent/bob-bazaar-review-review-run-v3-iteration3
          fetch-depth: 0

      - name: Reconstruct and apply verified dashboard patch
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          cat .github/patches/bob-bazaar-review-iteration3.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/bob-bazaar-review-iteration3.patch
          echo "6f966afb80362d1c0b05bbf637c718ecd76681b565352527cb9661ed1563520f  /tmp/bob-bazaar-review-iteration3.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/bob-bazaar-review-iteration3.patch
          git apply /tmp/bob-bazaar-review-iteration3.patch

      - name: Commit and push dashboard implementation
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet -- extensions/bob-bazaar-review; then
            echo "No dashboard implementation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/bob-bazaar-review
          git commit -m "feat: add Bazaar campaign dashboard"
          git push origin HEAD:agent/bob-bazaar-review-review-run-v3-iteration3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-bazaar-review/package-lock.json

      - name: Install dependencies
        working-directory: extensions/bob-bazaar-review
        run: npm ci

      - name: Unit tests
        working-directory: extensions/bob-bazaar-review
        run: npm test

      - name: Dependency policy
        working-directory: extensions/bob-bazaar-review
        run: npm run dependency:policy

      - name: Architecture policy
        working-directory: extensions/bob-bazaar-review
        run: npm run architecture:policy

      - name: Source policy
        working-directory: extensions/bob-bazaar-review
        run: npm run source:policy

      - name: Unused dependency policy
        working-directory: extensions/bob-bazaar-review
        run: npm run unused:policy

      - name: Artifact size policy
        working-directory: extensions/bob-bazaar-review
        run: npm run artifact:policy

      - name: Production dependency audit
        working-directory: extensions/bob-bazaar-review
        run: npm run audit:prod

      - name: Package
        working-directory: extensions/bob-bazaar-review
        run: npm run package

      - name: VSIX policy
        working-directory: extensions/bob-bazaar-review
        run: npm run package:policy

      - name: VSIX metrics
        working-directory: extensions/bob-bazaar-review
        run: npm run package:metrics
