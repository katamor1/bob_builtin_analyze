name: bob-bazaar-review-iteration3-export-cleanup

on:
  pull_request:
    paths:
      - ".github/workflows/bob-bazaar-review-iteration3-export-cleanup.yml"
      - ".github/patches/bob-bazaar-review-iteration3-export-cleanup.patch.gz.b64"
      - "extensions/bob-bazaar-review/**"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: agent/bob-bazaar-review-review-run-v3-iteration3
          fetch-depth: 0

      - name: Apply verified export cleanup patch
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          base64 --decode .github/patches/bob-bazaar-review-iteration3-export-cleanup.patch.gz.b64 \
            | gzip --decompress \
            > /tmp/bob-bazaar-review-iteration3-export-cleanup.patch
          echo "60b843f5363498b0db567721786b9d9f1e446181ae5f5347541fe9e138eb6357  /tmp/bob-bazaar-review-iteration3-export-cleanup.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/bob-bazaar-review-iteration3-export-cleanup.patch
          git apply /tmp/bob-bazaar-review-iteration3-export-cleanup.patch

      - name: Commit and push export cleanup fix
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet -- extensions/bob-bazaar-review; then
            echo "No export cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/bob-bazaar-review/src/dashboard/campaignDashboardExport.ts \
            extensions/bob-bazaar-review/test/campaignDashboardExport.test.js
          git commit -m "fix: preserve dashboard exports on backup cleanup failure"
          git push origin HEAD:agent/bob-bazaar-review-review-run-v3-iteration3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-bazaar-review/package-lock.json

      - name: Install dependencies
        working-directory: extensions/bob-bazaar-review
        run: npm ci

      - name: Unit tests
        working-directory: extensions/bob-bazaar-review
        run: npm test

      - name: Dependency policy
        working-directory: extensions/bob-bazaar-review
        run: npm run dependency:policy

      - name: Architecture policy
        working-directory: extensions/bob-bazaar-review
        run: npm run architecture:policy

      - name: Source policy
        working-directory: extensions/bob-bazaar-review
        run: npm run source:policy

      - name: Unused dependency policy
        working-directory: extensions/bob-bazaar-review
        run: npm run unused:policy

      - name: Artifact size policy
        working-directory: extensions/bob-bazaar-review
        run: npm run artifact:policy

      - name: Production dependency audit
        working-directory: extensions/bob-bazaar-review
        run: npm run audit:prod

      - name: Package
        working-directory: extensions/bob-bazaar-review
        run: npm run package

      - name: VSIX policy
        working-directory: extensions/bob-bazaar-review
        run: npm run package:policy

      - name: VSIX metrics
        working-directory: extensions/bob-bazaar-review
        run: npm run package:metrics
