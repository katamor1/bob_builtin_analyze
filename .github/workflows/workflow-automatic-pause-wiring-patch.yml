name: workflow-automatic-pause-wiring-patch

on:
  push:
    branches:
      - agent/workflow-automatic-pause-limits-20260712
    paths:
      - scripts/apply-workflow-automatic-pause-wiring.js
      - .github/workflows/workflow-automatic-pause-wiring-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-automatic-pause-limits-20260712
          fetch-depth: 0
      - name: Apply exact source patch
        run: node scripts/apply-workflow-automatic-pause-wiring.js
      - name: Verify generated source
        working-directory: extensions/workflow-register
        run: |
          npm ci --silent
          npm run compile --silent
          node --test test/workflowAutomaticPauseSettings.test.js
      - name: Commit patched sources and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: wire workspace automatic pause limits"
          git push origin HEAD:agent/workflow-automatic-pause-limits-20260712
