name: Apply evidence scope Phase 5 code

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e
    paths:
      - .github/workflows/apply-evidence-scope-phase5.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Apply verified Phase 5 payload
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .github/phase5-code-payload.tar.gz
          rm -f \
            .github/phase5-code-payload.tar.gz \
            .github/workflows/apply-evidence-scope-phase5.yml \
            .github/workflows/export-evidence-scope-current.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/phase5-code-payload.tar.gz \
            .github/workflows/apply-evidence-scope-phase5.yml \
            .github/workflows/export-evidence-scope-current.yml \
            docs/workflows/code-consistency-review/schemas/review-input.schema.json \
            extensions/bob-code-consistency-review/resources/schemas/review-input.schema.json \
            extensions/bob-code-consistency-review/src/core/fileSystem.ts \
            extensions/bob-code-consistency-review/src/core/pipeline.ts \
            extensions/bob-code-consistency-review/src/evidenceScope/repositoryIndexCache.ts \
            extensions/bob-code-consistency-review/src/evidenceScope/repositorySourceExtractor.ts
          git commit -m 'feat: complete repository index producer cache'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
