name: p1-3-operation-hub-apply

on:
  pull_request:
    paths:
      - ".github/workflows/p1-3-operation-hub-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply Operation Hub provenance projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          model_path = Path("extensions/workflow-register/src/gui/operationHubModel.ts")
          model = model_path.read_text(encoding="utf-8")

          import_anchor = 'import type { CoreWorkflowDefinition, WorkflowRunState } from "../core/model"\n'
          import_line = 'import { projectWorkflowRunProvenance, type WorkflowStepProvenanceProjection } from "../core/runProvenance"\n'
          if import_line not in model:
              if import_anchor not in model:
                  raise SystemExit("operationHubModel import anchor missing")
              model = model.replace(import_anchor, import_anchor + import_line, 1)

          artifact_interface = '''export interface OperationHubArtifactSummary {
            label: string
            displayPath: string
            workspacePath: string
            action: OperationHubAction
          }
          '''
          step_interface = '''export interface OperationHubStepProvenanceSummary {
            stepId: string
            title: string
            status: string
            completionLabel: string
            detail: string
            reused: boolean
          }

          '''
          if "export interface OperationHubStepProvenanceSummary" not in model:
              if artifact_interface not in model:
                  raise SystemExit("artifact interface anchor missing")
              model = model.replace(artifact_interface, artifact_interface + "\n" + step_interface, 1)

          field_anchor = '  taskSnapshotImportStatus?: OperationHubStatus\n'
          if '  stepProvenance?: OperationHubStepProvenanceSummary[]\n' not in model:
              if field_anchor not in model:
                  raise SystemExit("run summary field anchor missing")
              model = model.replace(field_anchor, field_anchor + '  stepProvenance?: OperationHubStepProvenanceSummary[]\n', 1)

          provenance_anchor = '  const taskSnapshotImport = summarizeTaskSnapshotImport(run)\n'
          if '  const provenance = projectWorkflowRunProvenance(run)\n' not in model:
              if provenance_anchor not in model:
                  raise SystemExit("provenance const anchor missing")
              model = model.replace(provenance_anchor, provenance_anchor + '  const provenance = projectWorkflowRunProvenance(run)\n', 1)

          return_anchor = '    taskSnapshotImportStatus: taskSnapshotImport?.status,\n'
          if '    stepProvenance: provenance.steps.map(toOperationHubStepProvenance),\n' not in model:
              if return_anchor not in model:
                  raise SystemExit("return field anchor missing")
              model = model.replace(return_anchor, return_anchor + '    stepProvenance: provenance.steps.map(toOperationHubStepProvenance),\n', 1)

          helper_anchor = 'function summarizeBobTaskSync(run: WorkflowRunState): { label: string; status: OperationHubStatus } {\n'
          helper = '''function toOperationHubStepProvenance(step: WorkflowStepProvenanceProjection): OperationHubStepProvenanceSummary {
            const completionLabel = step.completion === "reused"
              ? "Reused"
              : step.runStatus === "completed"
                ? "Completed"
                : step.runStatus.charAt(0).toUpperCase() + step.runStatus.slice(1)
            const detail = [
              step.skippedByArtifactReuse ? "Skipped by artifact reuse" : undefined,
              step.sourceRunId ? `from ${step.sourceRunId}` : undefined,
              step.artifactVerified ? "Artifact verified" : undefined,
              step.importedFromTaskSnapshot ? "Imported from task snapshot" : undefined,
              step.artifactIds.length > 0 ? `artifacts ${step.artifactIds.join(", ")}` : undefined,
              step.hydratedStateKeys.length > 0 ? `hydrated ${step.hydratedStateKeys.join(", ")}` : undefined
            ].filter((value): value is string => Boolean(value)).join(" · ")
            return {
              stepId: step.stepId,
              title: step.title,
              status: step.runStatus,
              completionLabel,
              detail,
              reused: step.completion === "reused"
            }
          }

          '''
          if "function toOperationHubStepProvenance" not in model:
              if helper_anchor not in model:
                  raise SystemExit("Bob sync helper anchor missing")
              model = model.replace(helper_anchor, helper + helper_anchor, 1)

          sync_anchor = '  const through = sync?.completedThroughStepId ? ` / through ${sync.completedThroughStepId}` : ""\n'
          sync_guard = '  if (status === "synced" && sync?.liveTaskAvailable === false) return { label: `Bob Todo: saved projection only; live task unavailable${through}`, status: "warning" }\n'
          if sync_guard not in model:
              if sync_anchor not in model:
                  raise SystemExit("Bob sync guard anchor missing")
              model = model.replace(sync_anchor, sync_anchor + sync_guard, 1)

          model_path.write_text(model, encoding="utf-8")

          html_path = Path("extensions/workflow-register/src/gui/operationHubHtml.ts")
          html = html_path.read_text(encoding="utf-8")
          css_anchor = '    .artifact { display: flex; justify-content: space-between; align-items: center; gap: 6px; border-top: 1px solid var(--vscode-panel-border); padding-top: 6px; margin-top: 6px; }\n'
          css = '''    .step-list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
            .step-provenance { border-left: 2px solid var(--vscode-panel-border); padding-left: 7px; }
            .step-provenance.reused { border-left-color: var(--vscode-testing-iconPassed); }
            .step-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
          '''
          if ".step-list" not in html:
              if css_anchor not in html:
                  raise SystemExit("operationHubHtml CSS anchor missing")
              html = html.replace(css_anchor, css_anchor + css, 1)

          render_anchor = '    <div class="muted">${run.completedStepCount}/${run.totalStepCount} step / updated ${escapeHtml(run.updatedAt)}</div>\n'
          render_line = '    ${renderStepProvenanceList(run)}\n'
          if render_line not in html:
              if render_anchor not in html:
                  raise SystemExit("run render anchor missing")
              html = html.replace(render_anchor, render_anchor + render_line, 1)

          helper_anchor = 'function renderArtifact(artifact: OperationHubArtifactSummary): string {\n'
          helper = '''function renderStepProvenanceList(run: OperationHubRunSummary): string {
            const steps = run.stepProvenance ?? []
            if (steps.length === 0) return ""
            return `<div class="step-list">${steps.map((step) => `<div class="step-provenance${step.reused ? " reused" : ""}">
              <div class="step-heading"><code>${escapeHtml(step.stepId)} · ${escapeHtml(step.title)}</code><span class="badge ${step.reused ? "ok" : "info"}">${escapeHtml(step.completionLabel)}</span></div>
              ${step.detail ? `<div class="muted">${escapeHtml(step.detail)}</div>` : ""}
            </div>`).join("")}</div>`
          }

          '''
          if "function renderStepProvenanceList" not in html:
              if helper_anchor not in html:
                  raise SystemExit("render artifact anchor missing")
              html = html.replace(helper_anchor, helper + helper_anchor, 1)

          html_path.write_text(html, encoding="utf-8")
          PY

      - name: Verify focused contracts
        working-directory: extensions/workflow-register
        run: |
          npm ci
          npm run compile
          node --test \
            test/workflowRunProvenance.test.js \
            test/operationHubStepProvenance.test.js \
            test/operationHubArtifactReuse.test.js \
            test/operationHubTodoSync.test.js

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/p1-3-operation-hub-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: show reused steps in Operation Hub"
          git push origin HEAD:${{ github.head_ref }}
