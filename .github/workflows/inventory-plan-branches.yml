name: inventory-plan-branches

on:
  pull_request:
    paths:
      - ".github/workflows/inventory-plan-branches.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Classify repository branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          inventory_branch="$GITHUB_HEAD_REF"
          default_branch="$(gh api "repos/$repo" --jq '.default_branch')"

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name' | sort -u > /tmp/branches.txt

          echo "INVENTORY|default=$default_branch|temporary=$inventory_branch|total=$(wc -l < /tmp/branches.txt | tr -d ' ')"

          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            [[ "$branch" == "$default_branch" ]] && continue
            [[ "$branch" == "$inventory_branch" ]] && continue
            git show-ref --verify --quiet "refs/remotes/origin/$branch" || continue

            if git merge-base --is-ancestor "origin/$branch" "origin/$default_branch"; then
              inclusion="contained"
            else
              inclusion="unmerged"
            fi

            read -r behind ahead < <(git rev-list --left-right --count "origin/$default_branch...origin/$branch")
            changed_count="$(git diff --name-only "origin/$default_branch...origin/$branch" | wc -l | tr -d ' ')"
            plan_files="$(git diff --name-only "origin/$default_branch...origin/$branch" -- docs/superpowers/plans docs/superpowers/specs | paste -sd ',' -)"
            [[ -n "$plan_files" ]] || plan_files="-"
            subject="$(git log -1 --format=%s "origin/$branch" | tr '|' '/')"

            prs="$(gh pr list --repo "$repo" --state all --head "$branch" --limit 20 \
              --json number,state,isDraft,mergedAt,title,baseRefName \
              --jq 'map("#\(.number):\(.state):draft=\(.isDraft):merged=\(.mergedAt // "-"):base=\(.baseRefName):\(.title | gsub("\\|"; "/"))") | join(" ;; ")')"
            [[ -n "$prs" ]] || prs="-"

            echo "BRANCH|$branch|$inclusion|behind=$behind|ahead=$ahead|changed=$changed_count|plans=$plan_files|subject=$subject|prs=$prs"
          done < /tmp/branches.txt

          echo "DELETE_TEMP|$inventory_branch"
          gh api --method DELETE "repos/$repo/git/refs/heads/$inventory_branch"
