name: agent-process-prompt-force

on:
  push:
    branches:
      - agent/three-extension-remediation-20260711
    paths:
      - "scripts/agent-workflow-prompt-patch.mjs"
      - ".github/workflows/agent-process-prompt-force.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/three-extension-remediation-20260711
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply strict prompts
        run: node scripts/agent-workflow-prompt-patch.mjs
      - name: Commit process workflow prompts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No prompt changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bob/workflows
          git commit -m "fix: make process workflow contracts strict-clean"
          git push origin HEAD:agent/three-extension-remediation-20260711
