name: p1-4-evidence-hardening

on:
  pull_request:
    paths:
      - ".github/workflows/p1-4-evidence-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconcile latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Apply recovery eligibility and evidence hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          classifier_path = Path("extensions/workflow-register/src/core/heldRunRecovery.ts")
          classifier = classifier_path.read_text(encoding="utf-8")
          old_state = '''  const missingRequiredStateKeys = workflowStep
    ? requiredStateKeysMissing(workflowStep, run.state)
    : []
  const definitionCompatible = Boolean(workflow && definitionMatches(run, workflow) && stepOrderMatches(run, workflow))
'''
          new_state = '''  const workflowCurrentIndex = workflowStep ? workflow?.engineSteps.findIndex((step) => step.id === workflowStep.id) ?? -1 : -1
  const nextWorkflowStep = workflowCurrentIndex >= 0 ? workflow?.engineSteps[workflowCurrentIndex + 1] : undefined
  const missingRequiredStateKeys = uniqueStrings([
    ...(workflowStep ? requiredStateKeysMissing(workflowStep, run.state) : []),
    ...(nextWorkflowStep ? requiredStateKeysMissing(nextWorkflowStep, run.state) : [])
  ])
  const definitionCompatible = Boolean(workflow && definitionMatches(run, workflow) && stepOrderMatches(run, workflow))
'''
          assert old_state in classifier
          classifier = classifier.replace(old_state, new_state, 1)
          blocker_anchor = '''  if (missingRequiredStateKeys.length > 0) {
    blockers.push(`Required workflow state is missing: ${missingRequiredStateKeys.join(", ")}.`)
  }
'''
          blocker_text = '''  if (missingRequiredStateKeys.length > 0) {
    blockers.push(`Required workflow state is missing: ${missingRequiredStateKeys.join(", ")}.`)
  }
  if (workflowStep?.type === "manual") blockers.push(...manualCompletionBlockers(workflowStep, run.state))
'''
          assert blocker_anchor in classifier
          classifier = classifier.replace(blocker_anchor, blocker_text, 1)
          helper_anchor = 'function requiredStateKeysMissing(step: EngineStep, state: Record<string, string>): string[] {\n'
          helpers = '''function manualCompletionBlockers(
  step: Extract<EngineStep, { type: "manual" }>,
  state: Record<string, string>
): string[] {
  const blockers: string[] = []
  if (step.form?.resultKey) {
    const raw = state[step.form.resultKey]
    const value = raw === undefined ? undefined : parseStateValue(raw)
    if (!value || typeof value !== "object" || Array.isArray(value)) {
      blockers.push(`Persisted manual form result '${step.form.resultKey}' is unavailable.`)
    } else {
      const record = value as Record<string, unknown>
      for (const field of step.form.fields.filter((candidate) => candidate.required)) {
        if (!manualFieldValuePresent(record[field.id])) {
          blockers.push(`Required manual form field '${field.id}' is unavailable in '${step.form.resultKey}'.`)
        }
      }
    }
  }
  if (step.approval?.resultKey) {
    const raw = state[step.approval.resultKey]
    const value = raw === undefined ? undefined : parseStateValue(raw)
    const decision = value && typeof value === "object" && !Array.isArray(value)
      ? (value as Record<string, unknown>).decision
      : undefined
    if (decision !== "approved" && decision !== "rejected") {
      blockers.push(`Persisted manual approval result '${step.approval.resultKey}' is unavailable.`)
    }
  }
  return blockers
}

function parseStateValue(value: string): unknown {
  try {
    return JSON.parse(value)
  } catch {
    return value
  }
}

function manualFieldValuePresent(value: unknown): boolean {
  if (value === undefined || value === null) return false
  if (typeof value === "string") return value.trim().length > 0
  return true
}

function uniqueStrings(values: readonly string[]): string[] {
  return Array.from(new Set(values.filter((value) => value.trim().length > 0)))
}

'''
          assert helper_anchor in classifier
          classifier = classifier.replace(helper_anchor, helpers + helper_anchor, 1)
          classifier_path.write_text(classifier, encoding="utf-8")

          service_path = Path("extensions/workflow-register/src/workflowRegisterService.ts")
          service = service_path.read_text(encoding="utf-8")
          service_anchor = '''  async inspectActiveSteps(): Promise<void> {
'''
          service_method = '''  listActiveSteps() {
    return this.stepRuntime.list()
  }

'''
          if '  listActiveSteps() {' not in service:
              assert service_anchor in service
              service = service.replace(service_anchor, service_method + service_anchor, 1)
          service_path.write_text(service, encoding="utf-8")

          extension_path = Path("extensions/workflow-register/src/extension.ts")
          extension = extension_path.read_text(encoding="utf-8")
          old_provider = '  const operationHub = new OperationHubProvider({ api, extensionUri: context.extensionUri })\n'
          new_provider = '  const operationHub = new OperationHubProvider({ api, extensionUri: context.extensionUri, activeSteps: () => service.listActiveSteps() })\n'
          assert old_provider in extension
          extension = extension.replace(old_provider, new_provider, 1)
          extension_path.write_text(extension, encoding="utf-8")

          provider_path = Path("extensions/workflow-register/src/gui/operationHubProvider.ts")
          provider = provider_path.read_text(encoding="utf-8")
          model_import = 'import type { CoreWorkflowDefinition, WorkflowRunState } from "../core/model"\n'
          active_import = 'import type { ActiveStep } from "../bobWorkflowTypes"\n'
          if active_import not in provider:
              assert model_import in provider
              provider = provider.replace(model_import, active_import + model_import, 1)
          provider = provider.replace('import { ARTIFACT_MANIFEST_STATE_KEY, parseWorkflowArtifactManifest } from "../core/artifacts"\n', 'import { ARTIFACT_MANIFEST_STATE_KEY, parseWorkflowArtifactManifest, validateWorkflowArtifactManifest } from "../core/artifacts"\n', 1)
          options_anchor = '''interface OperationHubProviderOptions {
  api: OperationHubWorkflowApi
  extensionUri: vscode.Uri
}
'''
          options_text = '''interface OperationHubProviderOptions {
  api: OperationHubWorkflowApi
  extensionUri: vscode.Uri
  activeSteps?: () => readonly ActiveStep[]
}
'''
          assert options_anchor in provider
          provider = provider.replace(options_anchor, options_text, 1)
          old_evidence = '''          const heldRecovery = classifyHeldRunRecovery({
            run,
            workflow,
            liveTaskAvailable: Boolean(reviewTaskRegistry.taskForRun(candidate.root, run.runId)),
            activeManualStepAvailable: Boolean(reviewTaskRegistry.taskForStep(candidate.root, run.runId, run.currentStep)),
            artifactManifestAvailable: Boolean(parseWorkflowArtifactManifest(run.state[ARTIFACT_MANIFEST_STATE_KEY])),
            taskSnapshotAvailable: taskSnapshots.some((item) => item.stepId === run.currentStep)
          })
'''
          new_evidence = '''          const manifest = parseWorkflowArtifactManifest(run.state[ARTIFACT_MANIFEST_STATE_KEY])
          const artifactManifestAvailable = Boolean(
            workflow
            && manifest
            && !validateWorkflowArtifactManifest({ manifest, workflow, inputs: run.inputs })
              .some((issue) => issue.severity === "error")
          )
          const activeManualStepAvailable = (this.options.activeSteps?.() ?? []).some((active) => (
            active.runId === run.runId
            && active.workflowId === run.workflowId
            && active.stepId === run.currentStep
          ))
          const taskSnapshotAvailable = taskSnapshots.some((snapshot) => (
            snapshot.stepId === run.currentStep
            && snapshot.workflowId === run.workflowId
            && (!snapshot.workflowDefinitionHash || !workflow?.definitionHash || snapshot.workflowDefinitionHash === workflow.definitionHash)
          ))
          const heldRecovery = classifyHeldRunRecovery({
            run,
            workflow,
            liveTaskAvailable: Boolean(reviewTaskRegistry.taskForRun(candidate.root, run.runId)),
            activeManualStepAvailable,
            artifactManifestAvailable,
            taskSnapshotAvailable
          })
'''
          assert old_evidence in provider
          provider = provider.replace(old_evidence, new_evidence, 1)
          provider_path.write_text(provider, encoding="utf-8")
          PY

      - name: Verify focused contracts
        id: focused
        working-directory: extensions/workflow-register
        shell: bash
        run: |
          set +e
          npm ci --silent > "$RUNNER_TEMP/p1-4-evidence.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then npm run compile --silent >> "$RUNNER_TEMP/p1-4-evidence.log" 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then
            node --test \
              test/heldRunRecoveryClassifier.test.js \
              test/operationHubHeldRecovery.test.js \
              test/operationHub.test.js \
              test/operationHubMutations.test.js \
              test/detachedHeldRecoveryCommand.test.js \
              test/heldRecoveryDiagnostics.test.js \
              test/workflowEngineGuardedResume.test.js >> "$RUNNER_TEMP/p1-4-evidence.log" 2>&1
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            grep -n -B 40 -A 140 -E "not ok|AssertionError|error TS|Error:" "$RUNNER_TEMP/p1-4-evidence.log" || tail -n 260 "$RUNNER_TEMP/p1-4-evidence.log"
          else
            tail -n 40 "$RUNNER_TEMP/p1-4-evidence.log"
          fi
          exit "$status"

      - name: Upload focused failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p1-4-evidence-focused-log
          path: ${{ runner.temp }}/p1-4-evidence.log
          if-no-files-found: error
          retention-days: 3

      - name: Commit verified hardening
        if: success()
        shell: bash
        run: |
          rm .github/workflows/p1-4-evidence-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden detached held recovery evidence"
          git push origin HEAD:${{ github.head_ref }}
