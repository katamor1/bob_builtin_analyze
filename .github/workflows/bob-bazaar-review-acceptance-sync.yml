name: bob-bazaar-review-acceptance-sync

on:
  push:
    branches:
      - agent/bob-bazaar-review-review-run-v3-acceptance
    paths:
      - ".github/workflows/bob-bazaar-review-acceptance-sync.yml"

permissions:
  contents: write

jobs:
  diagnose-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@v4
        with:
          ref: agent/bob-bazaar-review-review-run-v3-acceptance
          fetch-depth: 0
      - name: Record merge conflicts with main
        shell: bash
        run: |
          set +e
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main
          status=$?
          mkdir -p .github/diagnostics
          if [ "$status" -eq 0 ]; then
            printf 'clean\n' > .github/diagnostics/bob-bazaar-review-acceptance-conflicts.txt
          else
            git diff --name-only --diff-filter=U > .github/diagnostics/bob-bazaar-review-acceptance-conflicts.txt
          fi
          git merge --abort 2>/dev/null || true
          git add .github/diagnostics/bob-bazaar-review-acceptance-conflicts.txt
          git commit -m "ci: record acceptance merge conflicts with main"
          git push origin HEAD:agent/bob-bazaar-review-review-run-v3-acceptance
