name: Collect final Bob evidence scope CI

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e
    paths:
      - .github/workflows/collect-bob-evidence-scope-final-ci.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final source checkpoint
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Require finalized artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/implementation/bob-evidence-scope-final-artifact-ledger-2026-07-12.md
          test -f docs/implementation/bob-evidence-scope-final-artifact-ledger-verification-2026-07-12.md
          test -f docs/implementation/bob-evidence-scope-final-artifact-ledger-manifest.json
          if find .github/workflows -maxdepth 1 -type f \( -name 'finalize-bob-evidence-scope*.yml' -o -name 'export-evidence-scope-current.yml' -o -name 'apply-evidence-scope-phase5.yml' \) | grep -q .; then
            echo 'A superseded evidence-scope helper workflow remains.' >&2
            find .github/workflows -maxdepth 1 -type f | sort >&2
            exit 1
          fi

      - name: Wait for authoritative pull-request workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          source_sha = os.environ['SOURCE_SHA']
          wanted = {'extensions-quality', 'code-consistency-review-scaffold'}
          deadline = time.time() + 2700
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'bob-evidence-scope-final-ci',
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          selected = {}
          while time.time() < deadline:
              data = get(f'https://api.github.com/repos/{repo}/actions/runs?branch={branch}&event=pull_request&per_page=100')
              candidates = {}
              for run in data.get('workflow_runs', []):
                  name = run.get('name')
                  if name not in wanted:
                      continue
                  if run.get('head_branch') != branch:
                      continue
                  current = candidates.get(name)
                  if current is None or run.get('created_at', '') > current.get('created_at', ''):
                      candidates[name] = run
              if wanted.issubset(candidates):
                  selected = candidates
                  states = {name: (run.get('status'), run.get('conclusion')) for name, run in selected.items()}
                  print(f'authoritative workflow states: {states}', flush=True)
                  if all(run.get('status') == 'completed' for run in selected.values()):
                      break
              time.sleep(20)
          else:
              raise SystemExit('timed out waiting for authoritative pull-request workflows')

          failures = {name: run.get('conclusion') for name, run in selected.items() if run.get('conclusion') != 'success'}
          if failures:
              raise SystemExit(f'authoritative workflow failure: {failures}')

          record = {
              'schema_version': 1,
              'source_checkpoint': source_sha,
              'collected_at': datetime.now(timezone.utc).isoformat(),
              'workflows': {},
          }
          for name, run in sorted(selected.items()):
              jobs_data = get(run['jobs_url'] + '?filter=latest&per_page=100')
              jobs = []
              for job in jobs_data.get('jobs', []):
                  jobs.append({
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'steps': [
                          {
                              'name': step.get('name'),
                              'status': step.get('status'),
                              'conclusion': step.get('conclusion'),
                          }
                          for step in job.get('steps', [])
                      ],
                  })
              non_success = [job for job in jobs if job['conclusion'] != 'success']
              if non_success:
                  raise SystemExit(f'{name} contains non-success jobs: {[(job["name"], job["conclusion"]) for job in non_success]}')
              record['workflows'][name] = {
                  'id': run['id'],
                  'run_number': run.get('run_number'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'html_url': run.get('html_url'),
                  'head_sha': run.get('head_sha'),
                  'jobs': jobs,
              }

          Path(os.environ.get('RUNNER_TEMP', '/tmp'), 'bob-evidence-scope-final-ci.json').write_text(
              json.dumps(record, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Record final CI and update PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: '72'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          root = Path('.')
          record = json.loads(Path(os.environ['RUNNER_TEMP'], 'bob-evidence-scope-final-ci.json').read_text(encoding='utf-8'))
          scaffold = record['workflows']['code-consistency-review-scaffold']
          matrix = record['workflows']['extensions-quality']

          def job_lines(workflow):
              return '\n'.join(f"- `{job['name']}`: `{job['conclusion']}`" for job in workflow['jobs'])

          ci_path = root / 'docs/implementation/bob-evidence-scope-final-ci-2026-07-12.md'
          ci_path.write_text(f'''# Bob Evidence Scope Final CI Record

## Source checkpoint

```text
{record['source_checkpoint']}
```

## `code-consistency-review-scaffold`

- run ID: `{scaffold['id']}`
- run number: `{scaffold['run_number']}`
- conclusion: `{scaffold['conclusion']}`

{job_lines(scaffold)}

This workflow covers dependency, architecture, source, unused dependency, production audit, TypeScript compile, complete unit tests, package, VSIX policy, and scaffold typecheck/unit/smoke gates.

## `extensions-quality`

- run ID: `{matrix['id']}`
- run number: `{matrix['run_number']}`
- conclusion: `{matrix['conclusion']}`

{job_lines(matrix)}

Linux and Windows extension jobs completed their configured unit, package, VSIX policy, and Extension Host smoke steps. Source metrics also completed successfully.

## Decision

The complete Phase 1–Final source checkpoint passed both authoritative workflows. The following commit is documentation/evidence cleanup only and removes the temporary collector workflow. PR #72 remains Draft for human review; no merge is performed automatically.
''', encoding='utf-8')

          verification_path = root / 'docs/implementation/bob-evidence-scope-final-artifact-ledger-verification-2026-07-12.md'
          verification = verification_path.read_text(encoding='utf-8')
          marker = '## Authoritative Linux / Windows CI'
          if marker not in verification:
              verification += f'''\n\n{marker}\n\n- `code-consistency-review-scaffold` run `{scaffold['id']}`: `{scaffold['conclusion']}`\n- `extensions-quality` run `{matrix['id']}`: `{matrix['conclusion']}`\n- every latest-attempt job in both workflows: `success`\n- Linux / Windows extension unit, package, VSIX policy, and Extension Host smoke gates: `success`\n'''
              verification_path.write_text(verification, encoding='utf-8')

          final_verification = verification_path.read_text(encoding='utf-8')
          full_match = re.search(r'# tests\s+(\d+).*?# pass\s+(\d+).*?# fail\s+(\d+)', final_verification, re.S)
          focused_match = re.search(r'## Focused suite.*?# tests\s+(\d+).*?# pass\s+(\d+).*?# fail\s+(\d+)', final_verification, re.S)
          full_summary = f"{full_match.group(2)}/{full_match.group(1)} passed, {full_match.group(3)} failed" if full_match else 'complete suite passed'
          focused_summary = f"{focused_match.group(2)}/{focused_match.group(1)} passed, {focused_match.group(3)} failed" if focused_match else 'focused ledger suite passed'

          body = f'''## Purpose

Complete the full `bob-evidence-scope` plan through its final phase.

- Phases 1–2: deterministic evidence selection and review-package integration
- Phase 3: workspace-local project rule-pack provenance and stale hashing
- Phase 4: repository-wide symbol/reference index consumer
- Phase 5: immutable Git index producer with bounded incremental fragment cache
- Final phase: exact-byte artifact ledger and transitive stale-state propagation

## Final implementation

- deterministic stable symbol/reference index production from immutable Git blobs
- source-free incremental cache with changed/new/deleted-file invalidation and global relink
- preprocess `build` / `consume` modes with path, revision, dirty-tree, timeout, and resource boundaries
- artifact identities, exact-byte SHA-256, producer/logical versions, dependency edges, current/stale state, and stable reasons
- direct and transitive stale propagation with cycle termination
- modern multi-file Human Triage logical-version compatibility
- no raw source, diff, document, rule-pack, repository-index, triage body, credential, or environment value in ledger metadata
- existing schema IDs, command IDs, artifact paths, and consumer APIs preserved
- no new runtime dependency

## TDD and verification

- Phase 5 focused producer/cache suite: 9/9 passed
- final ledger focused suite: {focused_summary}
- complete `bob-code-consistency-review` suite: {full_summary}
- dependency / architecture / source / unused / production audit / package / VSIX policy: passed
- `code-consistency-review-scaffold` run `{scaffold['id']}`: **success**
- `extensions-quality` run `{matrix['id']}`: **success**
- all latest-attempt jobs in both workflows: **success**

## Committed evidence

- Phase 1–5 design, plans, implementation, verification, and SHA-256 manifests
- final artifact-ledger design and implementation plan
- final implementation and verification records
- final CI record with job-level conclusions
- final SHA-256 manifest for code, tests, schemas, and evidence

Temporary export, payload-application, finalization, and CI-collector workflows are removed from the final diff.

## Status

The PR remains **Draft** for human review. It is not merged automatically.
'''
          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          pr_number = os.environ['PR_NUMBER']
          payload = json.dumps({
              'title': 'feat: complete bob evidence scope and artifact stale ledger',
              'body': body,
          }).encode('utf-8')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/pulls/{pr_number}',
              data=payload,
              method='PATCH',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'bob-evidence-scope-final-ci',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f'PR update failed: {response.status}')
          PY

          rm -f \
            .github/workflows/collect-bob-evidence-scope-final-ci.yml \
            .github/workflows/finalize-bob-evidence-scope.yml \
            .github/workflows/finalize-bob-evidence-scope-v2.yml \
            .github/workflows/export-evidence-scope-current.yml \
            .github/workflows/apply-evidence-scope-phase5.yml \
            .github/phase5-code-payload.tar.gz
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/implementation .github
          git commit -m 'docs: record final bob evidence scope CI'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
