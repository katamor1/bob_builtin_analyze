name: workflow-contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: workflow-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Dynamic workflow contract evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            extensions/workflow-register/package-lock.json
            extensions/bob-bazaar-review/package-lock.json
            extensions/bob-code-consistency-review/package-lock.json

      - name: Install all extension dependencies
        run: |
          npm --prefix extensions/workflow-register ci --silent
          npm --prefix extensions/bob-bazaar-review ci --silent
          npm --prefix extensions/bob-code-consistency-review ci --silent

      - name: Compile and package all manifest owners
        run: |
          npm --prefix extensions/workflow-register run compile --silent
          npm --prefix extensions/workflow-register run package --silent
          npm --prefix extensions/bob-bazaar-review run compile --silent
          npm --prefix extensions/bob-bazaar-review run package --silent
          npm --prefix extensions/bob-code-consistency-review run compile --silent
          npm --prefix extensions/bob-code-consistency-review run package --silent

      - name: Enforce workflow-register package policy
        run: npm --prefix extensions/workflow-register run package:policy --silent

      - name: Enforce bob-bazaar-review package policy
        run: npm --prefix extensions/bob-bazaar-review run package:policy --silent

      - name: Enforce bob-code-consistency-review package policy
        run: npm --prefix extensions/bob-code-consistency-review run package:policy --silent

      - name: Select exact commit and tree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          workflow_tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
          echo "WORKFLOW_TREE=$workflow_tree" >> "$GITHUB_ENV"

      - name: Generate discovery, strict-compile, command, mirror, and vsix evidence
        run: |
          npm --prefix extensions/workflow-register run report:generate -- \
            --repository-root "$GITHUB_WORKSPACE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-tree "$WORKFLOW_TREE" \
            --output "$RUNNER_TEMP/workflow-contract-report.json" \
            --archive local.workflow-register=extensions/workflow-register/workflow-register-0.1.0.vsix \
            --archive local.bob-bazaar-review=extensions/bob-bazaar-review/bob-bazaar-review-0.3.0.vsix \
            --archive local.bob-code-consistency-review=extensions/bob-code-consistency-review/bob-code-consistency-review-0.1.0.vsix

      - name: Re-read schema and semantic report validation
        run: |
          npm --prefix extensions/workflow-register run report:validate -- \
            --report "$RUNNER_TEMP/workflow-contract-report.json" \
            --repository-root "$GITHUB_WORKSPACE" \
            --expected-commit "$GITHUB_SHA" \
            --expected-tree "$WORKFLOW_TREE" \
            --archive local.workflow-register=extensions/workflow-register/workflow-register-0.1.0.vsix \
            --archive local.bob-bazaar-review=extensions/bob-bazaar-review/bob-bazaar-review-0.3.0.vsix \
            --archive local.bob-code-consistency-review=extensions/bob-code-consistency-review/bob-code-consistency-review-0.1.0.vsix

      - name: Upload workflow contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-contract-report
          path: ${{ runner.temp }}/workflow-contract-report.json
          if-no-files-found: error
          retention-days: 90
