name: capture-pr97-windows-bazaar-unit-2

on:
  pull_request:
    paths:
      - ".github/workflows/capture-pr97-windows-bazaar-unit-2.yml"

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Extract TAP failure blocks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: "29458155351"
          JOB_ID: "87495798474"
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          diagnostic_branch="$GITHUB_HEAD_REF"

          gh run view "$RUN_ID" --repo "$repo" --job "$JOB_ID" --log > /tmp/job.log

          python3 - <<'PY'
          from pathlib import Path
          import re

          raw = Path('/tmp/job.log').read_text(encoding='utf-8', errors='replace')
          ansi = re.compile(r'\x1b\[[0-9;]*[A-Za-z]')
          lines = []
          for original in raw.splitlines():
              line = ansi.sub('', original)
              parts = line.split('\t', 2)
              lines.append(parts[2] if len(parts) == 3 else line)

          starts = [i for i, line in enumerate(lines) if re.search(r'\bnot ok\b', line)]
          output = []
          for index in starts:
              output.append(lines[index])
              for line in lines[index + 1:index + 45]:
                  output.append(line)
                  if line.strip() == '...':
                      break
              output.append('')

          summary_patterns = [r'^# tests ', r'^# pass ', r'^# fail ', r'^# duration_ms ', r'npm error', r'Process completed with exit code']
          for line in lines:
              if any(re.search(pattern, line, re.IGNORECASE) for pattern in summary_patterns):
                  output.append(line)

          text = '\n'.join(output).strip() or 'No TAP failure block found.'
          if len(text) > 50000:
              text = text[:50000] + '\n... [truncated]'
          Path('/tmp/failure.txt').write_text(text, encoding='utf-8')
          PY

          {
            echo "## PR #97 second Windows failure evidence"
            echo
            echo "Run: \`$RUN_ID\`, job: \`$JOB_ID\`"
            echo
            echo '```text'
            cat /tmp/failure.txt
            echo '```'
          } > /tmp/comment.md

          gh pr comment "$PR_NUMBER" --repo "$repo" --body-file /tmp/comment.md
          gh api --method DELETE "repos/$repo/git/refs/heads/$diagnostic_branch"
