name: bob-bazaar-review-iteration2-final-diagnostics

on:
  pull_request:
    paths:
      - "extensions/bob-bazaar-review/**"
      - ".github/workflows/bob-bazaar-review-iteration2-final-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: agent/bob-bazaar-review-review-run-v3-iteration2
          fetch-depth: 0
      - name: Restore README architecture paths
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("extensions/bob-bazaar-review/README.md")
          text = path.read_text(encoding="utf-8")
          marker = "| `src/bazaar/` | Bazaar client、target、packet、direct command |\n"
          replacement = (
              "| `src/bazaar/bazaarReviewCommands.ts` | Direct revision / range review commandとBob context連携 |\n"
              "| `src/bazaar/` | Bazaar client、target、packet、direct command |\n"
              "| `src/projectRules/reviewResultValidationCommand.ts` | Active editorのreview-result検証とMarkdown report |\n"
              "| `src/workflow/workflowRegisterBridge.ts` | workflow-register API、action input、capture option変換 |\n"
          )
          if all(fragment in text for fragment in [
              "src/bazaar/bazaarReviewCommands.ts",
              "src/projectRules/reviewResultValidationCommand.ts",
              "src/workflow/workflowRegisterBridge.ts",
          ]):
              raise SystemExit(0)
          if marker not in text:
              raise SystemExit("README implementation table marker not found")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
      - name: Commit and push README fix
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/bob-bazaar-review/README.md
          git commit -m "docs: restore concrete source layout paths"
          git push origin HEAD:agent/bob-bazaar-review-review-run-v3-iteration2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-bazaar-review/package-lock.json
      - name: Install dependencies
        working-directory: extensions/bob-bazaar-review
        run: npm ci
      - name: Capture npm test output
        working-directory: extensions/bob-bazaar-review
        shell: bash
        run: |
          set +e
          npm test > final-test-output.txt 2>&1
          status=$?
          printf '%s\n' "$status" > final-test-exit-code.txt
          exit 0
      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: bob-bazaar-review-iteration2-final-test-output
          path: |
            extensions/bob-bazaar-review/final-test-output.txt
            extensions/bob-bazaar-review/final-test-exit-code.txt
          if-no-files-found: error
