name: Evidence scope phase 2 diagnostic

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        working-directory: extensions/bob-code-consistency-review
        run: npm ci

      - name: Compile
        working-directory: extensions/bob-code-consistency-review
        run: npm run compile

      - name: Capture pipeline diagnostic
        working-directory: extensions/bob-code-consistency-review
        env:
          DIAGNOSTIC_PATH: ${{ runner.temp }}/evidence-scope-phase2-diagnostic.json
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const path = require("node:path")
          const { preprocessReview } = require("./out/core/pipeline")
          const { createMultiLanguageGitReviewWorkspace } = require("./test/helpers/reviewPipelineFixtures")

          ;(async () => {
            const diagnostic = {}
            try {
              const workspace = createMultiLanguageGitReviewWorkspace()
              const inputPath = path.join(workspace, "review-input.yaml")
              fs.appendFileSync(inputPath, [
                "",
                "  evidence_scope_rules:",
                "    - id: typescript-change",
                "      title: TypeScript change review",
                "      evaluation: ai",
                "      estimated_tokens: 25",
                "      applies_when:",
                "        languages:",
                "          - typescript",
                "    - id: broken-rule",
                "      title: Broken rule",
                "      evaluation: remote",
                ""
              ].join("\n"), "utf8")
              const outDir = path.join(workspace, ".bob-review", "review-package")
              const result = await preprocessReview({
                workspaceRoot: workspace,
                inputPath,
                outDir: ".bob-review/review-package"
              })
              diagnostic.result = result
              diagnostic.report = JSON.parse(fs.readFileSync(path.join(outDir, "context-budget-report.json"), "utf8"))
              diagnostic.manifest = fs.readFileSync(path.join(outDir, "manifest.yaml"), "utf8")
              diagnostic.input = fs.readFileSync(inputPath, "utf8")
            } catch (error) {
              diagnostic.error = String(error?.stack ?? error)
            }
            fs.writeFileSync(process.env.DIAGNOSTIC_PATH, JSON.stringify(diagnostic, null, 2) + "\n", "utf8")
          })().catch((error) => {
            fs.writeFileSync(process.env.DIAGNOSTIC_PATH, JSON.stringify({ fatal: String(error?.stack ?? error) }, null, 2) + "\n", "utf8")
            process.exitCode = 1
          })
          NODE

      - name: Capture focused test output
        working-directory: extensions/bob-code-consistency-review
        shell: bash
        run: |
          set +e
          node --test test/evidenceScopePipeline.test.js > "${RUNNER_TEMP}/evidence-scope-phase2-test.log" 2>&1
          echo $? > "${RUNNER_TEMP}/evidence-scope-phase2-test.exit-code"
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-scope-phase2-diagnostic
          path: |
            ${{ runner.temp }}/evidence-scope-phase2-diagnostic.json
            ${{ runner.temp }}/evidence-scope-phase2-test.log
            ${{ runner.temp }}/evidence-scope-phase2-test.exit-code
          if-no-files-found: error
          retention-days: 1
