name: agent-record-automatic-pause-ci

on:
  push:
    branches:
      - agent/workflow-automatic-pause-limits-20260712
    paths:
      - ".github/workflows/agent-record-automatic-pause-ci.yml"

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-automatic-pause-limits-20260712
          fetch-depth: 0
      - name: Wait for latest required workflow runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/automatic-pause-ci"
          for workflow in extensions-quality.yml workflow-contracts.yml; do
            run_id=""
            for attempt in $(seq 1 50); do
              run_id=$(gh run list \
                --repo katamor1/bob_builtin_analyze \
                --workflow "$workflow" \
                --branch agent/workflow-automatic-pause-limits-20260712 \
                --event pull_request \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty')
              if [ -n "$run_id" ]; then
                status=$(gh run view "$run_id" --repo katamor1/bob_builtin_analyze --json status --jq '.status')
                if [ "$status" = "completed" ]; then
                  break
                fi
              fi
              sleep 12
            done
            if [ -z "$run_id" ]; then
              echo "No run found for $workflow" >&2
              exit 1
            fi
            status=$(gh run view "$run_id" --repo katamor1/bob_builtin_analyze --json status --jq '.status')
            if [ "$status" != "completed" ]; then
              echo "Run $run_id for $workflow did not complete" >&2
              exit 1
            fi
            gh run view "$run_id" \
              --repo katamor1/bob_builtin_analyze \
              --json databaseId,name,displayTitle,headSha,status,conclusion,url,jobs \
              > "$RUNNER_TEMP/automatic-pause-ci/${workflow%.yml}.json"
          done
      - name: Generate final CI evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP']) / 'automatic-pause-ci'
          records = []
          for name in ('extensions-quality', 'workflow-contracts'):
              path = temp / f'{name}.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              records.append(data)

          lines = [
              '# Workflow Automatic Pause Final CI Evidence',
              '',
              '- Date: 2026-07-12',
              '- Pull request: #75',
              '- Branch: `agent/workflow-automatic-pause-limits-20260712`',
              '- Evidence source: GitHub Actions API via `gh run view`',
              '',
              'This file records the latest required pull-request workflow runs available immediately before this evidence commit. The evidence commit changes documentation and removes its one-time helper only; it does not change extension production code.',
              ''
          ]
          overall = True
          for record in records:
              conclusion = record.get('conclusion') or 'none'
              overall = overall and conclusion == 'success'
              lines.extend([
                  f"## {record['name']}",
                  '',
                  f"- run id: {record['databaseId']}",
                  f"- source head: `{record['headSha']}`",
                  f"- status: {record['status']}",
                  f"- conclusion: {conclusion}",
                  f"- URL: {record['url']}",
                  '',
                  '| Job | Status | Conclusion |',
                  '| --- | --- | --- |'
              ])
              for job in record.get('jobs', []):
                  lines.append(f"| {job.get('name','unknown')} | {job.get('status','unknown')} | {job.get('conclusion') or 'none'} |")
              lines.append('')

          lines.extend([
              '## Repository gate result',
              '',
              f"- required workflow aggregate: {'PASS' if overall else 'NOT PASSING'}",
              '- local focused/full suite, policy, package, and VSIX evidence: see `workflow-automatic-pause-2026-07-12.md`',
              '- independent review: see `workflow-automatic-pause-independent-review-2026-07-12.md`',
              '',
              '## External gates',
              '',
              '- IBM Bob real-environment automatic pause/resume/override: not run in GitHub Actions',
              '- inherited real Bazaar and multi-root checks: tracked separately',
              '- PR remains draft until repository and external release gates are explicitly accepted',
              ''
          ])
          output = Path('docs/release-evidence/workflow-automatic-pause-final-ci-2026-07-12.md')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit CI evidence
        shell: bash
        run: |
          rm .github/workflows/agent-record-automatic-pause-ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record final automatic pause CI evidence"
          git push origin HEAD:agent/workflow-automatic-pause-limits-20260712
