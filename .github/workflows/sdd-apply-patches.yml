name: SDD Apply Patches

on:
  push:
    branches:
      - agent/japanese-gui-copy-review
    paths:
      - .sdd/patches/READY

permissions:
  contents: write

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply queued patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ready=.sdd/patches/READY
          test -f "$ready"
          mapfile -t prefixes < <(
            find .sdd/patches -maxdepth 1 -type f -name '*.patch.gz.b64.part*' -print \
              | sed -E 's/\.part[0-9]+$//' \
              | sort -u
          )
          if [ "${#prefixes[@]}" -eq 0 ]; then
            echo "No queued patch parts." >&2
            exit 1
          fi

          cleanup=("$ready")
          for prefix in "${prefixes[@]}"; do
            mapfile -t parts < <(find .sdd/patches -maxdepth 1 -type f -path "${prefix}.part*" -print | sort)
            if [ "${#parts[@]}" -eq 0 ]; then
              echo "No parts found for $prefix" >&2
              exit 1
            fi
            cat "${parts[@]}" | base64 --decode | gzip --decompress > /tmp/sdd.patch
            git am --3way /tmp/sdd.patch
            cleanup+=("${parts[@]}")
          done

          git rm "${cleanup[@]}"
          git commit -m "chore: clear applied SDD patch queue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
