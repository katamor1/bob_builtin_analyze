name: SDD Apply Repaired Japanese GUI Patches

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .sdd/patches/READY

permissions:
  contents: write

concurrency:
  group: sdd-apply-japanese-gui-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-patches:
    if: >-
      github.repository == 'katamor1/bob_builtin_analyze' &&
      github.event.pull_request.number == 132 &&
      github.event.pull_request.user.login == 'katamor1' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/japanese-gui-copy-review'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply verified patch series and remove temporary queue
        id: apply
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = 'agent/japanese-gui-copy-review'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$HEAD_BRANCH"
          test "$(git rev-parse "origin/$HEAD_BRANCH")" = "$EXPECTED_HEAD"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          ready=.sdd/patches/READY
          test -f "$ready"
          grep -Fx 'apply repaired Japanese GUI patch series resolved v3 2026-07-17' "$ready"

          rm -rf /tmp/sdd-debug
          mkdir -p /tmp/sdd-debug

          capture_failure() {
            local payload=$1
            printf '%s\n' "$payload" > /tmp/sdd-debug/failed-payload.txt
            cp /tmp/sdd.patch /tmp/sdd-debug/current.patch
            git status --short > /tmp/sdd-debug/status.txt || true
            git status > /tmp/sdd-debug/status-long.txt || true
            git ls-files -u > /tmp/sdd-debug/unmerged-index.txt || true
            git diff --name-only --diff-filter=U > /tmp/sdd-debug/conflicts.txt || true
            git diff > /tmp/sdd-debug/working.diff || true
            git am --show-current-patch=diff > /tmp/sdd-debug/am-current.patch 2>&1 || true
            while IFS= read -r path; do
              test -n "$path" || continue
              safe=$(printf '%s' "$path" | sha256sum | cut -d' ' -f1)
              mkdir -p "/tmp/sdd-debug/files/$safe"
              printf '%s\n' "$path" > "/tmp/sdd-debug/files/$safe/path.txt"
              git show ":1:$path" > "/tmp/sdd-debug/files/$safe/base" 2>/dev/null || true
              git show ":2:$path" > "/tmp/sdd-debug/files/$safe/ours" 2>/dev/null || true
              git show ":3:$path" > "/tmp/sdd-debug/files/$safe/theirs" 2>/dev/null || true
              cp -- "$path" "/tmp/sdd-debug/files/$safe/worktree" 2>/dev/null || true
            done < /tmp/sdd-debug/conflicts.txt
          }

          mapfile -t payloads < <(
            find .sdd/patches -maxdepth 1 -type f \
              \( -name '*.patch.gz.b64' -o -name '*.patch.gz.b64.part00' \) \
              -print | sort
          )
          test "${#payloads[@]}" -eq 4

          for payload in "${payloads[@]}"; do
            case "$(basename "$payload")" in
              0001-*) expected_patch_sha='6c7c6abf2a48678588be49107b7d3c997375ce713f654a761ff70fa3299a1c5d' ;;
              0002-*) expected_patch_sha='ae757b1157dbeec862b7222f05bd04529d0b814f719e1ffdd3f4c20bd62eb0a5' ;;
              0003-*) expected_patch_sha='65b6626ca2a8ac66f62d2ceebc62c05d5126f47f968e8443c3fb449345db2950' ;;
              0004-*) expected_patch_sha='e63ae3ef08f07668ccaaf39a8b5a2158eb42498d56aa6e9544dd5094afa680e3' ;;
              *) echo "Unexpected payload: $payload" >&2; exit 1 ;;
            esac

            python - "$payload" "$expected_patch_sha" <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path
          import sys

          payload = Path(sys.argv[1])
          expected = sys.argv[2]
          if payload.name.endswith('.part00'):
              prefix = payload.name.removesuffix('.part00')
              parts = sorted(payload.parent.glob(prefix + '.part*'))
              expected_parts = [
                  prefix + '.part00',
                  prefix + '.part01a',
                  prefix + '.part01b',
                  prefix + '.part02a',
                  prefix + '.part02b',
                  prefix + '.part03',
              ]
              if [part.name for part in parts] != expected_parts:
                  raise SystemExit(f'Unexpected split payload set: {[part.name for part in parts]}')
              encoded_parts = []
              for part in parts:
                  data = part.read_bytes()
                  if part.name.endswith('.part01b'):
                      if len(data) != 6001 or data[-1:] != b'4':
                          raise SystemExit('The reviewed one-byte split corruption is not present exactly as expected')
                      data = data[:-1]
                  encoded_parts.append(data)
              encoded = b''.join(encoded_parts)
          else:
              encoded = payload.read_bytes()

          compressed = base64.b64decode(encoded, validate=True)
          patch = gzip.decompress(compressed)
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'Patch digest mismatch: expected {expected}, got {actual}')
          Path('/tmp/sdd.patch').write_bytes(patch)
          PY

            echo "Applying $(basename "$payload")"
            if ! git am --3way /tmp/sdd.patch; then
              conflict_path='extensions/bob-code-consistency-review/src/webview/consistencyReviewWizardHtml.ts'
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
              if [[ $(basename "$payload") == 0003-* && ${#conflicts[@]} -eq 1 && "${conflicts[0]}" == "$conflict_path" ]]; then
                python - "$conflict_path" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          heading_conflict = '''<<<<<<< HEAD
            <h1>Consistency Review Wizard</h1>
            ${renderWorkspaceInitialization(model.initialization)}
          =======
            <h1>整合プレレビューを開始</h1>
          >>>>>>> feat: localize consistency review GUI surfaces'''
          heading_resolution = '''  <h1>整合プレレビューを開始</h1>
            ${renderWorkspaceInitialization(model.initialization)}'''
          status_conflict = '''<<<<<<< HEAD
              <h2>Status</h2>
              <div id="status" class="status ${escapeHtml(model.status.tone)}">${escapeHtml(model.status.message)}</div>
          =======
              <h2>実行結果</h2>
              <div id="status" class="status ${model.warnings.length > 0 ? "warning" : "muted"}">${escapeHtml(model.warnings.join("\\n") || "未実行")}</div>
          >>>>>>> feat: localize consistency review GUI surfaces'''
          status_resolution = '''    <h2>実行結果</h2>
              <div id="status" class="status ${escapeHtml(model.status.tone)}">${escapeHtml(model.status.message)}</div>'''
          if text.count(heading_conflict) != 1 or text.count(status_conflict) != 1:
              raise SystemExit('The reviewed wizard conflict shape changed')
          text = text.replace(heading_conflict, heading_resolution, 1)
          text = text.replace(status_conflict, status_resolution, 1)
          if any(marker in text for marker in ('<<<<<<<', '=======', '>>>>>>>')):
              raise SystemExit('Conflict markers remain after deterministic resolution')
          path.write_text(text, encoding='utf-8')
          PY
                git add "$conflict_path"
                GIT_EDITOR=true git am --continue
              else
                capture_failure "$payload"
                exit 1
              fi
            fi
          done

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('extensions/workflow-register/package.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          props = data['contributes']['configuration']['properties']
          expected = {
              'workflowRegister.taskSnapshots.maxBytes': 1048576,
              'workflowRegister.taskSnapshots.maxPerRun': 500,
          }
          for key, maximum in expected.items():
              current = props[key]
              if current.get('maximum') not in (None, maximum):
                  raise SystemExit(f'Unexpected maximum for {key}: {current.get("maximum")}')
              rebuilt = {}
              inserted = False
              for field, value in current.items():
                  if field == 'description':
                      rebuilt['maximum'] = maximum
                      inserted = True
                  if field != 'maximum':
                      rebuilt[field] = value
              if not inserted:
                  rebuilt['maximum'] = maximum
              props[key] = rebuilt
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          progress = Path('docs/implementation/three-extension-japanese-gui-copy-progress.md')
          marker = '<!-- INTEGRATION-COMPLETION-2026-07-17 -->'
          text = progress.read_text(encoding='utf-8')
          if marker not in text:
              text = text.rstrip() + f'''\n\n{marker}\n## Integration completion (2026-07-17)\n\n- Repaired the reviewed one-byte split corruption in the Bazaar GUI patch payload.\n- Verified SHA-256 for all four decoded mail patches before application.\n- Preserved the Review Wizard workspace-initialization card and model-backed status while localizing the surrounding GUI.\n- Applied the Japanese GUI and terminology series on top of the current `main`.\n- Preserved workflow-register task snapshot maximums introduced by the runtime-blocker remediation.\n- Removed the temporary SDD workflow and encoded patch queue in the same cleanup commit.\n'''
              progress.write_text(text, encoding='utf-8')
          PY

          git rm -r .sdd/patches .github/workflows/sdd-apply-patches.yml
          git add extensions/workflow-register/package.json \
            docs/implementation/three-extension-japanese-gui-copy-progress.md
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'chore: finalize Japanese GUI integration and clear patch queue'
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Upload patch conflict diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: japanese-gui-patch-conflict-${{ github.run_id }}
          path: /tmp/sdd-debug
          if-no-files-found: error
          retention-days: 1

      - name: Fail after diagnostics are uploaded
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: exit 1
