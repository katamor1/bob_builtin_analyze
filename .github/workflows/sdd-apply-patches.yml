name: SDD Apply Patches

on:
  push:
    branches:
      - agent/workflow-register-japanese-finish
    paths:
      - .sdd/patches/TRIGGER

permissions:
  contents: write

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply queued patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ready=.sdd/patches/READY
          test -f "$ready"
          expected="$(tr -d '\r\n' < "$ready")"
          mapfile -t parts < <(find .sdd/patches -maxdepth 1 -type f -name 'payload.diff.bz2.b64.part*' | sort)
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "No patch parts found." >&2
            exit 1
          fi

          cat "${parts[@]}" | base64 --decode > /tmp/payload.diff.bz2
          actual="$(sha256sum /tmp/payload.diff.bz2 | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "Patch digest mismatch: expected=$expected actual=$actual" >&2
            exit 1
          fi
          bzip2 --decompress --stdout /tmp/payload.diff.bz2 > /tmp/payload.diff
          git apply --check /tmp/payload.diff
          git apply --index --whitespace=nowarn /tmp/payload.diff
          git diff --cached --check
          git commit -m "feat: finish workflow-register Japanese GUI copy"

          git rm -r .sdd/patches .github/workflows/sdd-apply-patches.yml
          git commit -m "chore: remove temporary workflow GUI patch transport"
          git push origin "HEAD:${GITHUB_REF_NAME}"
