name: SDD Apply Patches

on:
  push:
    branches:
      - agent/japanese-gui-copy-review
    paths:
      - .sdd/patches/READY

permissions:
  contents: write

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply queued patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ready=.sdd/patches/READY
          test -f "$ready"
          mapfile -t payloads < <(
            find .sdd/patches -maxdepth 1 -type f \
              \( -name '*.patch.gz.b64' -o -name '*.patch.gz.b64.part00' \) \
              -print | sort
          )
          if [ "${#payloads[@]}" -eq 0 ]; then
            echo "No queued patches." >&2
            exit 1
          fi

          cleanup=("$ready")
          for payload in "${payloads[@]}"; do
            if [[ "$payload" == *.part00 ]]; then
              prefix="${payload%.part00}"
              mapfile -t parts < <(find .sdd/patches -maxdepth 1 -type f -path "${prefix}.part*" -print | sort)
              if [ "${#parts[@]}" -eq 0 ]; then
                echo "No parts found for $prefix" >&2
                exit 1
              fi
              cat "${parts[@]}" | base64 --decode | gzip --decompress > /tmp/sdd.patch
              cleanup+=("${parts[@]}")
            else
              base64 --decode "$payload" | gzip --decompress > /tmp/sdd.patch
              cleanup+=("$payload")
            fi
            git am --3way /tmp/sdd.patch
          done

          git rm "${cleanup[@]}"
          git commit -m "chore: clear applied SDD patch queue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
