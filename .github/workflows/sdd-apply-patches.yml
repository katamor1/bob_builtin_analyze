name: SDD Apply Patches

on:
  push:
    branches:
      - agent/japanese-gui-copy-review
    paths:
      - .sdd/patches/READY

permissions:
  contents: write

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply queued patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          ready=.sdd/patches/READY
          test -f "$ready"
          mapfile -d '' patches < <(find .sdd/patches -maxdepth 1 -type f -name '*.patch.gz.b64' -print0 2>/dev/null | sort -z)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "No queued patches." >&2
            exit 1
          fi

          for patch in "${patches[@]}"; do
            base64 --decode "$patch" | gzip --decompress > /tmp/sdd.patch
            git am --3way /tmp/sdd.patch
          done

          git rm "$ready" "${patches[@]}"
          git commit -m "chore: clear applied SDD patch queue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
