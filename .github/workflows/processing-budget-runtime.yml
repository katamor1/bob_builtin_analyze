name: processing-budget-runtime
run-name: ${{ github.event_name == 'workflow_dispatch' && format('wave0a-{0}-{1}', inputs.expectedHeadSha, inputs.dispatchNonce) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

on:
  pull_request:
    paths:
      - "packages/processing-budget-runtime/**"
      - "extensions/bob-bazaar-review/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/t14-bounded-document*"
      - "scripts/t15-aggregate-installed*"
      - "scripts/t16-input-process-installed*"
      - "scripts/t17-deadline-installed*"
      - "extensions/workflow-register/**"
      - "scripts/t17-path-installed*"
      - "scripts/t17-path-native-unc-fixture.*"
      - "tools/main-consolidation/pathAdmissionPolicy.mjs"
      - "tools/main-consolidation/path-source-admission.json"
      - "tools/main-consolidation/test/pathAdmissionPolicy.test.mjs"
      - "tools/main-consolidation/test/helpers/pathAdmissionFixture.mjs"
      - "docs/release-evidence/proc-t17-path-source-coverage-2026-11-04.json"
      - "tools/main-consolidation/deadlineAdmissionPolicy.mjs"
      - "tools/main-consolidation/deadline-source-admission.json"
      - "tools/main-consolidation/test/deadlineAdmissionPolicy.test.mjs"
      - "tools/main-consolidation/test/helpers/deadlineAdmissionFixture.mjs"
      - "docs/release-evidence/proc-t17-deadline-source-coverage-2026-11-02.json"
      - "tools/main-consolidation/inputProcessAdmissionPolicy.mjs"
      - "tools/main-consolidation/input-process-source-admission.json"
      - "tools/main-consolidation/test/inputProcessAdmissionPolicy.test.mjs"
      - "tools/main-consolidation/test/helpers/inputProcessAdmissionFixture.mjs"
      - "docs/release-evidence/proc-t16-input-process-source-coverage-2026-10-31.json"
      - "tools/main-consolidation/aggregateDocumentAdmissionPolicy.mjs"
      - "tools/main-consolidation/aggregate-document-source-admission.json"
      - "tools/main-consolidation/test/aggregateDocumentAdmissionPolicy.test.mjs"
      - "docs/release-evidence/proc-t15-aggregate-source-coverage-2026-10-26.json"
      - "scripts/processing-runtime-build-workflow.test.js"
      - "tools/main-consolidation/processingBudgetAdmissionPolicy.mjs"
      - "tools/main-consolidation/processing-budget-source-admission.json"
      - "tools/main-consolidation/test/processingBudgetAdmissionPolicy.test.mjs"
      - "docs/release-evidence/proc-t13-ledger-source-coverage-2026-10-23.json"
      - "tools/main-consolidation/exact-head-ci-contract.json"
      - "scripts/exact-head-ci-contract.test.js"
      - ".gitattributes"
      - ".github/workflows/processing-budget-runtime.yml"
      - "scripts/verify-ci-head*.js"
      - "extensions/bob-bazaar-review/src/ruleAuthoring/ruleAuthoringLimits.ts"
  push:
    branches: [main]
    paths:
      - "packages/processing-budget-runtime/**"
      - "extensions/bob-bazaar-review/**"
      - "extensions/bob-code-consistency-review/**"
      - "scripts/t14-bounded-document*"
      - "scripts/t15-aggregate-installed*"
      - "scripts/t16-input-process-installed*"
      - "scripts/t17-deadline-installed*"
      - "extensions/workflow-register/**"
      - "scripts/t17-path-installed*"
      - "scripts/t17-path-native-unc-fixture.*"
      - "tools/main-consolidation/pathAdmissionPolicy.mjs"
      - "tools/main-consolidation/path-source-admission.json"
      - "tools/main-consolidation/test/pathAdmissionPolicy.test.mjs"
      - "tools/main-consolidation/test/helpers/pathAdmissionFixture.mjs"
      - "docs/release-evidence/proc-t17-path-source-coverage-2026-11-04.json"
      - "tools/main-consolidation/deadlineAdmissionPolicy.mjs"
      - "tools/main-consolidation/deadline-source-admission.json"
      - "tools/main-consolidation/test/deadlineAdmissionPolicy.test.mjs"
      - "tools/main-consolidation/test/helpers/deadlineAdmissionFixture.mjs"
      - "docs/release-evidence/proc-t17-deadline-source-coverage-2026-11-02.json"
      - "tools/main-consolidation/inputProcessAdmissionPolicy.mjs"
      - "tools/main-consolidation/input-process-source-admission.json"
      - "tools/main-consolidation/test/inputProcessAdmissionPolicy.test.mjs"
      - "tools/main-consolidation/test/helpers/inputProcessAdmissionFixture.mjs"
      - "docs/release-evidence/proc-t16-input-process-source-coverage-2026-10-31.json"
      - "tools/main-consolidation/aggregateDocumentAdmissionPolicy.mjs"
      - "tools/main-consolidation/aggregate-document-source-admission.json"
      - "tools/main-consolidation/test/aggregateDocumentAdmissionPolicy.test.mjs"
      - "docs/release-evidence/proc-t15-aggregate-source-coverage-2026-10-26.json"
      - "scripts/processing-runtime-build-workflow.test.js"
      - "tools/main-consolidation/processingBudgetAdmissionPolicy.mjs"
      - "tools/main-consolidation/processing-budget-source-admission.json"
      - "tools/main-consolidation/test/processingBudgetAdmissionPolicy.test.mjs"
      - "docs/release-evidence/proc-t13-ledger-source-coverage-2026-10-23.json"
      - "tools/main-consolidation/exact-head-ci-contract.json"
      - "scripts/exact-head-ci-contract.test.js"
      - ".gitattributes"
      - ".github/workflows/processing-budget-runtime.yml"
      - "scripts/verify-ci-head*.js"
      - "extensions/bob-bazaar-review/src/ruleAuthoring/ruleAuthoringLimits.ts"
  workflow_dispatch:
    inputs:
      expectedHeadSha:
        description: Full commit SHA to check out and verify
        required: true
        type: string
      dispatchNonce:
        description: Machine-generated 32-character lowercase hex correlation ID
        required: true
        type: string

concurrency:
  group: processing-budget-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Processing budget / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}

      - name: Verify checked-out commit
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expectedHeadSha || github.event.pull_request.head.sha || github.sha }}
          DISPATCH_HEAD_SHA: ${{ inputs.expectedHeadSha }}
          DISPATCH_NONCE: ${{ inputs.dispatchNonce }}
        run: node scripts/verify-ci-head.js

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Fetch immutable admission subjects
        run: |
          git fetch --no-tags --depth=1 --no-write-fetch-head origin a826dc20c0e71f472401adf644ca8cc777b74c58
          git fetch --no-tags --depth=1 --no-write-fetch-head origin 7fc7a371e6506290d8626d06e9b12c2a67888b47
          git fetch --no-tags --depth=1 --no-write-fetch-head origin b3d18e2d9c3aa272f861a28c69e8e963572186c8
          git fetch --no-tags --depth=1 --no-write-fetch-head origin 49f39e1a6ec35e5db98e9ef698d4ce43369c9760
          git cat-file -e b3d18e2d9c3aa272f861a28c69e8e963572186c8^{commit}
          git cat-file -e 49f39e1a6ec35e5db98e9ef698d4ce43369c9760^{commit}
          git cat-file -e a826dc20c0e71f472401adf644ca8cc777b74c58^{commit}
          git cat-file -e 7fc7a371e6506290d8626d06e9b12c2a67888b47^{commit}
          git fetch --no-tags --depth=1 --no-write-fetch-head origin 6ce384313c1072e34ced342260304c9c7dd07e9e
          git fetch --no-tags --depth=1 --no-write-fetch-head origin 7ea786afd5715d841526000a402c831d6c2a203c
          git cat-file -e 6ce384313c1072e34ced342260304c9c7dd07e9e^{commit}
          git cat-file -e 7ea786afd5715d841526000a402c831d6c2a203c^{commit}
          git fetch --no-tags --depth=1 --no-write-fetch-head origin cf96788dbdd6836b449b7a31ecd3bae4ee4302a4
          git cat-file -e cf96788dbdd6836b449b7a31ecd3bae4ee4302a4^{commit}

      - name: Prepare physical evidence root
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const base=path.join(fs.realpathSync(process.env.RUNNER_TEMP),'bob-processing-budget-runtime');
          fs.mkdirSync(base,{recursive:true});
          const root=fs.mkdtempSync(path.join(base,'evidence-'));
          fs.appendFileSync(process.env.GITHUB_ENV,'PROCESSING_BUDGET_ARTIFACT_ROOT='+fs.realpathSync(root)+'\n');
          fs.writeFileSync(path.join(root,'run-subject.json'),JSON.stringify({head:process.env.CI_VERIFIED_HEAD_SHA,runner:process.env.RUNNER_OS})+'\n',{flag:'wx'});
          fs.appendFileSync(process.env.GITHUB_ENV,'npm_config_cache='+path.join(fs.realpathSync(root),'npm-cache')+'\n');
          NODE

      - name: Install standalone package
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix packages/processing-budget-runtime
          npm ci --ignore-scripts --no-audit --no-fund --prefix extensions/workflow-register
          npm ci --prefix extensions/bob-bazaar-review
          npm ci --prefix extensions/bob-code-consistency-review

      - name: Test standalone package and installed consumers
        run: npm test --prefix packages/processing-budget-runtime

      - name: Build and package companion runtime artifacts
        run: |
          set -euo pipefail
          npm run package --prefix extensions/bob-bazaar-review
          npm run package:policy --prefix extensions/bob-bazaar-review
          npm run package:smoke --prefix extensions/bob-bazaar-review
          npm run package --prefix extensions/bob-code-consistency-review
          npm run package:policy --prefix extensions/bob-code-consistency-review
          npm run package --prefix extensions/workflow-register
          npm run package:policy --prefix extensions/workflow-register
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const caps={'bob-bazaar-review':12000000,'bob-code-consistency-review':11000000,'workflow-register':1200000};
          const rows=Object.entries(caps).map(([id,cap])=>{
            const folder=path.resolve('extensions',id);
            const pkg=JSON.parse(fs.readFileSync(path.join(folder,'package.json')));
            const file=path.join(folder,id+'-'+pkg.version+'.vsix');
            const bytes=fs.readFileSync(file);
            if(bytes.length<=0||bytes.length>cap)throw Error('VSIX capacity mismatch: '+id);
            return {id:'local.'+id,cap,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')};
          });
          fs.writeFileSync(path.join(process.env.PROCESSING_BUDGET_ARTIFACT_ROOT,'policy-vsix.json'),JSON.stringify(rows,null,2)+'\n',{flag:'wx'});
          NODE

      - name: Verify document build and artifact contracts
        run: node --test scripts/processing-runtime-build-workflow.test.js scripts/t14-bounded-document-installed-smoke.test.mjs scripts/t15-aggregate-installed-smoke.test.mjs scripts/t16-input-process-installed-smoke.test.mjs scripts/t17-deadline-installed-smoke.test.mjs scripts/t17-path-installed-smoke.test.mjs scripts/t17-path-native-unc-fixture.test.mjs scripts/extension-host-smoke-contract.test.js scripts/three-extension-ui-contract-workflow.test.js

      - name: Prepare owned native UNC fixture
        if: runner.os == 'Windows'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const nonce=crypto.randomBytes(16).toString('hex');
          const temp=fs.realpathSync.native(process.env.RUNNER_TEMP);
          const fixture=path.join(temp,'t17path-files-'+nonce);
          const evidence=path.join(process.env.PROCESSING_BUDGET_ARTIFACT_ROOT,'t17path-unc-'+nonce);
          const cleanup=path.join(temp,'t17path-cleanup-'+nonce);
          fs.appendFileSync(process.env.GITHUB_ENV,[
            'T17_PATH_UNC_ROOT='+fixture,'T17_PATH_UNC_EVIDENCE='+evidence,
            'T17_PATH_UNC_CLEANUP='+cleanup,'T17_PATH_NATIVE_UNC_MANIFEST='+path.join(evidence,'native-unc-fixture.json')
          ].join('\n')+'\n');
          const result=spawnSync(process.execPath,['scripts/t17-path-native-unc-fixture.mjs','--prepare',
            '--fixture-root',fixture,'--evidence-root',evidence,'--nonce',nonce],{stdio:'inherit'});
          if(result.status!==0)throw Error('Windows native UNC fixture is required');
          NODE


      - name: Prepare installed document artifacts
        id: document-artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"; import path from "node:path"; import crypto from "node:crypto";
          import {createArtifactManifest} from "./scripts/t17-path-installed-smoke.mjs";
          const manifest=await createArtifactManifest(process.cwd(),process.env.PROCESSING_BUDGET_ARTIFACT_ROOT);
          const policy=JSON.parse(fs.readFileSync(path.join(process.env.PROCESSING_BUDGET_ARTIFACT_ROOT,'policy-vsix.json')));
          const input=JSON.parse(fs.readFileSync(manifest));
          if(input.extensions.length!==policy.length)throw Error('policy and installed VSIX inventory differs');
          for(const [index,item] of input.extensions.entries()){
            const expected=policy[index];
            if(item.id!==expected.id||item.vsix.sha256!==expected.sha256||item.vsix.bytes!==expected.bytes)
              throw Error('policy and installed VSIX bytes differ: '+item.id);
          }
          const evidenceRoot=path.join(process.env.PROCESSING_BUDGET_ARTIFACT_ROOT,"installed-host-"+crypto.randomBytes(8).toString("hex"));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,"manifest="+manifest+"\ninput_root="+path.dirname(manifest)+"\nevidence_root="+evidenceRoot+"\n");
          NODE

      - name: Install pinned document host tooling after packaging
        run: npm install --no-save --package-lock=false --ignore-scripts --audit=false --fund=false @vscode/test-cli@0.0.12 @vscode/test-electron@2.5.2 --prefix extensions/bob-bazaar-review

      - name: Verify installed document runtime on Ubuntu
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/t17-path-installed-smoke.mjs --artifacts "${{ steps.document-artifacts.outputs.manifest }}" --evidence-root "${{ steps.document-artifacts.outputs.evidence_root }}"

      - name: Verify installed document runtime on Windows
        if: runner.os == 'Windows'
        run: node scripts/t17-path-installed-smoke.mjs --artifacts "${{ steps.document-artifacts.outputs.manifest }}" --evidence-root "${{ steps.document-artifacts.outputs.evidence_root }}"

      - name: Dispose owned native UNC fixture if needed
        if: always() && runner.os == 'Windows' && env.T17_PATH_UNC_EVIDENCE != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const manifest=process.env.T17_PATH_NATIVE_UNC_MANIFEST;
          if(!fs.existsSync(manifest))process.exit(0);
          const cleanup=process.env.T17_PATH_UNC_CLEANUP;
          const ready=JSON.parse(fs.readFileSync(manifest,'utf8'));
          const binding=file=>{
            const bytes=fs.readFileSync(file);
            return {path:fs.realpathSync(file),bytes:bytes.length,sha256:createHash('sha256').update(bytes).digest('hex')};
          };
          const original=path.join(cleanup,'native-unc-cleanup.json');
          const proof=path.join(process.env.T17_PATH_UNC_EVIDENCE,'portable');
          fs.mkdirSync(proof);
          try {
            if(!fs.existsSync(original)){
              const target=fs.existsSync(cleanup)?cleanup+'-recovery':cleanup;
              const result=spawnSync(process.execPath,['scripts/t17-path-native-unc-fixture.mjs','--dispose',
                '--fixture-manifest',manifest,'--evidence-root',target],{stdio:'inherit'});
              if(result.status!==0)throw Error('owned UNC cleanup did not complete');
            }
          } finally {
            for(const root of [cleanup,cleanup+'-recovery']){
              if(!fs.existsSync(root))continue;
              fs.cpSync(root,path.join(proof,path.basename(root)),{recursive:true,force:false,errorOnExist:true});
            }
            const physical=process.env.T17_PATH_UNC_ROOT;
            const files={
              ownerMarker:[path.join(physical,'.t17-path-owner.json'),'owner-marker.json'],
              probeFile:[path.join(physical,'日本語 space.txt'),'probe-file.txt'],
              nestedProbeFile:[path.join(physical,'content','inner.txt'),'nested-probe-file.txt'],
              powershellScript:[path.resolve('scripts/t17-path-native-unc-fixture.ps1'),'driver.ps1'],
              driverScript:[path.resolve('scripts/t17-path-native-unc-fixture.mjs'),'driver.mjs']
            };
            const rows=[];
            for(const [key,[source,name]] of Object.entries(files)){
              const measured=binding(source),expected=ready.bindings[key];
              const driveCase=file=>file.replace(/^[a-z]:/,drive=>drive.toUpperCase());
              if(driveCase(measured.path)!==driveCase(expected.path)||measured.bytes!==expected.bytes||measured.sha256!==expected.sha256)
                throw Error('portable UNC fixture binding mismatch: '+key);
              fs.copyFileSync(source,path.join(proof,name),fs.constants.COPYFILE_EXCL);
              rows.push({key,name,original:expected});
            }
            fs.writeFileSync(path.join(proof,'input-bindings.json'),JSON.stringify(rows,null,2)+'\n',{flag:'wx'});
          }
          NODE


      - name: Upload installed document runtime proof
        if: always() && env.PROCESSING_BUDGET_ARTIFACT_ROOT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t17-path-${{ matrix.os }}
          path: |
            ${{ env.PROCESSING_BUDGET_ARTIFACT_ROOT }}/t17path-artifacts-*
            ${{ env.PROCESSING_BUDGET_ARTIFACT_ROOT }}/t17path-unc-*
            ${{ env.PROCESSING_BUDGET_ARTIFACT_ROOT }}/policy-vsix.json
            ${{ env.PROCESSING_BUDGET_ARTIFACT_ROOT }}/run-subject.json
            ${{ steps.document-artifacts.outputs.evidence_root }}/receipt.json
            ${{ steps.document-artifacts.outputs.evidence_root }}/logs
            ${{ steps.document-artifacts.outputs.evidence_root }}/user-data/logs
          if-no-files-found: error

      - name: Verify literal admission and current product limits
        run: node --test --test-concurrency=1 tools/main-consolidation/test/processingBudgetAdmissionPolicy.test.mjs tools/main-consolidation/test/aggregateDocumentAdmissionPolicy.test.mjs tools/main-consolidation/test/boundedDocumentAdmissionPolicy.test.mjs tools/main-consolidation/test/gateRMainAdmissionPolicy.test.mjs scripts/exact-head-ci-contract.test.js tools/main-consolidation/test/inputProcessAdmissionPolicy.test.mjs tools/main-consolidation/test/deadlineAdmissionPolicy.test.mjs tools/main-consolidation/test/pathAdmissionPolicy.test.mjs

      - name: Bind actual installed package evidence
        id: evidence
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const h=require('./packages/processing-budget-runtime/test/helpers.js');
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const tree=cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          if(head!==process.env.CI_VERIFIED_HEAD_SHA)throw Error('guard identity changed');
          const proof=h.packAndInstall(h.packageRoot,h.freshArtifactRoot('ci-pack'));
          const output=h.publishCiArtifacts({head,tree,os:process.env.MATRIX_OS,proof,outputRoot:h.freshArtifactRoot('ci-publication')});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'path='+output+'\n');
          NODE

      - name: Upload installed runtime evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: processing-budget-runtime-${{ matrix.os }}
          path: ${{ steps.evidence.outputs.path }}
          if-no-files-found: error
