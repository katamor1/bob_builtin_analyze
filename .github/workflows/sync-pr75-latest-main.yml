name: sync-pr75-latest-main

on:
  pull_request:
    paths:
      - .github/workflows/sync-pr75-latest-main.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge latest main and resolve the bounded overlap
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          conflict_file="extensions/bob-code-consistency-review/test/traceabilityCatalogStore.test.js"
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if (( merge_status != 0 )); then
            if (( ${#conflicts[@]} != 1 )) || [[ "${conflicts[0]}" != "$conflict_file" ]]; then
              printf 'Unexpected merge conflicts:\n'
              printf '  %s\n' "${conflicts[@]}"
              exit 1
            fi

            git checkout --theirs -- "$conflict_file"
            python - <<'PY'
          from pathlib import Path

          path = Path("extensions/bob-code-consistency-review/test/traceabilityCatalogStore.test.js")
          text = path.read_text(encoding="utf-8")

          old = "const barrier = installTargetTempOpenBarrier("
          if text.count(old) != 3:
              raise SystemExit(f"expected 3 barrier call sites, found {text.count(old)}")
          text = text.replace(old, "const barrier = await installTargetTempOpenBarrier(")

          old_assert = '  assert.equal(path.dirname(aliasWinner.backupPath), path.dirname(directPath))\n'
          new_assert = '''  assert.equal(
            normalizePhysicalPath(await fs.realpath(path.dirname(aliasWinner.backupPath))),
            normalizePhysicalPath(await fs.realpath(path.dirname(directPath)))
          )
          '''
          if old_assert not in text:
              raise SystemExit("backup-path assertion anchor not found")
          text = text.replace(old_assert, new_assert, 1)

          old_function = '''function installTargetTempOpenBarrier(targetPath) {
            const originalOpen = fs.open
            const expectedDirectory = normalizePhysicalPath(path.dirname(targetPath))
          '''
          new_function = '''async function installTargetTempOpenBarrier(targetPath) {
            const originalOpen = fs.open
            const expectedDirectory = normalizePhysicalPath(await resolvePotentialPhysicalPath(path.dirname(targetPath)))
          '''
          if old_function not in text:
              raise SystemExit("temp-open barrier anchor not found")
          text = text.replace(old_function, new_function, 1)

          helper_anchor = "function normalizePhysicalPath(value) {\n"
          helper = '''async function resolvePotentialPhysicalPath(value) {
            const suffix = []
            let current = path.resolve(value)
            while (true) {
              try {
                return path.join(await fs.realpath(current), ...suffix)
              } catch (error) {
                if (!error || error.code !== "ENOENT") throw error
                const parent = path.dirname(current)
                if (parent === current) throw error
                suffix.unshift(path.basename(current))
                current = parent
              }
            }
          }

          '''
          if helper_anchor not in text:
              raise SystemExit("physical-path helper anchor not found")
          if "async function resolvePotentialPhysicalPath(value)" not in text:
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          path.write_text(text, encoding="utf-8")
          PY
            git add "$conflict_file"
          elif (( ${#conflicts[@]} != 0 )); then
            printf 'Merge reported success but left conflicts:\n'
            printf '  %s\n' "${conflicts[@]}"
            exit 1
          fi

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --check

      - name: Verify Automatic pause after reconciliation
        working-directory: extensions/workflow-register
        run: |
          npm ci
          npm run compile
          node --test \
            test/runStateStorePathBoundary.test.js \
            test/workflowAutomaticPauseContractHardening.test.js \
            test/workflowAutomaticPauseDefinition.test.js \
            test/workflowAutomaticPauseDiagnostics.test.js \
            test/workflowAutomaticPauseEngine.test.js \
            test/workflowAutomaticPauseEvaluator.test.js \
            test/workflowAutomaticPauseLocalCutoff.test.js \
            test/workflowAutomaticPauseOverride.test.js \
            test/workflowAutomaticPauseResume.test.js \
            test/workflowAutomaticPauseResumeUi.test.js \
            test/workflowAutomaticPauseRunControlReport.test.js \
            test/workflowAutomaticPauseRuntimeWiring.test.js \
            test/workflowAutomaticPauseSettings.test.js \
            test/workflowRunLockHeartbeatContention.test.js

      - name: Verify reconciled traceability regression
        working-directory: extensions/bob-code-consistency-review
        run: |
          npm ci
          npm run compile
          node --test test/traceabilityCatalogStore.test.js

      - name: Commit verified reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sync-pr75-latest-main.yml
          git add -A
          git diff --cached --check
          git commit -m "merge: synchronize automatic pause with latest main"
          git push origin HEAD:${{ github.head_ref }}
