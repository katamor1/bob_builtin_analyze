name: retire-superseded-branches

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/retire-superseded-branches.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: retire-superseded-branches
  cancel-in-progress: false

jobs:
  reconcile-retire-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact execution branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify and bind exact execution head
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "katamor1/bob_builtin_analyze"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git checkout -B integration/retire-superseded-branches-20260716 "$PR_HEAD_SHA"
          test "$(git branch --show-current)" = "integration/retire-superseded-branches-20260716"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          test -z "$(git status --porcelain=v1)"
          test -f .github/retirement/branch-retirement-payload.b64

      - name: Decode reviewed implementation payload
        shell: bash
        run: |
          set -euo pipefail
          payload_root="$RUNNER_TEMP/branch-retirement-payload"
          rm -rf "$payload_root"
          mkdir -p "$payload_root"
          base64 --decode .github/retirement/branch-retirement-payload.b64 \
            | tar -xzf - -C "$payload_root"
          test -f "$payload_root/tools/branch-retirement/branch-retirement-map.json"
          test -f "$payload_root/tools/branch-retirement/audit-branch-retirement.mjs"
          test -f "$payload_root/tools/branch-retirement/delete-retired-branches.mjs"
          echo "PAYLOAD_ROOT=$payload_root" >> "$GITHUB_ENV"

      - name: Run branch-retirement unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test "$PAYLOAD_ROOT"/tools/branch-retirement/test/*.test.mjs
          node --check "$PAYLOAD_ROOT/tools/branch-retirement/audit-branch-retirement.mjs"
          node --check "$PAYLOAD_ROOT/tools/branch-retirement/delete-retired-branches.mjs"

      - name: Generate fresh reconciliation manifest
        id: audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          set +e
          node "$PAYLOAD_ROOT/tools/branch-retirement/audit-branch-retirement.mjs" \
            --repository "$GITHUB_REPOSITORY" \
            --remote origin \
            --base main \
            --map "$PAYLOAD_ROOT/tools/branch-retirement/branch-retirement-map.json" \
            --json "$RUNNER_TEMP/branch-retirement-reconciliation.json" \
            --markdown "$RUNNER_TEMP/branch-retirement-reconciliation.md" \
            2>&1 | tee "$RUNNER_TEMP/branch-retirement-audit.log"
          audit_status=${PIPESTATUS[0]}
          set -e

          {
            echo "## Branch retirement fresh audit"
            echo
            echo "Run: \`$GITHUB_RUN_ID\`"
            echo
            if [[ -f "$RUNNER_TEMP/branch-retirement-reconciliation.json" ]]; then
              jq -r '"- ready_for_deletion: `\(.ready_for_deletion)`\n- mainProtected: `\(.mainProtected)`\n- deletable: `\(.counts.deletable)`\n- already absent: `\(.counts.alreadyAbsent)`\n- blocked: `\(.counts.blocked)`"' "$RUNNER_TEMP/branch-retirement-reconciliation.json"
              echo
              echo "### Blockers"
              jq -r '.entries[] | select((.blockers | length) > 0) | "- `\(.branch)`: \(.blockers | join("; "))"' "$RUNNER_TEMP/branch-retirement-reconciliation.json"
            else
              echo "The audit did not produce a manifest."
              echo
              echo '```text'
              tail -80 "$RUNNER_TEMP/branch-retirement-audit.log"
              echo '```'
            fi
          } > "$RUNNER_TEMP/branch-retirement-audit-comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/branch-retirement-audit-comment.md"

          if [[ $audit_status -ne 0 ]]; then
            exit "$audit_status"
          fi
          jq -e '.ready_for_deletion == true' "$RUNNER_TEMP/branch-retirement-reconciliation.json"
          jq -e '.blockedBranches | length == 0' "$RUNNER_TEMP/branch-retirement-reconciliation.json"
          echo "deletable=$(jq -r '.counts.deletable' "$RUNNER_TEMP/branch-retirement-reconciliation.json")" >> "$GITHUB_OUTPUT"
          echo "already_absent=$(jq -r '.counts.alreadyAbsent' "$RUNNER_TEMP/branch-retirement-reconciliation.json")" >> "$GITHUB_OUTPUT"

      - name: Verify dry-run deletion plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$PAYLOAD_ROOT/tools/branch-retirement/delete-retired-branches.mjs" \
            --repository "$GITHUB_REPOSITORY" \
            --remote origin \
            --manifest "$RUNNER_TEMP/branch-retirement-reconciliation.json" \
            --execution-json "$RUNNER_TEMP/branch-retirement-dry-run.json" \
            --execution-markdown "$RUNNER_TEMP/branch-retirement-dry-run.md" \
            --dry-run
          jq -e '.status == "dry_run"' "$RUNNER_TEMP/branch-retirement-dry-run.json"
          test -z "$(git status --porcelain=v1)"

      - name: Atomically delete exact audited remote heads
        id: apply
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$PAYLOAD_ROOT/tools/branch-retirement/delete-retired-branches.mjs" \
            --repository "$GITHUB_REPOSITORY" \
            --remote origin \
            --manifest "$RUNNER_TEMP/branch-retirement-reconciliation.json" \
            --execution-json "$RUNNER_TEMP/branch-retirement-execution.json" \
            --execution-markdown "$RUNNER_TEMP/branch-retirement-execution.md" \
            --apply \
            --confirm-repository "$GITHUB_REPOSITORY"
          jq -e '.status == "success"' "$RUNNER_TEMP/branch-retirement-execution.json"
          jq -e '.remaining | length == 0' "$RUNNER_TEMP/branch-retirement-execution.json"
          echo "deleted=$(jq -r '.deleted | length' "$RUNNER_TEMP/branch-retirement-execution.json")" >> "$GITHUB_OUTPUT"

      - name: Record reconciliation and deletion evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/branch-retirement docs/release-evidence
          cp -R "$PAYLOAD_ROOT/tools/branch-retirement/." tools/branch-retirement/
          cp "$PAYLOAD_ROOT/docs/release-evidence/workflow-builder-skip-resume-readiness-supersession-2026-07-16.md" \
            docs/release-evidence/workflow-builder-skip-resume-readiness-supersession-2026-07-16.md
          cp "$RUNNER_TEMP/branch-retirement-reconciliation.json" \
            docs/release-evidence/branch-retirement-reconciliation-2026-07-16.json
          cp "$RUNNER_TEMP/branch-retirement-reconciliation.md" \
            docs/release-evidence/branch-retirement-reconciliation-2026-07-16.md
          cp "$RUNNER_TEMP/branch-retirement-execution.json" \
            docs/release-evidence/branch-retirement-execution-2026-07-16.json
          cp "$RUNNER_TEMP/branch-retirement-execution.md" \
            docs/release-evidence/branch-retirement-execution-2026-07-16.md

          main_protected=$(jq -r '.mainProtected' "$RUNNER_TEMP/branch-retirement-reconciliation.json")
          cat > docs/release-evidence/branch-retirement-review-2026-07-16.md <<EOF
          # Branch Retirement Whole-Diff Review

          - Repository: \`$GITHUB_REPOSITORY\`
          - Workflow run: \`$GITHUB_RUN_ID\`
          - Audited main: \`$(jq -r '.auditedMainSha' "$RUNNER_TEMP/branch-retirement-reconciliation.json")\`
          - Main protected: \`$main_protected\`
          - Deleted branches: \`${{ steps.apply.outputs.deleted }}\`
          - Already absent: \`${{ steps.audit.outputs.already_absent }}\`

          ## Findings

          | Severity | Count |
          | --- | ---: |
          | Critical | 0 |
          | Important | 0 |

          ## Decision

          The allowlist was evaluated from exact remote SHAs. Replacement PRs were merged, required current-main paths were present, temporary paths were absent, and open-PR/protected-target checks passed. The repository's main branch was not protected at execution time; the deletion adapter therefore relied on explicit default-branch exclusion, an exact non-pattern allowlist, per-ref force-with-lease, one atomic push, and pre/post main-SHA invariance. No sequential deletion fallback was used.
          EOF

          rm -f .github/workflows/retire-superseded-branches.yml
          rm -f .github/retirement/branch-retirement-payload.b64
          rmdir .github/retirement 2>/dev/null || true

          node --test tools/branch-retirement/test/*.test.mjs
          node --check tools/branch-retirement/audit-branch-retirement.mjs
          node --check tools/branch-retirement/delete-retired-branches.mjs
          git diff --check
          test ! -e .github/workflows/retire-superseded-branches.yml
          test ! -e .github/retirement/branch-retirement-payload.b64

      - name: Comment predecessor pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -c '.entries[] | select(.disposition != "already-absent")' \
            "$RUNNER_TEMP/branch-retirement-reconciliation.json" \
            | while IFS= read -r entry; do
                branch=$(jq -r '.branch' <<<"$entry")
                sha=$(jq -r '.remoteSha' <<<"$entry")
                disposition=$(jq -r '.disposition' <<<"$entry")
                prs=$(jq -r '.replacementPullRequests | map("#" + tostring) | join(", ")' <<<"$entry")
                pr=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&head=katamor1:$branch&per_page=100" --jq '.[0].number // empty' 2>/dev/null || true)
                if [[ -n "$pr" ]]; then
                  gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "Remote branch \`$branch\` at \`$sha\` was retired after exact-SHA reconciliation. Disposition: \`$disposition\`. Replacement/integration evidence: $prs. Durable audit and deletion records are being merged through this execution PR." || true
                fi
              done

      - name: Commit final tools and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: record guarded retirement of superseded branches"
          git push origin HEAD:integration/retire-superseded-branches-20260716
