name: agent-debug-automatic-pause-anchors

on:
  pull_request:
    paths:
      - ".github/workflows/agent-debug-automatic-pause-anchors.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/workflow-automatic-pause-limits-20260712
      - name: Count patch anchors
        shell: bash
        run: |
          python - <<'PY' > "$RUNNER_TEMP/anchors.txt"
          from pathlib import Path
          from textwrap import dedent

          checks = [
            ("schema internal", "extensions/workflow-register/src/core/schema/workflowSchema.ts", '        maxAgentStepsPerRun: { type: "number", exclusiveMinimum: 0 },'),
            ("schema public", "extensions/workflow-register/schema/workflow-register.v1.schema.json", '            "maxAgentStepsPerRun": { "type": "number", "exclusiveMinimum": 0 },'),
            ("local call", "extensions/workflow-register/src/core/engine/automaticPause.ts", "    const localTime = localTimeDecision(input.now, policy)\n"),
            ("local function", "extensions/workflow-register/src/core/engine/automaticPause.ts", dedent('''
              function localTimeDecision(now: Date, policy: AutomaticPausePolicySource): AutomaticPauseDecision | undefined {
                const { pauseAtLocalTime, timezone } = policy.limits
                if (!pauseAtLocalTime || !timezone) return undefined
                const localTime = formatLocalTime(now, timezone)
                if (minutesSinceMidnight(localTime) < minutesSinceMidnight(pauseAtLocalTime)) return undefined
                return {
                  kind: "pauseAtLocalTime",
                  source: policy.source,
                  limit: { pauseAtLocalTime, timezone },
                  observed: { localTime, timezone }
                }
              }
            ''').strip()),
            ("minutes helper", "extensions/workflow-register/src/core/engine/automaticPause.ts", "function minutesSinceMidnight(value: string): number {"),
            ("diagnostics import", "extensions/workflow-register/src/core/runDiagnostics.ts", 'import type { RunStepState, WorkflowRunState } from "./model"\n'),
            ("diagnostics options", "extensions/workflow-register/src/core/runDiagnostics.ts", '  durabilityByRunId?: Record<string, WorkflowRunDurabilitySummary>\n}'),
            ("diagnostics build", "extensions/workflow-register/src/core/runDiagnostics.ts", '      snapshots: options.snapshotsByRunId?.[run.runId] ?? [],\n      durability: options.durabilityByRunId?.[run.runId]\n'),
            ("diagnostics format", "extensions/workflow-register/src/core/runDiagnostics.ts", '  options: { snapshots?: TaskSnapshotSummary[]; durability?: WorkflowRunDurabilitySummary } = {}\n'),
            ("diagnostics pause", "extensions/workflow-register/src/core/runDiagnostics.ts", '  if (run.state["workflow.pause"]) lines.push("", "Pause:", ...formatJsonState(run.state["workflow.pause"]))\n'),
            ("diagnostics helper", "extensions/workflow-register/src/core/runDiagnostics.ts", 'function formatJsonState(value: string): string[] {\n'),
            ("inspect import", "extensions/workflow-register/src/commands/inspectRunDiagnostics.ts", 'import type { WorkflowRunDurabilitySummary } from "../core/runDiagnostics"\n'),
            ("inspect snapshots", "extensions/workflow-register/src/commands/inspectRunDiagnostics.ts", '  const snapshotsByRunId = Object.fromEntries(await Promise.all(runs.map(async (run) => [run.runId, await snapshotStore.listSnapshots(run.runId)] as const)))\n'),
            ("inspect report", "extensions/workflow-register/src/commands/inspectRunDiagnostics.ts", '    snapshotsByRunId,\n    durabilityByRunId,\n'),
            ("inspect diagnostics", "extensions/workflow-register/src/commands/inspectRunDiagnostics.ts", '      ...store.getLoadDiagnostics(),\n      ...durabilityDiagnostics\n'),
            ("run-control import", "extensions/workflow-register/src/commands/runControl.ts", 'import { prepareAutomaticPauseResume } from "./automaticPauseResumeUi"\n'),
            ("run-control lines", "extensions/workflow-register/src/commands/runControl.ts", '  const lines = [\n    `- runId: ${selection.runId}`,\n'),
          ]
          for name, path_value, anchor in checks:
              text = Path(path_value).read_text(encoding="utf-8")
              print(f"{name}: {text.count(anchor)}")
          print(f"run-control report exists: {Path('extensions/workflow-register/src/commands/runControlReport.ts').exists()}")
          PY
          cat "$RUNNER_TEMP/anchors.txt"
      - name: Upload anchor evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automatic-pause-anchor-counts
          path: ${{ runner.temp }}/anchors.txt
          if-no-files-found: error
          retention-days: 1
