name: bob-bazaar-review-iteration2-sync

on:
  push:
    branches:
      - agent/bob-bazaar-review-review-run-v3-iteration2
    paths:
      - ".github/workflows/bob-bazaar-review-iteration2-sync.yml"

permissions:
  contents: write

jobs:
  diagnose-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Iteration 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/bob-bazaar-review-review-run-v3-iteration2
          fetch-depth: 0
      - name: Diagnose merge with main
        shell: bash
        run: |
          set +e
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "MERGE_CLEAN=true" | tee -a "$GITHUB_ENV"
            git merge --abort 2>/dev/null || true
            exit 0
          fi
          echo "MERGE_CLEAN=false" | tee -a "$GITHUB_ENV"
          echo "## Iteration 2 / main merge conflicts" >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only --diff-filter=U | tee /tmp/iteration2-conflicts.txt
          sed 's/^/- `/' /tmp/iteration2-conflicts.txt | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
          git merge --abort 2>/dev/null || true
          exit 1
