name: bob-bazaar-review-iteration2-sync

on:
  push:
    branches:
      - agent/bob-bazaar-review-review-run-v3-iteration2
    paths:
      - ".github/workflows/bob-bazaar-review-iteration2-sync.yml"

permissions:
  contents: write

jobs:
  merge-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Iteration 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/bob-bazaar-review-review-run-v3-iteration2
          fetch-depth: 0

      - name: Merge main and resolve documentation conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git show HEAD:extensions/bob-bazaar-review/docs/real-machine-test-spec-ja.md > /tmp/iteration2-real-machine.md
          git show HEAD:extensions/bob-bazaar-review/docs/unit-test-spec-ja.md > /tmp/iteration2-unit-test.md

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -eq 0 ]; then
            echo "Expected documentation conflicts but merge completed cleanly; continuing with the clean merge."
          else
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            expected=(
              "extensions/bob-bazaar-review/README.md"
              "extensions/bob-bazaar-review/docs/real-machine-test-spec-ja.md"
              "extensions/bob-bazaar-review/docs/unit-test-spec-ja.md"
            )
            if [ "${conflicts[*]}" != "${expected[*]}" ]; then
              printf 'Unexpected conflicts:\n%s\n' "${conflicts[*]}"
              exit 1
            fi

            git checkout --ours extensions/bob-bazaar-review/README.md
            git checkout --theirs extensions/bob-bazaar-review/docs/real-machine-test-spec-ja.md
            git checkout --theirs extensions/bob-bazaar-review/docs/unit-test-spec-ja.md

            python - <<'PY'
          from pathlib import Path

          real_path = Path("extensions/bob-bazaar-review/docs/real-machine-test-spec-ja.md")
          real_main = real_path.read_text(encoding="utf-8")
          real_iter2 = Path("/tmp/iteration2-real-machine.md").read_text(encoding="utf-8")
          real_start = "### 6.6 Review Run Wizard v3 Iteration 2"
          real_end = "## 7. 実機テスト結果記録テンプレート"
          if real_start not in real_main:
              section = real_iter2[real_iter2.index(real_start):real_iter2.index(real_end)].rstrip() + "\n\n"
              real_main = real_main.replace(real_end, section + real_end, 1)
          real_main = real_main.replace(
              "本書は `extensions/bob-bazaar-review` の実機テスト仕様を定義する。",
              "本書は `extensions/bob-bazaar-review` の実機テスト仕様を定義する。Review Runの中断・再開・finalize・legacy recoveryも対象とする。",
              1,
          )
          acceptance_marker = "- Phase 1 record / triage / summary が `.bob-review-records` に保存できる。"
          acceptance_addition = "\n".join([
              acceptance_marker,
              "- Review Runの開始、画面間handoff、中断再開、decision validation、metrics、finalizeが合格する。",
              "- summary失敗時にrecordを保持し、失敗phaseから再試行できる。",
              "- legacy recoveryが確認付きかつ非破壊である。",
          ])
          if "- Review Runの開始、画面間handoff" not in real_main:
              real_main = real_main.replace(acceptance_marker, acceptance_addition, 1)
          real_main = real_main.replace(
              "| P0 | 起動、project rules 初期化、GUI packet 生成、direct reviewRevision、capture、validation。 |",
              "| P0 | 起動、project rules初期化、Review Run開始、packet、capture、Human Triage、標準finalize。 |",
              1,
          )
          real_main = real_main.replace(
              "| P1 | workflow-register provider、Bob Workflow UI、MCP initialize / tools/list、multi-root、Phase 1 record / triage / summary。 |",
              "| P1 | 中断再開、summary failure retry、legacy recovery、workflow provider、MCP、multi-root。 |",
              1,
          )
          real_path.write_text(real_main, encoding="utf-8")

          unit_path = Path("extensions/bob-bazaar-review/docs/unit-test-spec-ja.md")
          unit_main = unit_path.read_text(encoding="utf-8")
          unit_iter2 = Path("/tmp/iteration2-unit-test.md").read_text(encoding="utf-8")
          unit_start = "### BZR-UT-042 Review Run: progressとIteration 1互換を維持する"
          unit_end = "## 4.1 実テスト対応表"
          if unit_start not in unit_main:
              section = unit_iter2[unit_iter2.index(unit_start):unit_iter2.index(unit_end)].rstrip() + "\n\n"
              unit_main = unit_main.replace(unit_end, section + unit_end, 1)
          unit_main = unit_main.replace(
              "| review record / triage / campaign summary | BZR-UT-039〜040 |",
              "| review record / triage / campaign summary | BZR-UT-039〜040、045 |",
              1,
          )
          table_marker = "| docs / source layout contracts | BZR-UT-036 |"
          table_rows = "\n".join([
              "| Review Run progress / metrics / stale write / finalize | BZR-UT-042〜046 | `test/reviewRunState.test.js`, `test/reviewRunMetrics.test.js`, `test/reviewRunStore.test.js`, `test/reviewRunFinalize.test.js` |",
              "| Review Run resume / legacy recovery / GUI contract | BZR-UT-047〜048 | `test/reviewRunResume.test.js`, `test/reviewRunRecovery.test.js`, `test/guiFirstSurfaces.test.js` |",
              table_marker,
          ])
          if "| Review Run progress / metrics / stale write / finalize |" not in unit_main:
              unit_main = unit_main.replace(table_marker, table_rows, 1)
          nonfunctional_marker = "- file path のテストは Windows / POSIX 差異を吸収する。"
          if "- Review Runのartifact testは一時workspace内で行い" not in unit_main:
              unit_main = unit_main.replace(
                  nonfunctional_marker,
                  nonfunctional_marker + "\n- Review Runのartifact testは一時workspace内で行い、symlink / stale write / failure retryを外部状態へ依存せず再現する。",
                  1,
              )
          completion_marker = "- readonly 境界、path validation、workspace 分離、result 保存が回帰テストで守られる。"
          if "- Review Runの再開、metrics、decision validation" not in unit_main:
              unit_main = unit_main.replace(
                  completion_marker,
                  completion_marker + "\n- Review Runの再開、metrics、decision validation、finalize retry、legacy recoveryが回帰テストで守られる。",
                  1,
              )
          unit_path.write_text(unit_main, encoding="utf-8")
          PY

            git add extensions/bob-bazaar-review/README.md \
              extensions/bob-bazaar-review/docs/real-machine-test-spec-ja.md \
              extensions/bob-bazaar-review/docs/unit-test-spec-ja.md
          fi

          rm -f .github/diagnostics/bob-bazaar-review-iteration2-conflicts.txt
          git rm -f .github/workflows/bob-bazaar-review-iteration2-sync.yml
          git add -A

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-bazaar-review/package-lock.json

      - name: Install dependencies
        working-directory: extensions/bob-bazaar-review
        run: npm ci

      - name: Full bob-bazaar-review gate
        working-directory: extensions/bob-bazaar-review
        shell: bash
        run: |
          npm test
          npm run dependency:policy
          npm run architecture:policy
          npm run source:policy
          npm run unused:report
          npm run unused:policy
          npm run artifact:policy
          npm run audit:prod
          npm run package
          npm run package:policy
          npm run package:metrics

      - name: Commit and push synchronized Iteration 2
        shell: bash
        run: |
          git commit -m "merge: synchronize Review Run Iteration 2 with main"
          git push origin HEAD:agent/bob-bazaar-review-review-run-v3-iteration2
