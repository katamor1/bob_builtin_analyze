name: Apply evidence scope Phase 5 records

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e
    paths:
      - .github/workflows/apply-evidence-scope-phase5-records.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Install Phase 5 records
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .github/phase5-records-payload.tar.gz
          rm -f \
            .github/phase5-records-payload.tar.gz \
            .github/workflows/apply-evidence-scope-phase5-records.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/phase5-records-payload.tar.gz \
            .github/workflows/apply-evidence-scope-phase5-records.yml \
            docs/superpowers/specs/2026-07-12-bob-evidence-scope-phase5-design.md \
            docs/superpowers/plans/2026-07-12-bob-evidence-scope-phase5.md \
            docs/implementation/bob-evidence-scope-phase5-2026-07-12.md \
            docs/implementation/bob-evidence-scope-phase5-verification-2026-07-12.md
          git commit -m 'docs: record bob evidence scope phase 5 checkpoint'
          git push origin HEAD:codex/execute-shared-plan-6a53743e
