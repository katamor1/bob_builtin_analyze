name: agent-apply-document-fixtures

on:
  pull_request:
    paths:
      - ".github/workflows/agent-apply-document-fixtures.yml"

permissions:
  contents: write

jobs:
  build-workflow-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Prepare final workflow tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/extensions-quality.yml')
          old = 'run: node --test scripts/real-machine-test-environment.test.js'
          new = 'run: node --test scripts/real-machine-test-environment.test.js scripts/real-machine-input-document-fixtures.test.js'
          text = path.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'expected one CI command anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

          base_commit=$(git rev-parse HEAD)
          base_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$base_commit" --jq '.tree.sha')
          workflow_blob=$(base64 -w 0 .github/workflows/extensions-quality.yml | \
            jq -Rs '{content: ., encoding: "base64"}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')

          new_tree=$(jq -n \
            --arg base "$base_tree" \
            --arg blob "$workflow_blob" \
            '{base_tree: $base, tree: [
              {path: ".github/workflows/extensions-quality.yml", mode: "100644", type: "blob", sha: $blob},
              {path: ".github/workflows/agent-export-branch.yml", mode: "100644", type: "blob", sha: null},
              {path: ".github/workflows/agent-apply-document-fixtures.yml", mode: "100644", type: "blob", sha: null}
            ]}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')

          new_commit=$(jq -n \
            --arg message 'ci: finalize document fixture validation workflow' \
            --arg tree "$new_tree" \
            --arg parent "$base_commit" \
            '{message: $message, tree: $tree, parents: [$parent]}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')

          printf '%s\n' "$new_commit" > workflow-commit-sha.txt
          echo "WORKFLOW_COMMIT=$new_commit"

      - name: Upload workflow commit SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: document-fixtures-workflow-commit
          path: workflow-commit-sha.txt
          if-no-files-found: error
          retention-days: 1
