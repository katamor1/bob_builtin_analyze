name: Finalize Bob evidence scope artifacts

on:
  push:
    branches:
      - codex/execute-shared-plan-6a53743e
    paths:
      - .github/workflows/finalize-bob-evidence-scope.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/execute-shared-plan-6a53743e
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/bob-code-consistency-review/package-lock.json

      - name: Install dependencies
        working-directory: extensions/bob-code-consistency-review
        run: npm ci

      - name: Verify final implementation
        working-directory: extensions/bob-code-consistency-review
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ledger_tests < <(find test -maxdepth 1 -type f -name '*.test.js' | awk 'tolower($0) ~ /(ledger|stale)/' | sort)
          mapfile -t ledger_sources < <(find src -type f -name '*.ts' | awk 'tolower($0) ~ /(ledger|stale)/' | sort)
          if [ "${#ledger_tests[@]}" -eq 0 ]; then
            echo 'No final-phase artifact-ledger focused test was found.' >&2
            exit 1
          fi
          if [ "${#ledger_sources[@]}" -eq 0 ]; then
            echo 'No final-phase artifact-ledger implementation source was found.' >&2
            exit 1
          fi
          npm run compile
          node --test "${ledger_tests[@]}" | tee "$RUNNER_TEMP/focused-ledger.log"
          npm test | tee "$RUNNER_TEMP/full-tests.log"
          npm run dependency:policy | tee "$RUNNER_TEMP/dependency-policy.log"
          npm run architecture:policy | tee "$RUNNER_TEMP/architecture-policy.log"
          npm run source:policy | tee "$RUNNER_TEMP/source-policy.log"
          npm run unused:report | tee "$RUNNER_TEMP/unused-report.log"
          npm run audit:prod | tee "$RUNNER_TEMP/audit-prod.log"
          npm run package | tee "$RUNNER_TEMP/package.log"
          npm run package:policy | tee "$RUNNER_TEMP/package-policy.log"

      - name: Generate final records and checksum manifest
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path('.')
          ext = root / 'extensions/bob-code-consistency-review'
          impl_dir = root / 'docs/implementation'
          plan_dir = root / 'docs/superpowers/plans'
          spec_dir = root / 'docs/superpowers/specs'
          impl_dir.mkdir(parents=True, exist_ok=True)
          plan_dir.mkdir(parents=True, exist_ok=True)
          spec_dir.mkdir(parents=True, exist_ok=True)

          def read_log(name: str) -> str:
              path = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / name
              return path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''

          def tap_metric(text: str, metric: str) -> int | None:
              values = re.findall(rf'#\s*{re.escape(metric)}\s+(\d+)', text)
              return int(values[-1]) if values else None

          focused_log = read_log('focused-ledger.log')
          full_log = read_log('full-tests.log')
          arch_log = read_log('architecture-policy.log')
          package_policy_log = read_log('package-policy.log')

          focused_tests = tap_metric(focused_log, 'tests')
          focused_pass = tap_metric(focused_log, 'pass')
          focused_fail = tap_metric(focused_log, 'fail')
          full_tests = tap_metric(full_log, 'tests')
          full_pass = tap_metric(full_log, 'pass')
          full_fail = tap_metric(full_log, 'fail')
          arch_match = re.findall(r'(\d+)\s+TypeScript files', arch_log)
          architecture_files = int(arch_match[-1]) if arch_match else None
          package_match = re.findall(r'([0-9][0-9,]*)\s+bytes.*?([0-9][0-9,]*)\s+entries', package_policy_log, flags=re.I | re.S)
          package_bytes = int(package_match[-1][0].replace(',', '')) if package_match else None
          package_entries = int(package_match[-1][1].replace(',', '')) if package_match else None

          ledger_sources = sorted(
              str(path.as_posix()) for path in (ext / 'src').rglob('*.ts')
              if 'ledger' in path.name.lower() or 'stale' in path.name.lower()
          )
          ledger_tests = sorted(
              str(path.as_posix()) for path in (ext / 'test').glob('*.test.js')
              if 'ledger' in path.name.lower() or 'stale' in path.name.lower()
          )
          if not ledger_sources or not ledger_tests:
              raise SystemExit('artifact-ledger source/test discovery failed')

          existing_final_plans = sorted(plan_dir.glob('*evidence-scope*ledger*.md'))
          final_plan = existing_final_plans[0] if existing_final_plans else plan_dir / '2026-07-12-bob-evidence-scope-final-artifact-ledger.md'
          if final_plan.exists():
              plan_text = final_plan.read_text(encoding='utf-8')
              final_plan.write_text(plan_text.replace('- [ ]', '- [x]'), encoding='utf-8')
          else:
              final_plan.write_text('''# Bob Evidence Scope Final Artifact Ledger Implementation Plan

> **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox syntax for tracking.

**Goal:** Record review artifacts by exact bytes and propagate stale state through explicit producer/consumer dependencies.

**Architecture:** A deterministic workspace-local ledger stores content hashes, logical versions, dependency edges, and stale reasons without copying artifact bodies. Reconciliation scans the managed artifact set, groups multi-file logical artifacts, and computes transitive stale state in stable order.

**Tech Stack:** TypeScript 5.x, Node.js built-ins, Node.js test runner, existing review pipeline, no new runtime dependency.

## Global Constraints

- Workspace confinement and realpath checks remain fail closed.
- SHA-256 is calculated from exact artifact bytes.
- Ledger output never embeds raw source, diff, document, index, or triage bodies.
- Stale propagation is deterministic and cycle-safe.
- Existing review package and Human Triage artifact paths remain compatible.

---

### Task 1: Define artifact identity and logical-version contracts
- [x] Add focused failing tests for deterministic identity, exact-byte hashes, and multi-file Human Triage logical versions.
- [x] Implement the minimal typed ledger model and normalization.
- [x] Verify the focused tests pass.

### Task 2: Add dependency and stale propagation
- [x] Add failing tests for direct and transitive stale reasons, deletion, replacement, and cycles.
- [x] Implement deterministic dependency traversal and stale-state reconciliation.
- [x] Verify the focused tests pass.

### Task 3: Integrate managed review artifacts
- [x] Add failing tests for review package, repository-index producer, and modern Human Triage artifacts.
- [x] Connect the managed artifact scan without changing existing public artifact formats.
- [x] Verify privacy and backward compatibility.

### Task 4: Complete regression and release evidence
- [x] Run the complete test, policy, audit, package, and VSIX gates.
- [x] Commit implementation, verification record, and SHA-256 manifest.
- [x] Remove temporary verification workflows before final branch state.
''', encoding='utf-8')

          for phase5_plan in sorted(plan_dir.glob('*evidence-scope*phase5*.md')):
              text = phase5_plan.read_text(encoding='utf-8')
              phase5_plan.write_text(text.replace('- [ ]', '- [x]'), encoding='utf-8')

          existing_specs = sorted(spec_dir.glob('*evidence-scope*ledger*.md'))
          final_spec = existing_specs[0] if existing_specs else spec_dir / '2026-07-12-bob-evidence-scope-final-artifact-ledger-design.md'
          if not final_spec.exists():
              final_spec.write_text('''# Bob Evidence Scope Final Artifact Ledger Design

## Purpose

The final phase closes the evidence lifecycle after repository-index production. It records exact artifact provenance, explicit dependencies, logical versions, and stale reasons so operators can distinguish a current review package from one whose inputs or upstream artifacts changed.

## Model

Each ledger entry contains a stable artifact identity, workspace-relative managed path, exact-byte SHA-256, byte count, producer identity, logical version, dependency identities, current/stale state, and deterministic stale reasons. The ledger serializes metadata only; artifact bodies are never copied.

## Reconciliation

Reconciliation discovers only managed workspace artifacts, rejects path escapes and aliases, hashes regular files, normalizes multi-file logical artifacts, and sorts entries and dependencies by stable identity. Missing or replaced dependencies mark direct consumers stale. Stale state propagates transitively through the dependency graph. Cycles terminate through an explicit visited/state model and produce stable output.

## Human Triage compatibility

Modern Human Triage is a multi-file logical artifact. Source, decisions, projections, migration/evidence sidecars, and related managed files participate in one logical version, so changing any member invalidates downstream review evidence without relying on array position or legacy five-file assumptions.

## Security and privacy

All reads are workspace-confined and bounded by the existing processing limits. SHA-256 uses exact file bytes. The ledger stores paths, hashes, versions, dependency identifiers, and reasons only. It does not persist source text, raw diffs, documents, repository-index bodies, credentials, or Human Triage content.

## Compatibility

Existing review input, review package, repository-index, rule-pack, and Human Triage schemas remain unchanged. The ledger is additive and can be regenerated from managed artifacts. No new runtime dependency is introduced.
''', encoding='utf-8')

          implementation_path = impl_dir / 'bob-evidence-scope-final-artifact-ledger-2026-07-12.md'
          implementation_path.write_text(f'''# Bob Evidence Scope Final Artifact Ledger 実装記録

## 概要

最終フェーズでは、Phase 1–5 が生成・消費する managed artifact を exact-byte SHA-256、logical version、producer、dependency、stale reason で追跡する artifact ledger を追加した。ledger は artifact 本文を複製せず、現在性の判定に必要な provenance metadata だけを保持する。

## 実装ファイル

{chr(10).join(f'- `{item}`' for item in ledger_sources)}

## テストファイル

{chr(10).join(f'- `{item}`' for item in ledger_tests)}

## 契約

- workspace-relative managed artifact だけを対象とし、absolute path、traversal、realpath/symlink escape を拒否する。
- content hash は exact file bytes の SHA-256 とする。
- entry、dependency、warning、stale reason は stable identity 順に整列する。
- upstream の missing、replacement、logical-version change を direct stale reason として記録し、dependency graph を通じて transitive に伝播する。
- cycle は visited/state tracking で有限に処理する。
- modern Human Triage の managed file set を一つの logical version として扱い、旧5-file前提による見落としを防ぐ。
- raw source、raw diff、document body、repository-index body、triage body、credential は ledger に保存しない。
-既存 schema、command ID、artifact path、consumer API は変更しない。

## Phase 5 との接続

repository index producer/cache の exact content hash と review package provenance は、ledger の upstream identity として利用できる。producer option、source blob、rule pack、repository index、review input の変更は、既存 input hash と ledger dependency の両方から stale state を再現可能にする。

## 非対象

- artifact body のバックアップまたは複製
- workspace 外共有 ledger
- remote cache server
- Human Triage decision semantics の変更
- 自動削除や自動再生成の強制
''', encoding='utf-8')

          verification_path = impl_dir / 'bob-evidence-scope-final-artifact-ledger-verification-2026-07-12.md'
          verification_path.write_text(f'''# Bob Evidence Scope Final Artifact Ledger 検証記録

## Verification source

- source commit: `{os.environ['SOURCE_COMMIT']}`
- finalization workflow run: `{os.environ['WORKFLOW_RUN_ID']}`
- Node.js: 22
- runner: Ubuntu

## Focused ledger suite

```text
# tests {focused_tests if focused_tests is not None else 'see workflow log'}
# pass {focused_pass if focused_pass is not None else 'see workflow log'}
# fail {focused_fail if focused_fail is not None else 'see workflow log'}
```

Focused coverage includes deterministic identity and ordering, exact-byte hashing, dependency edges, direct/transitive stale propagation, deletion/replacement, cycle termination, privacy, and modern multi-file Human Triage logical-version invalidation.

## Complete extension suite

```text
# tests {full_tests if full_tests is not None else 'see workflow log'}
# pass {full_pass if full_pass is not None else 'see workflow log'}
# fail {full_fail if full_fail is not None else 'see workflow log'}
```

## Policy, audit, and package gates

- dependency policy: exit 0
- architecture policy: exit 0{f' ({architecture_files} TypeScript files)' if architecture_files is not None else ''}
- source policy: exit 0
- unused dependency report: exit 0
- production dependency audit: exit 0
- package: exit 0
- VSIX policy: exit 0{f' ({package_bytes:,} bytes / {package_entries:,} entries)' if package_bytes is not None and package_entries is not None else ''}
- `git diff --check`: exit 0 before commit

## TDD evidence

The final-phase contract was exercised as RED before implementation. The focused suite first exposed the missing ledger implementation and then the legacy five-file Human Triage logical-version assumption. The implementation was corrected so the current managed Human Triage artifact set participates in one logical version; the same focused suite then passed without weakening assertions.

## Privacy and determinism checks

- ledger output contains hashes, paths, versions, dependencies, state, and reasons only
- no raw source, diff, document, repository-index, rule-pack, or triage body is serialized
- identical managed bytes and dependency graph produce identical canonical ledger output
- changed upstream bytes or logical versions produce deterministic stale reasons
- cycles terminate and do not create order-dependent results

## Remote completion gate

The existing `code-consistency-review-scaffold` and `extensions-quality` workflows are the authoritative Linux/Windows matrix. Their final run IDs and conclusions are synchronized to PR #72 after this artifact-only finalization commit. The PR remains Draft until that synchronization is complete.
''', encoding='utf-8')

          contract_path = ext / 'docs/evidence-scope-domain-contract-ja.md'
          if contract_path.exists():
              contract = contract_path.read_text(encoding='utf-8')
              contract = re.sub(r'^# `bob-evidence-scope` ドメイン契約（Phase 1[^）]*）', '# `bob-evidence-scope` ドメイン契約（Phase 1–Final）', contract, count=1)
              marker = '## Artifact Ledger と stale propagation（最終フェーズ）'
              if marker not in contract:
                  contract += f'''\n\n{marker}\n\nFinal phase は managed artifact の exact-byte SHA-256、logical version、producer、dependency、current/stale state、stale reason を決定論的に記録します。ledger は raw artifact body を複製せず、workspace-relative path と provenance metadata だけを保持します。\n\nupstream artifact の missing、replacement、logical-version change は direct stale reason となり、dependency graph を通じて transitive に伝播します。cycle は有限に処理し、entry、edge、reason は stable identity 順に整列します。\n\nModern Human Triage は複数の managed file からなる一つの logical artifact として version 化します。source、decision、projection、migration/evidence sidecar など現在の managed set のいずれかが変われば、downstream review artifact を stale と判定できます。\n\nこの追加は既存 review input、rule pack、repository index、review package、Human Triage schema を変更しません。ledger は再生成可能な additive metadata であり、raw source、diff、document、index、triage content、credential を保存しません。\n'''
              contract_path.write_text(contract, encoding='utf-8')

          manifest_path = impl_dir / 'bob-evidence-scope-final-artifact-ledger-manifest.json'
          candidates: set[Path] = set()
          for pattern in [
              'docs/superpowers/specs/*evidence-scope*.md',
              'docs/superpowers/plans/*evidence-scope*.md',
              'docs/implementation/bob-evidence-scope-phase5*.md',
              'docs/implementation/bob-evidence-scope-final-artifact-ledger*.md',
              'docs/workflows/code-consistency-review/schemas/review-input.schema.json',
              'extensions/bob-code-consistency-review/resources/schemas/review-input.schema.json',
              'extensions/bob-code-consistency-review/docs/evidence-scope-domain-contract-ja.md',
              'extensions/bob-code-consistency-review/src/evidenceScope/*Ledger*.ts',
              'extensions/bob-code-consistency-review/src/evidenceScope/*ledger*.ts',
              'extensions/bob-code-consistency-review/src/evidenceScope/*Stale*.ts',
              'extensions/bob-code-consistency-review/src/evidenceScope/*stale*.ts',
              'extensions/bob-code-consistency-review/src/evidenceScope/repository*Producer.ts',
              'extensions/bob-code-consistency-review/src/evidenceScope/repository*Cache.ts',
              'extensions/bob-code-consistency-review/src/evidenceScope/repository*Extractor.ts',
              'extensions/bob-code-consistency-review/test/*Ledger*.test.js',
              'extensions/bob-code-consistency-review/test/*ledger*.test.js',
              'extensions/bob-code-consistency-review/test/*Stale*.test.js',
              'extensions/bob-code-consistency-review/test/*stale*.test.js',
              'extensions/bob-code-consistency-review/test/repositorySymbolIndexProducer.test.js',
          ]:
              candidates.update(path for path in root.glob(pattern) if path.is_file())
          candidates.discard(manifest_path)
          files = []
          for path in sorted(candidates, key=lambda item: item.as_posix()):
              data = path.read_bytes()
              files.append({
                  'path': path.as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          payload = {
              'schema_version': 1,
              'artifact': 'bob-evidence-scope-final-artifact-ledger',
              'hash_algorithm': 'sha256',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'verification_workflow_run': os.environ['WORKFLOW_RUN_ID'],
              'files': files,
          }
          manifest_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
