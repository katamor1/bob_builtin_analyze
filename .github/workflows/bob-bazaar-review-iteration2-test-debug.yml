name: bob-bazaar-review-iteration2-test-debug

on:
  pull_request:
    paths:
      - "extensions/bob-bazaar-review/**"
      - ".github/workflows/bob-bazaar-review-iteration2-test-debug.yml"

permissions:
  contents: write

jobs:
  apply-and-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply coordinator compile fix
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("extensions/bob-bazaar-review/src/reviewRuns/reviewRunCoordinator.ts")
          s = p.read_text()
          marker = "\n".join([
              '  if (!result.jsonPath || !result.markdownPath) {',
              '    throw new Error("Captured review result paths are required")',
              '  }',
              ''
          ])
          insertion = "\n".join([
              '  const jsonPath = result.jsonPath',
              '  const markdownPath = result.markdownPath',
              '  const metadataPath = result.metadataPath',
              ''
          ])
          if 'const jsonPath = result.jsonPath' not in s:
              if marker not in s:
                  raise SystemExit("result path guard not found")
              s = s.replace(marker, marker + insertion, 1)
          s = s.replace(
              'toWorkspaceRelativeArtifactPath(latest.workspaceRoot, result.jsonPath)',
              'toWorkspaceRelativeArtifactPath(latest.workspaceRoot, jsonPath)',
              1
          )
          s = s.replace(
              'toWorkspaceRelativeArtifactPath(latest.workspaceRoot, result.markdownPath)',
              'toWorkspaceRelativeArtifactPath(latest.workspaceRoot, markdownPath)',
              1
          )
          s = s.replace(
              'reviewResultMetadataPath: result.metadataPath\n          ? toWorkspaceRelativeArtifactPath(latest.workspaceRoot, result.metadataPath)',
              'reviewResultMetadataPath: metadataPath\n          ? toWorkspaceRelativeArtifactPath(latest.workspaceRoot, metadataPath)',
              1
          )
          p.write_text(s)
          PY
      - name: Commit and push fix
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/bob-bazaar-review/src/reviewRuns/reviewRunCoordinator.ts
          git commit -m "fix: narrow Review Run result artifact paths"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-bazaar-review/package-lock.json
      - name: Install dependencies
        working-directory: extensions/bob-bazaar-review
        run: npm ci
      - name: Capture npm test output
        working-directory: extensions/bob-bazaar-review
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          printf '%s\n' "$status" > test-exit-code.txt
          exit 0
      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: bob-bazaar-review-iteration2-test-output
          path: |
            extensions/bob-bazaar-review/test-output.txt
            extensions/bob-bazaar-review/test-exit-code.txt
            extensions/bob-bazaar-review/src/reviewRuns/reviewRunCoordinator.ts
          if-no-files-found: error
