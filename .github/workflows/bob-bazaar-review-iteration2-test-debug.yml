name: bob-bazaar-review-iteration2-test-debug

on:
  pull_request:
    paths:
      - "extensions/bob-bazaar-review/**"
      - ".github/workflows/bob-bazaar-review-iteration2-test-debug.yml"

permissions:
  contents: write

jobs:
  apply-and-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply Review Run normalization fix
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("extensions/bob-bazaar-review/src/reviewRuns/reviewRunState.ts")
          s = p.read_text()
          old = "\n".join([
              'function normalizePhaseProgress(value: any, fallback: ReviewRunPhaseMap[ReviewRunTrackedPhase]) {',
              '  if (!value || typeof value !== "object" || !isReviewRunPhaseStatus(value.status)) return { ...fallback }',
              '  return {',
              '    status: value.status,',
              '    startedAt: typeof value.startedAt === "string" ? value.startedAt : undefined,',
              '    completedAt: typeof value.completedAt === "string" ? value.completedAt : undefined,',
              '    issue: typeof value.issue === "string" ? value.issue : undefined',
              '  }',
              '}'
          ])
          new = "\n".join([
              'function normalizePhaseProgress(value: any, fallback: ReviewRunPhaseMap[ReviewRunTrackedPhase]) {',
              '  if (!value || typeof value !== "object" || !isReviewRunPhaseStatus(value.status)) return { ...fallback }',
              '  return {',
              '    status: value.status,',
              '    ...(typeof value.startedAt === "string" ? { startedAt: value.startedAt } : {}),',
              '    ...(typeof value.completedAt === "string" ? { completedAt: value.completedAt } : {}),',
              '    ...(typeof value.issue === "string" ? { issue: value.issue } : {})',
              '  }',
              '}'
          ])
          if old not in s:
              raise SystemExit("normalizePhaseProgress block not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push fix
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/bob-bazaar-review/src/reviewRuns/reviewRunState.ts
          git commit -m "fix: preserve Review Run phase shape on read"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/bob-bazaar-review/package-lock.json
      - name: Install dependencies
        working-directory: extensions/bob-bazaar-review
        run: npm ci
      - name: Capture npm test output
        working-directory: extensions/bob-bazaar-review
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          printf '%s\n' "$status" > test-exit-code.txt
          exit 0
      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: bob-bazaar-review-iteration2-test-output
          path: |
            extensions/bob-bazaar-review/test-output.txt
            extensions/bob-bazaar-review/test-exit-code.txt
          if-no-files-found: error
